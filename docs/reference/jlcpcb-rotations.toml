# JLCPCB placement rotation, per LCSC part.
#
# JLCPCB's assembly line places each part as LCSC's own (EasyEDA) footprint
# draws it, not as KiCad's does. Where the two put pin 1 in different places,
# the CPL rotation is KiCad's plus `rotation` (degrees, counter-clockwise, as
# KiCad's position file counts them). The offset belongs to the LCSC number,
# not to the KiCad footprint: LCSC draws the PCA9685PW with pin 1 top-left and
# the TCA9548APWR with pin 1 bottom-left, both on TSSOP.
#
# kicad.jlc writes cpl-jlc.csv with these, and fails on any placed LCSC number
# missing here, or listed with a different KiCad footprint: an unchecked offset
# is a part soldered at 90 or 180 degrees, which no gate before JLCPCB's
# preview sees. test_jlc holds every LCSC number a tracked hardware.toml or the
# parts registry uses to an entry here.
#
# Each entry was derived by `kicad.lcsc_rotation`: it fetches LCSC's footprint,
# turns it by 0, 90, 180 and 270 degrees, and keeps the turn that lands every
# numbered KiCad pad on the LCSC pad of the same number (`max_err_mm` is the
# worst pad-centre distance left; hand-solder pads are longer, hence the
# 0.2-0.4 mm on the two-pad parts). Matching pad numbers proves pin 1 lands on
# pin 1; for the polarised parts the LCSC footprint's own marks were also read
# (2026-10-19): the "+" and the band or chamfered corners sit at pad 1 on the
# tantalum and both electrolytics, the cathode bar at pad 1 on the SOD-123,
# as KiCad has them.
#
#   PYTHONPATH=tools python3 -m kicad.lcsc_rotation C130026 Package_SO:TSSOP-24_4.4x7.8mm_P0.65mm
#   PYTHONPATH=tools python3 -m kicad.lcsc_rotation --check   # re-derive every entry (network)
#
# lcsc_footprint is LCSC's package name, for reading; checked is the date.

# --- Chips --------------------------------------------------------------------

[C130026] # TCA9548APWR
footprint = "Package_SO:TSSOP-24_4.4x7.8mm_P0.65mm"
lcsc_footprint = "TSSOP-24_L7.8-W4.4-P0.65-LS6.4-BL"
rotation = 270
max_err_mm = 0.16
checked = "2026-10-19"

