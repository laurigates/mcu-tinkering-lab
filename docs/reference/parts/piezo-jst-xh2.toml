# Piezo buzzer, off-board, on a JST-XH 2-pin lead.
[part]
name = "Piezo buzzer on JST-XH 2"
source = "KiCad 10.0.6 library: Device:Buzzer names pin 1 + and pin 2 -; the lead puts the buzzer's + on connector pin 1 (this repo's cable convention, #750)"
symbol = "Device:Buzzer"
footprint = "Connector_JST:JST_XH_B2B-XH-A_1x02_P2.50mm_Vertical"

[pins]
"+" = 1
"-" = 2
