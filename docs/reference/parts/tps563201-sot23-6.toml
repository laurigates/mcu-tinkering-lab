# TPS563201 3 A synchronous buck converter, SOT-23-6: the integrated carrier's
# 5 V supply, replacing the LM2596 module and its lead. KiCad's TPS563201
# symbol is derived (`extends`), which the vendored subset rejects; it extends
# TPS562200, whose pins and footprint it shares.
[part]
name = "TPS563201 buck converter, SOT-23-6"
source = "KiCad 10.0.6 library: Regulator_Switching:TPS562200 (TPS563201 extends it; GND 1, SW 2, VIN 3, VFB 4, EN 5, VBST 6) and Package_TO_SOT_SMD:SOT-23-6; pin order checked against TI SLVSD90B Table 4-1"
symbol = "Regulator_Switching:TPS562200"
footprint = "Package_TO_SOT_SMD:SOT-23-6"
value = "TPS563201"

[pins]
GND = 1
SW = 2
VIN = 3
VFB = 4
EN = 5
VBST = 6
