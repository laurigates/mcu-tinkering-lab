# Speaker lead on a JST-XH 2: the integrated carrier's amplifier output, where
# the socketed carrier uses the MAX98357A breakout's own screw terminal.
[part]
name = "Speaker on JST-XH 2"
source = "this repo's cable convention: the amplifier's OUTP on connector pin 1. A bridge-tied load has no ground side; swapping the lead only inverts the speaker's phase"
symbol = "Connector_Generic:Conn_01x02"
footprint = "Connector_JST:JST_XH_B2B-XH-A_1x02_P2.50mm_Vertical"

[pins]
"VO+" = 1
"VO-" = 2
