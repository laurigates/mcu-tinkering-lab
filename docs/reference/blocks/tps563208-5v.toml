# TPS563208 synchronous buck, 5 V at up to 3 A, from a 2S pack or any
# 6.7-17 V input. First used on robocar-unified-integrated (U10); the values
# are TI SLVSD90B Table 7-2's 5 V row.
#
# Output: Table 7-2 gives R1 54.9 kΩ over R2 10 kΩ (VFB 0.768 V, so 4.98 V).
# fb_top is 56 kΩ instead: 5.07 V typical, 4.94-5.19 V over VFB's 749-787 mV.
# A project whose load needs a different margin overrides fb_top's value. The
# 5 V and 6.5 V rows share L and Cout. L 3.3-4.7 µH, and 20-68 µF of low-ESR
# output capacitance (cout1-3).
#
# The TPS563208, not the TPS563201: the same pins and table, but
# forced-continuous, so it sinks current as well as sourcing it. A motor that
# brakes or reverses pushes energy back into the 5 V rail through its driver's
# body diodes, and a pulse-skipping converter would leave it to charge the
# rail. D-CAP2's stability rests on the L x Cout double pole, so no large
# low-ESR bulk capacitor may sit on VOUT: bulk there should be MnO2 tantalum,
# whose ~1.5 Ω ESR damps rather than moves that pole (bench-check a 0.2-2 A
# load step). Input bulk (an electrolytic sized to the pack's leads) is the
# project's, on VIN.
#
# Input: the buck needs VIN >= VOUT / 0.75 (SLVSD90B §7.3, the 75 % maximum
# recommended duty cycle): 6.7 V, 3.3 V per 2S cell. Below that VOUT sags with
# the pack. VIN's absolute maximum is 19 V and its operating range 4.5-17 V: a
# 3S pack's hot-plug ring (about 25 V) is outside it, so a 3S project needs
# another block (#976).
#
# EN goes through a divider (en_top/en_bot) so the converter stops drawing from
# a flat pack. EN has its own resistance to GND (REN 600-2400 kΩ, 1500
# typical, SLVSD90B 5.5) in parallel with en_bot, and rises at 1.38-1.47 V
# typical (Figure 5-4, VENH 1.6 V maximum) and falls at 1.05-1.2 V (Figure
# 5-3). 100 kΩ over 36 kΩ turns it on at about 5.5 V typical and is guaranteed
# on by 6.3 V (1.6 V across 36 kΩ || 600 kΩ), under the 6.7 V where the buck
# regulates; 30 kΩ guaranteed it only by 7.2 V, so a part-charged pack might
# not start (robocar pre-fab layout review, m6). It falls at about 4.0-4.6 V:
# a coarse cutoff with no specified falling threshold, so the pack's own BMS
# stays the undervoltage protection.
#
# Layout (not checked by the block): cin2, the 10 µF beside VIN, takes the
# tightest input loop; TI asks for over 10 µF of ceramic as the decoupling
# capacitor (SLVSD90B 7.2.2.4) and the 100 nF is optional.

[block]
name = "TPS563208 5 V synchronous buck, 3 A"
source = "TI SLVSD90B Table 7-2 (5 V row), §7.3, 5.5, Figures 5-3/5-4; robocar-unified-integrated U10 and its pre-fab layout reviews"

[ports]
VIN = ["ic.VIN", "en_top.A", "cin1.A", "cin2.A", "cin_hf.A"]
VOUT = ["l.2", "cout1.A", "cout2.A", "cout3.A", "fb_top.A"]
GND = [
    "ic.GND",
    "cin1.B",
    "cin2.B",
    "cin_hf.B",
    "cout1.B",
    "cout2.B",
    "cout3.B",
    "en_bot.B",
    "fb_bot.B",
]

[parts.ic]
name = "TPS563208 buck converter"
kind = "buck-regulator"
part = "tps563208-sot23-6"

# 4.7 µH ±20 % (Bourns SRN6045TA-4R7M: DCR 26 mΩ, Irms 4.5 A, Isat 6.8 A):
# the 3.3 µH part is ±30 %, which can fall below Table 7-2's 3.3 µH minimum.
# Peak current at the 5.1 A maximum current limit is about 5.5 A.
[parts.l]
name = "4.7 µH power inductor, buck output"
kind = "inductor"
part = "inductor-srn6045"
value = "4.7uH"

[parts.en_top]
name = "100 kΩ EN divider, top (VBAT)"
kind = "resistor"
part = "r0805"
value = "100k"
lcsc = "C149504"

[parts.en_bot]
name = "36 kΩ EN divider, bottom"
kind = "resistor"
part = "r0805"
value = "36k"
lcsc = "C4360"

[parts.cin1]
name = "10 µF buck input"
kind = "capacitor"
part = "c0805"
value = "10uF 25V"
lcsc = "C15850"

[parts.cin2]
name = "10 µF buck input, beside VIN"
kind = "capacitor"
part = "c0805"
value = "10uF 25V"
lcsc = "C15850"

[parts.cin_hf]
name = "100 nF buck input"
kind = "capacitor"
part = "c0805"
value = "100nF"
lcsc = "C49678"

# 100 nF bootstrap, as TI requires.
[parts.boot]
name = "100 nF bootstrap, VBST to SW"
kind = "capacitor"
part = "c0805"
value = "100nF"
lcsc = "C49678"

# Three 22 µF: an 0805 at 5 V bias keeps roughly half its rating, and two
# alone can fall under Table 7-2's 20 µF minimum. Three stay inside 20-68 µF.
# All three are C45783 (Samsung CL21A226MAQNNNE, 22 µF 25 V X5R), a JLCPCB
# Basic part; its DC-bias curve is unread, so the "about half at 5 V" is the
# 0805 rule of thumb, not this part's figure.
[parts.cout1]
name = "22 µF buck output"
kind = "capacitor"
part = "c0805"
value = "22uF 25V"
lcsc = "C45783"

[parts.cout2]
name = "22 µF buck output"
kind = "capacitor"
part = "c0805"
value = "22uF 25V"
lcsc = "C45783"

[parts.cout3]
name = "22 µF buck output"
kind = "capacitor"
part = "c0805"
value = "22uF 25V"
lcsc = "C45783"

[parts.fb_top]
name = "56 kΩ feedback divider, top"
kind = "resistor"
part = "r0805"
value = "56k"
lcsc = "C17756"

[parts.fb_bot]
name = "10 kΩ feedback divider, bottom"
kind = "resistor"
part = "r0805"
value = "10k"
lcsc = "C17414"

[[rails]]
name = "SW"
from = "ic.SW"
to = ["l.1", "boot.B"]

[[rails]]
name = "BST"
from = "ic.VBST"
to = ["boot.A"]

[[rails]]
name = "EN"
from = "ic.EN"
to = ["en_top.B", "en_bot.A"]

[[rails]]
name = "FB"
from = "ic.VFB"
to = ["fb_top.B", "fb_bot.A"]
