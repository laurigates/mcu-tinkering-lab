# Parts-drawer stickers, second run (2026-11-09): the parts-stock items that
# drawers-2026-10.toml does not label and that are on hand. Drafted with
#   just labels::candidates tools/labels/data/drawers-2026-10.toml
# then rewritten by hand. Build with
#   just labels::build tools/labels/data/inventory-2026-11.toml
#
# Left out on purpose: tools, solder/flux/tape consumables, enclosures and
# storage cases, the robot chassis and PTZ mount, the UNO starter kits and the
# two soldering-practice kits, and the mains power adapters.
# Items from the 2026-11 orders that have not arrived are in
# inventory-2026-11-incoming.toml.
#
# Spec lines marked "from memory" were not read from a listing or datasheet;
# check them before the next print.
schema = 1
title = "Parts drawers 2026-11"

[colors]
cap-blue = "#1d4ed8"
ic-purple = "#6d28d9"
conn-green = "#15803d"
elco = "#334155"
opto = "#b45309"
mech = "#57534e"
