# Parts-drawer stickers for the 2026-11 orders that have not arrived yet
# (parts-stock qty 0 or level "out" on 2026-11-09). Print when they are in the
# drawers, after checking each spec line against what came:
#   just labels::build tools/labels/data/inventory-2026-11-incoming.toml
#
# Spec lines marked "from memory" were not read from a listing or datasheet.
schema = 1
title = "Parts drawers 2026-11, incoming"

[colors]
cap-blue = "#1d4ed8"
conn-green = "#15803d"
elco = "#334155"
opto = "#b45309"
mech = "#57534e"
pot-pink = "#be185d"
res-brown = "#78350f"
power-orange = "#c2410c"
semi-teal = "#0f766e"

