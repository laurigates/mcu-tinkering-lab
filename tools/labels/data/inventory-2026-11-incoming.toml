# Parts-drawer stickers for the 2026-11 orders that have not arrived yet
# (parts-stock qty 0 or level "out" on 2026-11-09). Print when they are in the
# drawers, after checking each spec line against what came:
#   just labels::build tools/labels/data/inventory-2026-11-incoming.toml
#
# Spec lines marked "from memory" were not read from a listing or datasheet.
schema = 1
title = "Parts drawers 2026-11, incoming"

[colors]
cap-blue = "#1d4ed8"
conn-green = "#15803d"
elco = "#334155"
opto = "#b45309"
mech = "#57534e"
pot-pink = "#be185d"
res-brown = "#78350f"
power-orange = "#c2410c"
semi-teal = "#0f766e"

# ---- SMD ----

[[label]]
cat = "Fuse · PTC"
color = "power-orange"
value = "3 A hold"
stock = "polyfuse-1812-3a-24v"
spec = ["1812 resettable fuse · 24 V"]
foot = "AliExpress 11/2026"
lid = { spec = "1812 · 24 V" }
render = { kind = "chip", l = 4.5, w = 3.2, term = 0.7 }

# ---- wire ----

[[label]]
cat = "Wire · ribbon"
color = "elco"
value = "14-way ribbon"
stock = "ribbon-cable-14p"
spec = ["Grey flat cable · 1 m"]
foot = "AliExpress 11/2026"
render = { kind = "ribbon", n = 14 }
