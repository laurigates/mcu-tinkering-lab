# Parts-drawer stickers, first run (2026-10-27/28): parts read from the
# AliExpress order history, typed in by hand. Build with
#   just labels::build tools/labels/data/drawers-2026-10.toml
#
# The spec lines first written from memory were checked against datasheets on
# 2026-11-12: the I²C addresses (MCP23017 DS20001952C §3.3.1, PCA9685 Rev. 4
# §7.1.1, TCA9548A SCPS207H Table 7-1), the TB6612FNG ratings (Toshiba
# 2007-06-30, p. 3), the NTAG215 memory size (NXP Rev. 3.2 §2.1) and the film
# capacitor code (Meritek MPEM part numbering). Two lines are still open and
# say so where they stand: the VS1838B and the film kit's value list.
schema = 1
title = "Parts drawers 2026-10"

[colors]
cap-blue = "#1d4ed8"
tant-orange = "#c2410c"
poly-teal = "#0f766e"
ic-purple = "#6d28d9"
conn-green = "#15803d"
elco = "#334155"
opto = "#b45309"
mech = "#57534e"
