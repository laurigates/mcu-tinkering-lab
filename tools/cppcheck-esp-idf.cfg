<?xml version="1.0"?>
<!--
  cppcheck library for tools/cquality.sh: macros cppcheck cannot see because
  the lint runs without ESP-IDF's include paths (missingIncludeSystem is
  suppressed). Without them cppcheck reports unknownMacro at the first
  "..." MACSTR or IPSTR string and analyses nothing else in that file.
  Values copied from ESP-IDF v5.5.6: esp_hw_support/include/esp_mac.h and
  esp_netif/include/esp_netif_ip_addr.h.

  A library define, unlike cppcheck -D, leaves cppcheck's own #ifdef
  configurations in place: -D checks only the given configuration.
-->
<def format="2">
  <define name="MACSTR" value="&quot;%02x:%02x:%02x:%02x:%02x:%02x&quot;"/>
  <define name="MAC2STR(a)" value="(a)[0], (a)[1], (a)[2], (a)[3], (a)[4], (a)[5]"/>
  <define name="IPSTR" value="&quot;%d.%d.%d.%d&quot;"/>
  <define name="IP2STR(ipaddr)" value="esp_ip4_addr1_16(ipaddr), esp_ip4_addr2_16(ipaddr), esp_ip4_addr3_16(ipaddr), esp_ip4_addr4_16(ipaddr)"/>
</def>
