[project]
name = "robocar-glitchtip-bridge"
version = "0.1.0"
description = "Forward robocar MQTT events to GlitchTip (Sentry protocol), symbolicating crash frames from the firmware ELF"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.2.0",
    "pyelftools>=0.33",
    "sentry-sdk>=2.74.0",
]

[project.scripts]
robocar-glitchtip-bridge = "robocar_glitchtip_bridge.main:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
