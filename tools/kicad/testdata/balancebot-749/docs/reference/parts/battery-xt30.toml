# Battery pack on a board-mount XT30 (AMASS XT30PW-M).
[part]
name = "Battery input, XT30PW-M"
source = "KiCad 10.0.6 footprint; its silkscreen prints - beside pad 1 and + beside pad 2"
symbol = "Connector_Generic:Conn_01x02"
footprint = "Connector_AMASS:AMASS_XT30PW-M_1x02_P2.50mm_Horizontal"

# Pad 1 is "-" (the carrier-pcb skill, trap 3). tools/kicad/registry.py
# checks this against the footprint's own + and - text.
[pins]
"-" = 1
"+" = 2

[perfboard]
footprint = "Connector_PinHeader_2.54mm:PinHeader_1x02_P2.54mm_Vertical"
value = "XT30 pigtail"
