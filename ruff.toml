# Ruff configuration for MCU Tinkering Lab
# https://docs.astral.sh/ruff/configuration/

target-version = "py311"

# Apply to all Python files in the repo
include = ["*.py"]

# Exclude third-party and generated directories
exclude = [
    "**/managed_components/",
    "**/components/esp-idf-lib/",
    "**/build/",
    ".venv/",
    "__pycache__/",
    ".esphome/",
]

# tools/kicad/pcb/ runs only under KiCad's bundled Python 3.9, which CI does not
# have: keep pyupgrade from rewriting it to 3.10+ syntax (UP045's `X | None`).
# tools/kicad/test_pcb_py39.py checks the files and this entry.
[per-file-target-version]
"tools/kicad/pcb/**" = "py39"

[lint]
# Keys of [lint] go above any [lint.*] sub-table header: TOML puts a key below
# a header into that table (issue #761). tools/test_ruff_config.py checks it.
# Enable core rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

ignore = [
    # ruff format wraps code at 88 columns; what E501 still reports is long
    # strings, comments and URLs the formatter leaves alone (359 lines when
    # #761 turned the selection on). The simulation and melody-detector
    # pyproject.toml configs make the same choice.
    "E501",
]

# Allow autofix for all enabled rules
fixable = ["ALL"]

# RUF001/RUF002: the multiplication sign and en dash are deliberate typography
# in generated labels, wire lists and docstrings (2×3 header, 1–3 mm), not
# look-alikes of x and -.
allowed-confusables = ["×", "–"]

[format]
# Match existing style
quote-style = "double"
indent-style = "space"
line-ending = "lf"
