# Pre-commit hooks for MCU Tinkering Lab
# See https://pre-commit.com for more information

# Exclude third-party component directories from all hooks
# Vendored third-party sources: never rewrite them. Reformatting vendored code
# makes every future sync with upstream conflict, and the diff noise hides the
# port's own local changes. tinyusb_port/ is a vendored TinyUSB DCD port.
exclude: 'components/esp-idf-lib/|managed_components/|tinyusb_port/'

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.patch$'
      - id: end-of-file-fixer
        exclude: '\.bin$|\.hex$|\.elf$'
      - id: check-yaml
        args: ['--unsafe']  # Allow custom YAML tags
      - id: check-added-large-files
        args: ['--maxkb=500']
        # A routed carrier board with its copper pour filled is about 1 MB
        # (tools/kicad, ADR-027); robocar's grew past the limit after
        # it was added. The pan-tilt harness's order files (STEP/STL for
        # JLC3DP) are committed meshes of the same kind. A mechanism's
        # clash-sweep video (tools/mechanism animate, AV1) is 0.3-1 MB. A uv.lock
        # is generated text; the robocar simulation's (genesis-world, torch) is
        # about 670 kB.
        exclude: '\.kicad_pcb$|/pan-tilt/print/[^/]+\.(stl|step)$|/output/animation/sweep\.mp4$|(^|/)uv\.lock$'
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: detect-private-key
        exclude: 'test_fixtures/'

  # C/C++ formatting with clang-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: \.(c|h|cpp|hpp)$
        args: ['-i', '--style=file']
        exclude: 'managed_components/|components/esp-idf-lib/|external/|\.esphome/'

  # Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: \.py$
      - id: ruff-format
        files: \.py$

  # Python type checking with ty (astral)
  # ty has no dedicated pre-commit hook repo yet, so we invoke it via uv.
  # Scoped to robocar-simulation — the only package with [tool.ty] config.
  # `uv run` resolves ty from the project's pinned dev extra (pyproject.toml)
  # and lockfile, not `uvx`'s unpinned "latest" — a pre-1.0 `uvx ty` release
  # changed its diagnostic set and reddened every PR with no commit in this
  # repo to explain it (issue #515). This also gives ty the real trimesh/etc.
  # type info from the synced venv instead of treating them as unresolved.
  - repo: local
    hooks:
      - id: ty
        name: ty type check (robocar-simulation)
        entry: bash -c 'cd packages/robotics/robocar/simulation && uv run ty check src/'
        language: system
        files: '^packages/robotics/robocar/simulation/src/.*\.py$'
        pass_filenames: false

  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  # Check for credential files
  - repo: local
    hooks:
      - id: check-credentials
        name: Check for credential files
        entry: >-
          bash -c 'if git diff --cached --name-only --diff-filter=d | grep -qE "(credentials\.h|wifi_config\.h|\.key$|\.secret$|\.token$)"; then echo "ERROR - Attempted to commit credential files!"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true

      # setup-tools pins the just whose `just --dry-run` text this reads.
      - id: check-flash-recipes
        name: Flash recipes match their projects and the build
        entry: python3 tools/check-flash-recipes.py
        language: system
        # main/*.c: a project starting the thinkpack-ota receiver needs an OTA
        # table, so adding the call reruns the OTA_TABLE check (issue #1076).
        # Any .csv: CONFIG_PARTITION_TABLE_CUSTOM_FILENAME can name a custom
        # table anything, and the repo's only CSVs are partition tables.
        files: '(justfile|\.just|sdkconfig\.defaults|\.csv|CMakeLists\.txt|/main/.+\.c|tools/lib/otadata-predicate\.sh|tools/lib/idf-partition-tables/.*|tools/check-flash-recipes\.py|^\.github/actions/setup-tools/action\.yml)$'
        pass_filenames: false

      - id: check-flash-recipes-tests
        name: check-flash-recipes unit tests
        entry: python3 -m unittest tools/test_check_flash_recipes.py
        language: system
        # The lookup tests run the real otadata predicate, its resolved built-in
        # tables and the manifest generator that sources it, so their edits
        # rerun them. The ESP-IDF version pins rerun the built-in-table tripwire,
        # and a project's sdkconfig overlays the overlay tripwire.
        files: '^(tools/(check-flash-recipes\.py|test_check_flash_recipes\.py|lib/otadata-predicate\.sh|lib/idf-partition-tables/.*|generate-flasher-manifests\.sh)|Dockerfile|\.github/workflows/(build-firmware|_ci-build-esp32)\.yml|packages/.*/sdkconfig\.[^/]+)$'
        pass_filenames: false

      - id: labels-tests
        name: tools/labels unit tests (sticker layout, cut files, candidates)
        entry: python3 -m unittest discover -s tools/labels
        language: system
        files: '^tools/labels/'
        pass_filenames: false

      - id: refresh-idf-locks-tests
        name: refresh-idf-locks unit tests
        entry: python3 -m unittest tools/test_refresh_idf_locks.py
        language: system
        files: '^tools/(refresh-idf-locks\.py|test_refresh_idf_locks\.py)$'
        pass_filenames: false

      - id: changelog-notes-tests
        name: changelog-notes unit tests (OTA manifest "notes")
        entry: python3 -m unittest tools/test_changelog_notes.py
        language: system
        files: '^tools/(changelog-notes\.py|test_changelog_notes\.py|generate-flasher-manifests\.sh)$'
        pass_filenames: false

      - id: flash-source-tests
        name: flash-source unit tests (which firmware a flash writes)
        entry: python3 -m unittest tools/test_flash_source.py
        language: system
        files: '^tools/(flash-source\.py|test_flash_source\.py)$'
        pass_filenames: false

      - id: jlc-blog-tests
        name: jlc-blog unit tests
        entry: python3 -m unittest tools/test_jlc_blog.py
        language: system
        files: '^tools/(jlc-blog\.py|test_jlc_blog\.py)$'
        pass_filenames: false

      - id: foil-test-board
        name: foil test board tests, and its cut files match the generator
        entry: python3 -m unittest tools/test_foil_test_board.py
        language: system
        files: '^(tools/(foil-test-board\.py|test_foil_test_board\.py)|docs/prototyping/foil-test-board/)'
        pass_filenames: false

      # build.yml builds only the projects in .github/project-matrix.json, and
      # rebuilds one only when its own path or an extra_paths entry changed. A
      # registered project with no entry is never built (#697, #709); a
      # component compiled from outside the project needs an entry or a change
      # to it alone builds nothing (issue #670). The root justfile is an input:
      # a new `mod` must come with an entry or a NOT_IN_MATRIX exclusion. So is
      # release-please-config.json: a project nested in another's directory is
      # in the outer entry's exclude_paths and its package's exclude-paths.
      - id: check-component-extra-paths
        name: CI builds every registered project and every shared component it compiles
        entry: python3 tools/check-component-extra-paths.py
        language: system
        files: '(^justfile|^release-please-config\.json|CMakeLists\.txt|\.github/project-matrix\.json|tools/check-component-extra-paths\.py)$'
        pass_filenames: false

      - id: check-component-extra-paths-tests
        name: check-component-extra-paths tests
        entry: uv run --no-project --with pytest==9.1.1 python -m pytest -q tools/test_check_component_extra_paths.py
        language: system
        files: '(^justfile|^release-please-config\.json|CMakeLists\.txt|\.github/project-matrix\.json|tools/(check-component-extra-paths|test_check_component_extra_paths)\.py)$'
        pass_filenames: false

      # ESP-IDF ignores an sdkconfig.defaults line whose symbol no Kconfig file
      # defines, with only a build-log warning (issue #707). The test suite
      # checks every tracked sdkconfig.defaults against the symbol lists in
      # tools/kconfig_symbols, and fails when the ESP-IDF version pins (the
      # Dockerfile, docker-compose.yml's image tag, any workflow) disagree
      # with each other or with the ESP-IDF list. No build or container needed.
      - id: kconfig-symbols
        name: sdkconfig.defaults symbols exist in ESP-IDF, the project or its components
        entry: python3 -m unittest discover -s tools/kconfig_symbols -t tools
        language: system
        files: '(sdkconfig\.defaults[^/]*|idf_component\.yml|dependencies\.lock|Kconfig[^/]*|CMakeLists\.txt|^tools/kconfig_symbols/.*|^tools/check-component-extra-paths\.py|^Dockerfile|^docker-compose\.yml|^\.github/workflows/[^/]+\.ya?ml)$'
        pass_filenames: false

      # No run: script expands inputs.* or github.event.* through ${{ }}
      # (issue #855), plus the workflow wiring the file's docstring lists.
      # project-matrix.json: the suite runs build.yml's discovery step on it.
      # It also reads the local actions' pins, this file's hooks and the
      # actionlint pin in scripts/install_pkgs.sh, so it runs on those too.
      - id: workflow-structure
        name: Workflows pass untrusted text through env, and keep their release and Claude wiring
        entry: uv run --no-project --with pyyaml==6.0.3 python -m unittest tools/test_workflows.py
        language: system
        files: '^(\.github/workflows/.*\.ya?ml|\.github/actions/.+/action\.ya?ml|\.github/project-matrix\.json|tools/test_workflows\.py|\.pre-commit-config\.yaml|scripts/install_pkgs\.sh)$'
        pass_filenames: false

      # actionlint over every workflow (#1103): expression types, contexts,
      # job needs, runner labels, permission scopes and the inputs of local
      # reusable workflows and actions. A remote action's inputs are checked
      # only for a major-tag ref in actionlint's bundled data
      # (actions/checkout@v4), so the SHA-pinned and full-version refs here
      # get no input check. Needs actionlint on PATH; CI Config Hooks
      # installs the release test.yml pins and checks its sha256.
      # shellcheck and pyflakes are off here because a machine without them
      # would lint less than one with them; with no arguments it reads
      # .github/workflows and .github/actionlint.yaml. It also runs on a
      # local action's action.yml, whose inputs the workflows pass.
      - id: actionlint
        name: actionlint (workflow syntax, expressions and action inputs)
        entry: actionlint -shellcheck= -pyflakes=
        language: system
        files: '^\.github/(workflows/.*\.ya?ml|actions/.+/action\.ya?ml|actionlint\.ya?ml)$'
        pass_filenames: false

      - id: check-typst-docs
        name: Typst docs track pin_config.h, and the drift guard sees them
        entry: python3 tools/check-typst-docs.py
        language: system
        files: '(docs/.*\.typ|main/pin_config\.h|tools/check-typst-docs\.py|\.github/workflows/build-guide-check\.yml|\.claude/rules/build-guide-drift-guard\.md)$'
        pass_filenames: false

      - id: cadstd
        name: tools/cadstd fastener, fit and grid tables (ADR-035)
        # Stdlib only; the build123d shape and coupon tests run in
        # `just cadstd::test`, which needs tools/mechanism's venv.
        entry: python3 -m unittest discover -s tools/cadstd -t tools -p test_cadstd.py
        language: system
        files: '^tools/cadstd/'
        pass_filenames: false

      # always_run: a glob goes stale when a directory moves or is deleted, in
      # a commit that touches neither the taxonomy nor the test. It reads
      # `git ls-files` and one JSON file.
      - id: issue-labels-taxonomy
        name: Label taxonomy passes the script's schema, globs match tracked paths, each scope selects one label
        entry: python3 -m unittest tools/test_issue_labels_taxonomy.py
        language: system
        pass_filenames: false
        always_run: true

      # Runs on a uv.lock, pyproject.toml, justfile, CI file, just pin or
      # component host-suite change: those move what the test reads
      # (tools/test_python_suites.py, issues #457, #1103).
      - id: python-suites
        name: Every uv.lock is installed --locked, every tool test recipe runs in CI, uv and just come from setup-tools
        entry: python3 -m unittest tools/test_python_suites.py
        language: system
        pass_filenames: false
        files: '(^\.github/|^tools/(python-suites|test_python_suites)\.py$|(^|/)(uv\.lock|pyproject\.toml|justfile)$|^\.pre-commit-config\.yaml$|^renovate\.json$|^scripts/install_pkgs\.sh$|^packages/(.*/)?components/[^/]+/tests?/|^packages/components/host-test/)'

      # Ruff accepts a key placed under the wrong TOML table without a warning
      # (issue #761: select and fixable sat inside [lint.per-file-ignores]).
      - id: ruff-config
        name: ruff.toml keeps its lint keys in [lint], and every per-file ignore matches a file
        entry: python3 -m unittest tools/test_ruff_config.py
        language: system
        pass_filenames: false
        files: '^(ruff\.toml|tools/test_ruff_config\.py)$'

      # The Claude Code post-edit hook formats only this repo's files and
      # keeps a not-yet-used import or noqa between Edits (issue #1111).
      - id: post-edit-lint-hook
        name: Claude post-edit-lint hook stays inside the repo and keeps unused imports
        entry: python3 -m unittest tools/test_post_edit_lint_hook.py
        language: system
        pass_filenames: false
        files: '^(\.claude/hooks/post-edit-lint\.sh|tools/test_post_edit_lint_hook\.py|ruff\.toml)$'

      - id: hardware-join
        name: Hardware join resolves, and pin_defs.typ regenerates byte-identical
        entry: python3 -m unittest discover -s tools/hardware -t tools
        language: system
        files: '(^tools/hardware/|^tools/typst/generate-pin-defs\.py$|hardware\.toml$|main/[^/]+\.h$|src/pin_config\.h$|docs/auto/pin_defs\.typ$|^docs/reference/(boards|blocks)/)'
        pass_filenames: false

      - id: hardware-docs
        name: Generated WIRING.md blocks match the hardware join
        entry: env PYTHONPATH=tools python3 -m hardware.docs --check
        language: system
        files: '(^tools/hardware/|hardware\.toml$|main/[^/]+\.h$|src/pin_config\.h$|^packages/.*\.md$|^docs/reference/(boards|blocks)/)'
        pass_filenames: false

      # Only the carrier gates that regenerating fixes correctly without KiCad:
      # test.yml ("Test Suite") runs pre-commit and auto-fix.yml watches it, so
      # a gate here is one a cloud fixer may "fix". The board check and the
      # check stamp need KiCad to fix honestly; they run in carrier-check.yml
      # only (ADR-027).
      - id: kicad-carrier
        name: tools/kicad tests, and the generated carrier schematic and perfboard match hardware.toml
        entry: env PYTHONPATH=tools sh -c 'python3 -m unittest discover -s tools/kicad -t tools && python3 -m kicad.schematic --check && python3 -m kicad.perfboard --check'
        language: system
        files: '(^tools/kicad/|^tools/hardware/|hardware\.toml$|src/pin_config\.h$|main/[^/]+\.h$|^docs/reference/(boards|parts|blocks)/|/hardware/(carrier|perfboard)/|/docs/perfboard-steps\.typ$)'
        pass_filenames: false

      - id: check-doc-facts
        name: Hand-written docs agree with the firmware
        entry: python3 tools/check-doc-facts.py
        language: system
        files: '(pin_config\.h|WIRING\.md|README\.md|build-guide\.typ|tools/check-doc-facts\.py)$'
        pass_filenames: false

      - id: check-ota-consumer-agreement
        name: OTA firmware agrees with flasher.json asset names and topics
        entry: python3 tools/check-ota-consumer-agreement.py
        language: system
        files: '(flasher\.json|ota_handler\.c|config\.h|/main/[^/]+\.[ch]|^release-please-config\.json|tools/check-ota-consumer-agreement\.py)$'
        pass_filenames: false

      # The comparisons above, each run on a scratch project that breaks it,
      # and SKIP_PROJECTS held empty: an entry there once outlived its reason
      # with the hook still green.
      - id: check-ota-consumer-agreement-tests
        name: check-ota-consumer-agreement tests
        entry: python3 -m unittest tools/test_check_ota_consumer_agreement.py
        language: system
        files: '(flasher\.json|/main/[^/]+\.[ch]|^release-please-config\.json|tools/(check-ota-consumer-agreement|test_check_ota_consumer_agreement)\.py)$'
        pass_filenames: false

      - id: check-build-artifacts
        name: Check for build artifacts
        entry: >-
          bash -c 'if git diff --cached --name-only | grep -qE "(\.o$|\.a$|\.elf$|\.bin$|\.hex$|sdkconfig$)"; then echo "ERROR: Attempted to commit build artifacts!"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true

# Configuration
default_language_version:
  python: python3.11

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
