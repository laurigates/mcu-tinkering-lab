# Parts and nets around main/pin_config.h — the third layer of ADR-021's
# board × header × parts join (docs/decisions/ADR-021-hardware-source-of-truth.md).
#
# No pin numbers live here. Every `role` is a macro name in main/pin_config.h,
# and tools/hardware/ fails if one does not resolve, so this file cannot
# silently disagree with the firmware about WHICH pin — only about which part a
# pin is wired to, which is the fact the header cannot express.
#
# Two builds read this file. Entries with no `build` key are in both.
#   build = "harness"  only the hand-wired harness
#   build = "carrier"  only the carrier PCB (hardware/carrier/, issue #750)
# The docs generators — WIRING.md, pin_defs.typ, the pinouts and the docs
# schematic — read the harness view, `join()`'s default. The carrier is two
# PCBs, each its own KiCad project: the main board (hardware/carrier/) and the
# head panel holding the XIAO (head/hardware/carrier/), joined by a 2x8 IDC
# ribbon ([[cables]] below).
#
# Regenerate everything that reads it — docs/auto/pin_defs.typ and the marked
# tables and power diagram in WIRING.md — with `just hardware::gen`;
# `just hardware::check` fails if any of them is stale.

[source]
convention = "robocar"
header = "main/pin_config.h"
# Read for #define values only (the Typst bindings in docs/auto/pin_defs.typ);
# pin roles come from `header` alone. Every header listed here must also be on
# both trigger-path blocks of .github/workflows/build-guide-check.yml — see
# .claude/rules/build-guide-drift-guard.md §1.
extra_headers = ["main/planner_task.h", "main/plan_activity.h"]
# The base XIAO ESP32-S3 reference carries the pad table, Side/Pos included;
# the Sense page states the same external pinout and links to it.
board = "docs/reference/boards/xiao-esp32s3.md"
# The MCU node's name in the WIRING.md power diagram; rails reach its pads as
# `mcu.<pad>`, checked against `board`.
mcu = "XIAO ESP32-S3 Sense"
# The XIAO on the carrier's head board: a parts-registry entry and its
# reference designator.
part = "seeed-xiao-esp32s3-socket"
ref = "U1"

# `board` names a part's physical-layout page (read from the vendor's board
# file where one is published); tools/hardware/pinout.py draws each one for the
# build guide (#629). The MCP23017 and the SSD1306 have no page until the
# fitted modules are identified (#662), so they carry no `board` and are not
# drawn. The rangefinders were identified as RCWL-1601s (#662); no board file
# is published for that module, so its page is read from the listing's
# silkscreen photos. Lauri verified its pin order on the fitted modules on
# 2026-10-16; the page's checklist lists what is still unverified.
#
# `part` names the parts-registry entry (docs/reference/parts/) that maps a
# part's pin names to KiCad symbol pins; `ref`, `value` and `lcsc` are the
# carrier PCB's reference designator, value text and JLCPCB part number. The
# breakouts are socketed on their own headers; the off-board parts plug into
# connectors.

[parts.mux]
name = "TCA9548A"
kind = "i2c-mux"
board = "docs/reference/boards/adafruit-tca9548a.md"
part = "adafruit-tca9548a-socket"
ref = "A3"
value = "TCA9548A"

# Behind the mux on channel I2C_BUS_CHANNEL_PCA9685, so no MCU net lands on it.
[parts.pwm]
name = "PCA9685"
kind = "pwm-driver"
board = "docs/reference/boards/adafruit-pca9685.md"
part = "adafruit-pca9685-socket"
ref = "A2"
value = "PCA9685"

[parts.motor_driver]
name = "TB6612FNG"
kind = "motor-driver"
board = "docs/reference/boards/sparkfun-tb6612fng.md"
part = "sparkfun-tb6612fng-socket"
ref = "A1"
value = "TB6612FNG"

# Both in I2C mode (10 kΩ on R4, R5 empty) at the fixed address 0x57, each
# alone on its own mux channel (#782). The board page names the pins by their
# I2C-mode function; the silkscreen still prints Trig/Echo.
[parts.ranger_front]
name = "RCWL-1601 (front)"
kind = "ultrasonic"
board = "docs/reference/boards/rcwl-1601.md"
part = "rcwl-1601-i2c-cable"
ref = "J7"
value = "RCWL-1601 front"

[parts.ranger_rear]
name = "RCWL-1601 (rear)"
kind = "ultrasonic"
board = "docs/reference/boards/rcwl-1601.md"
part = "rcwl-1601-i2c-cable"
ref = "J8"
value = "RCWL-1601 rear"

# On the carrier a 12 mm board-mount buzzer, soldered straight to the main board
# (Lauri, 2026-10-16).
[parts.buzzer]
name = "Piezo buzzer"
kind = "piezo"
part = "piezo-buzzer-12mm"
ref = "BZ1"
value = "Buzzer 12mm"

[parts.amp]
name = "MAX98357A"
kind = "i2s-amp"
board = "docs/reference/boards/adafruit-max98357a.md"
part = "adafruit-max98357a-socket"
ref = "A4"
value = "MAX98357A"

[[nets]]
role = "I2C_SDA_PIN"
to = "mux.SDA"
note = "Every I2C device sits behind the mux"

[[nets]]
role = "I2C_SCL_PIN"
to = "mux.SCL"

[[nets]]
role = "MOTOR_STBY_PIN"
to = "motor_driver.STBY"
note = "HIGH = motors enabled; the six control lines come from the PCA9685"

[[nets]]
role = "TCA9548A_RST_PIN"
to = "mux.RST"
note = "Active-low mux reset, pulsed after repeated failed channel selects; the breakout pulls it up"

[[nets]]
role = "PIEZO_PIN"
to = "buzzer.+"
build = "harness"
note = "LEDC PWM, through a series resistor; the other leg to GND"

# On the carrier the series resistor is R1; the PIEZO_DRV rail joins it to the buzzer.
[[nets]]
role = "PIEZO_PIN"
to = "piezo_r.A"
build = "carrier"
note = "LEDC PWM into the 100 Ω series resistor"

[[nets]]
role = "I2S_BCLK_PIN"
to = "amp.BCLK"
note = "Bit clock"

[[nets]]
role = "I2S_LRCLK_PIN"
to = "amp.LRC"
note = "Word select / left-right clock"

[[nets]]
role = "I2S_DIN_PIN"
to = "amp.DIN"
note = "Serial audio data"

# --- PCA9685 outputs (#666) -------------------------------------------------
# The LED and servo channels are harness-only: on the carrier the servos and
# LEDs plug into the PCA9685's own 3-pin columns, so only the six TB6612FNG
# channels (8-13) are socketed and wired.
# The same rule as above, one hop further out: every `role` is a `*_CHANNEL`
# macro in main/pin_config.h, so the channel number lives there and nowhere
# here. tools/hardware/ fails if a role does not resolve, if its channel is not
# a pad on the PCA9685's board page, if two wired roles share a channel, or if a
# pin is driven twice. The pinout images label both ends from these.
#
# The six motor lines follow the TB6612FNG's control header
# (docs/firmware/i2c-and-motors.md §PCA9685 channel layout). MOTOR_FIRST_CHANNEL is the base of that block, the same
# channel as MOTOR_RIGHT_PWM_CHANNEL, and needs no net of its own.

[[channel_nets]]
role = "LED_LEFT_R_CHANNEL"
from = "pwm"
build = "harness"
to = "led_left.R"

[[channel_nets]]
role = "LED_LEFT_G_CHANNEL"
from = "pwm"
build = "harness"
to = "led_left.G"

[[channel_nets]]
role = "LED_LEFT_B_CHANNEL"
from = "pwm"
build = "harness"
to = "led_left.B"

[[channel_nets]]
role = "LED_RIGHT_R_CHANNEL"
from = "pwm"
build = "harness"
to = "led_right.R"

[[channel_nets]]
role = "LED_RIGHT_G_CHANNEL"
from = "pwm"
build = "harness"
to = "led_right.G"

[[channel_nets]]
role = "LED_RIGHT_B_CHANNEL"
from = "pwm"
build = "harness"
to = "led_right.B"

[[channel_nets]]
role = "SERVO_PAN_CHANNEL"
from = "pwm"
build = "harness"
to = "servos.PAN"
note = "Signal lead of the pan servo"

[[channel_nets]]
role = "SERVO_TILT_CHANNEL"
from = "pwm"
build = "harness"
to = "servos.TILT"
note = "Signal lead of the tilt servo"

[[channel_nets]]
role = "MOTOR_RIGHT_PWM_CHANNEL"
from = "pwm"
to = "motor_driver.PWMA"
note = "Right motor speed, PWM 0-4095"

[[channel_nets]]
role = "MOTOR_RIGHT_IN2_CHANNEL"
from = "pwm"
to = "motor_driver.AIN2"
note = "Right motor direction, full-on / full-off"

[[channel_nets]]
role = "MOTOR_RIGHT_IN1_CHANNEL"
from = "pwm"
to = "motor_driver.AIN1"
note = "Right motor direction, full-on / full-off"

[[channel_nets]]
role = "MOTOR_LEFT_IN1_CHANNEL"
from = "pwm"
to = "motor_driver.BIN1"
note = "Left motor direction, full-on / full-off"

[[channel_nets]]
role = "MOTOR_LEFT_IN2_CHANNEL"
from = "pwm"
to = "motor_driver.BIN2"
note = "Left motor direction, full-on / full-off"

[[channel_nets]]
role = "MOTOR_LEFT_PWM_CHANNEL"
from = "pwm"
to = "motor_driver.PWMB"
note = "Left motor speed, PWM 0-4095"

# --- TCA9548A channels (#768) -----------------------------------------------
# Each `role` is an `I2C_BUS_CHANNEL_*` macro in main/pin_config.h, the channel
# the firmware selects before talking to that part. Channel n is the mux's
# SDn/SCn pad pair, wired to the part's SDA/SCL; tools/hardware/ fails if a pad
# is missing from a board page, if two roles share a channel, or if a pin is on
# two buses.

[[bus_nets]]
role = "I2C_BUS_CHANNEL_PCA9685"
from = "mux"
to = "pwm"

[[bus_nets]]
role = "I2C_BUS_CHANNEL_OLED"
from = "mux"
to = "oled"

[[bus_nets]]
role = "I2C_BUS_CHANNEL_MCP23017"
from = "mux"
to = "expander"
build = "harness"
note = "optional: the firmware boots without the board fitted"

# On the carrier the expander's socket is wired whether or not a module is
# fitted, with its own channel-2 pull-ups (R10, R11, below).
[[bus_nets]]
role = "I2C_BUS_CHANNEL_MCP23017"
from = "mux"
to = "expander"
build = "carrier"

[[bus_nets]]
role = "I2C_BUS_CHANNEL_RANGER_FRONT"
from = "mux"
to = "ranger_front"
note = "RCWL-1601 at 0x57, alone on its channel; no pull-ups on the module"

[[bus_nets]]
role = "I2C_BUS_CHANNEL_RANGER_REAR"
from = "mux"
to = "ranger_rear"
note = "RCWL-1601 at 0x57, alone on its channel; no pull-ups on the module"

[[undrawn]]
role = "MIC_PDM_CLK_PIN"
why = "wired to the PDM microphone on the Sense expansion board, not brought out to a header"

[[undrawn]]
role = "MIC_PDM_DATA_PIN"
why = "wired to the PDM microphone on the Sense expansion board, not brought out to a header"

# Harness-only: on the carrier the ribbon takes D6 to the main board's UART0
# tap, J15 (below).
[[undrawn]]
role = "UART0_TX_PIN"
build = "harness"
why = "UART0 TX, log output: the ROM bootloader prints its boot log here at every reset, then the firmware mirrors every ESP_LOG line here at 115200 8N1 (log_mirror.c). The serial console is USB-Serial-JTAG on the USB-C connector, not this pad"

# The harness has no power switch and no pack divider (ADR-038, #1270): D3 and D7
# are free pads there. On the carrier they are wired below.
[[undrawn]]
role = "POWER_HOLD_PIN"
build = "harness"
why = "the power latch's HOLD output exists only on the carrier PCB; the hand-wired harness has no power switch and leaves D7 open"

[[undrawn]]
role = "PACK_SENSE_PIN"
build = "harness"
why = "the pack-voltage divider exists only on the carrier PCB; the hand-wired harness leaves D3 open"

# --- Power (#646) -----------------------------------------------------------
# The supply side of the join, emitted as WIRING.md's power diagram. A rail
# endpoint is `part.PIN` (`mcu.<pad>` for the XIAO); a pin on a part with a
# `board` page must be a pad there. One pin on two rails, or a rail pin that is
# also a signal net above, fails the join. The rail assignments match the
# power tags in docs/schematics/circuits/robocar.py. Voltages beyond
# the rail names, star wiring and capacitor placement stay in WIRING.md's prose.

[parts.pack]
name = "2x 18650 in series"
kind = "battery"
note = "7.4 V nominal, 8.4 V charged"
part = "battery-xt30"
ref = "J3"
value = "XT30 pack in"

# On a JST VH 4 lead (3.96 mm): its contact is rated 10 A on AWG #16 (JST's VH
# sheet), against up to about 3.4 A on OUT+ with both motors stalled (pre-fab
# review SF-2). The XH 4 it replaced is rated 3 A.
[parts.buck]
name = "LM2596 buck module"
kind = "buck-regulator"
note = "adjust to 5.0 V before connecting a load"
part = "lm2596-buck-module-vh4"
ref = "J4"
value = "LM2596 module"

[parts.oled]
name = "SSD1306 OLED"
kind = "display"
part = "ssd1306-091-cable"
ref = "J9"
value = "SSD1306 0.91in"

# A CJMCU-2317 module. On the carrier it sits in sockets under all 30 of its
# holes (the hole positions Lauri measured, 2026-10-16), and a 2x10 header
# (exp_header, below) repeats its GPIO column. No `board` key: the layout model
# cannot draw its double column (docs/reference/boards/cjmcu-2317.md).
[parts.expander]
name = "MCP23017"
kind = "gpio-expander"
note = "optional"
part = "cjmcu-2317-socket"
ref = "A5"
value = "CJMCU-2317"

[parts.servos]
name = "SG90 servos"
kind = "servo"
note = "pan, tilt"
build = "harness"

[parts.motor_left]
name = "Left motor"
kind = "dc-motor"
part = "dc-motor-jst-xh2"
ref = "J5"
value = "Motor left"

[parts.motor_right]
name = "Right motor"
kind = "dc-motor"
part = "dc-motor-jst-xh2"
ref = "J6"
value = "Motor right"

[parts.led_left]
name = "Left RGB LED"
kind = "rgb-led"
note = "common-anode"
build = "harness"

[parts.led_right]
name = "Right RGB LED"
kind = "rgb-led"
note = "common-anode"
build = "harness"

[parts.speaker]
name = "Speaker"
kind = "speaker"
note = "4–8 Ω"
build = "harness"

# On the carrier the pack reaches VBAT through the fuse F1 instead (below).
[[rails]]
name = "VBAT"
build = "harness"
from = "pack.+"
to = ["buck.IN+"]

# Star-wired: each load takes its own feed from the regulator's output terminal.
# On the carrier the XIAO's 5V pad takes its feed through D1 instead (XIAO_5V,
# below).
[[rails]]
name = "5V"
build = "harness"
from = "buck.OUT+"
to = ["mcu.5V", "motor_driver.VM", "pwm.V+", "amp.Vin"]

[[rails]]
name = "5V"
build = "carrier"
from = "buck.OUT+"
to = ["motor_driver.VM", "pwm.V+", "amp.Vin"]

# Logic supplies. TB6612FNG and PCA9685 VCC set their input thresholds from
# their own supply, so they must sit on the XIAO's 3.3 V, never on 5V above.
# The carrier's main board makes its own 3V3 with an LDO instead (below).
[[rails]]
name = "3V3"
build = "harness"
from = "mcu.3V3"
to = [
    "motor_driver.VCC",
    "pwm.VCC",
    "mux.VIN",
    "ranger_front.VCC",
    "ranger_rear.VCC",
    "oled.VCC",
    "expander.VCC",
]

# Harness-only: on the carrier the servos and LEDs plug into the PCA9685's own
# 3-pin columns, which are not socketed.
[[outputs]]
from = "pwm"
to = ["servos", "led_left", "led_right"]
build = "harness"

# Channel A drives the right motor and channel B the left
# (docs/reference/boards/sparkfun-tb6612fng.md); each motor's two terminals are
# 1 and 2, so one driver feeds both loads on separate pins (#769).
[[outputs]]
from = "motor_driver"
to = ["motor_left", "motor_right"]
pins = ["A01", "A02", "B01", "B02"]
net = "MOT_{pin}"
load_pins.motor_right = { A01 = "1", A02 = "2" }
load_pins.motor_left = { B01 = "1", B02 = "2" }

# Harness-only: the speaker stays on the amplifier's own X1 terminal.
[[outputs]]
from = "amp"
to = ["speaker"]
build = "harness"
pins = ["VO-", "VO+"]
net = "SPK_{pin}"
load_pins.speaker = { "VO-" = "-", "VO+" = "+" }

# --- Carrier PCB (#750) -------------------------------------------------------
# Everything below is `build = "carrier"`: the parts no breakout carries, the
# cable between the head and main boards, and the rails the carrier draws that
# WIRING.md leaves to prose (GND) or that differ from the harness (3V3).

# The XIAO sits on the head board, on the pan-tilt head; a 2x8 IDC ribbon takes
# its I2C, STBY, piezo, I2S and MUX_RST lines, UART0 TX, the power latch's HOLD
# (D7), the pack divider's mid-point (D3), 5V and GND to the main board.
# docs/reference/parts/idc-2x08-xiao-cable.toml gives the pin order, which
# survives the unkeyed plug going in rotated, and says why the cable grew from
# 2x7 (ADR-038, #1270). The only XIAO pad that stays open on the head is 3V3
# (the main board makes its own, below).
#
# The head panel carries three head boards, three ways of mounting the ribbon
# header for Lauri to try in the cradle (2026-10-16); the main board has one
# end, J1. Head 1 is [source] ref U1 with J2; the spare heads are U3 with J16
# (head 2) and U4 with J17 (head 3), each a copy of the XIAO socket and of the
# head connector, on nets HEAD2_* and HEAD3_*. Only one head is fitted with the
# XIAO at a time. The heads are a PCB of their own, ordered apart from the main
# board (Lauri, 2026-11-25, #1280: the main board needed their area for the
# switch, latch and charger): the main board.toml says side = "main", the head
# panel's side = "head", and head_parts names the heads' mounting holes.
[[cables]]
part = "idc-2x08-xiao-cable"
head_ref = "J2"
main_ref = "J1"
head_no_connect = ["3V3"]
spare_heads = [
    { mcu_ref = "U3", head_ref = "J16" },
    { mcu_ref = "U4", head_ref = "J17" },
]
head_parts = [
    "hole_head_1", "hole_head_2", "hole_head2_1", "hole_head2_2",
    "hole_head3_1", "hole_head3_2",
]
build = "carrier"

# UART0 TX on a main-board test header: the ROM bootloader prints its boot log
# on GPIO43 (D6) at every reset, 115200 baud, and the firmware then mirrors its
# ESP_LOG output there at the same rate (log_mirror.c, issue #798). A
# USB-serial adapter's RX and GND clip on here; nothing on the carrier drives
# or loads the line.
[parts.uart_tap]
name = "UART0 TX tap"
kind = "test-header"
build = "carrier"
part = "uart0-tap-1x2"
ref = "J15"

[[nets]]
role = "UART0_TX_PIN"
to = "uart_tap.TX"
build = "carrier"
note = "ROM boot log, 115200 baud"

# The expander's GPIOs on a 2x10 pin header beside its socket, in the module's
# own double-column order (Lauri, 2026-10-16): column A (odd pins) the outer
# column, GND, INTA, GPA0-7; column B (even pins) the inner, 3V3, INTB, GPB0-7.
[parts.exp_header]
name = "MCP23017 GPIO mirror header"
kind = "pin-header"
build = "carrier"
part = "mcp23017-mirror-header-2x10"
ref = "J18"

[[outputs]]
from = "expander"
to = ["exp_header"]
build = "carrier"
pins = [
    "INTA",
    "INTB",
    "GPA0",
    "GPA1",
    "GPA2",
    "GPA3",
    "GPA4",
    "GPA5",
    "GPA6",
    "GPA7",
    "GPB1",
    "GPB2",
    "GPB3",
    "GPB4",
    "GPB5",
    "GPB6",
    "GPB7",
]
net = "EXP_{pin}"

# Main-board test headers (Lauri, 2026-10-16): through-hole pin headers for
# meter probes, a logic analyser and scope ground clips.
[parts.tp_power]
name = "Supply test header"
kind = "test-header"
build = "carrier"
part = "testpoint-power-1x4"
ref = "J11"

[parts.tp_i2c]
name = "I2C and mux reset test header"
kind = "test-header"
build = "carrier"
part = "testpoint-i2c-1x4"
ref = "J12"

[parts.gnd_post_amp]
name = "Ground post beside the MAX98357A"
kind = "test-header"
build = "carrier"
part = "gnd-post-1x2"
ref = "J13"

[parts.gnd_post_ldo]
name = "Ground post beside the LDO"
kind = "test-header"
build = "carrier"
part = "gnd-post-1x2"
ref = "J14"

# The upstream I2C bus and the mux reset, on the main board's side of the
# ribbon: each role fans out to its J12 pin as well as to the mux.
[[nets]]
role = "I2C_SDA_PIN"
to = "tp_i2c.SDA"
build = "carrier"

[[nets]]
role = "I2C_SCL_PIN"
to = "tp_i2c.SCL"
build = "carrier"

[[nets]]
role = "TCA9548A_RST_PIN"
to = "tp_i2c.RST"
build = "carrier"

# The pack input stage is the `pack-input-pfet-switched` block (ADR-038, #1270):
# XT30 + -> fet_rp (reverse-polarity P-FET) -> fet_sw (power switch) -> F1 ->
# VBAT, with the switch's SW port driven by the soft latch below. Its comments
# carry the DMP3013SFV reasoning and the 2S ratings; checked against this robot:
#
# - Voltage. DMP3013SFV is a 30 V part with +-25 V VGSS; a charged 2S pack is
#   8.4 V and an undamped hot-plug ring to twice that, 16.8 V, is inside both.
#   F1 is 16 V (BSMD1812), above the pack. The block has no gate clamp and is
#   2S only (the block's own limit); the balancebot's 3S/4S variant is #1273.
# - Gate drive. VGS = -0.91 x COMMON (block comment). The pack's BMS cuts off
#   at a cell voltage this repo does not record, and the firmware cutoff sits
#   above it (#1271); at 6.2 V the gate drive is -5.6 V, inside DMP3013SFV's
#   RDS(on) row at -4.5 V (17 mohm max, DS40141 Rev. 5-2), and -4.5 V is
#   reached at COMMON = 4.95 V. Below that the RDS(on) is not specified; the
#   buck module has dropped out by then anyway.
# - Current. About 2.4-3.1 A into the LM2596 at full load, up to about 3.4 A
#   on OUT+ with both motors stalled (pre-fab review SF-2). Two FETs in series
#   double the channel loss: 2 x 17 mohm x (3.4 A)^2 = 0.39 W at the extreme
#   (estimate, 25 C RDS(on) maximum), 0.2 W per FET.
#
# F1 stays the 4 A hold part of #810 where the block's own fuse is 3 A. A short
# on VBAT (the 1 mm track to the LM2596 lead, the test header J11) otherwise
# has the pack's full fault current behind it. BSMD1812-400-16V (BHFUSE
# BSMD1812 datasheet, Revision 2025): 4 A hold and 8 A trip at 25 C (Itrip is
# the current it is guaranteed to trip at), 16 V maximum, above the 8.4 V of a
# charged 2S pack (the 6 V and 12 V parts are not). Its Thermal Derating Chart
# gives 3.48 A hold at 40 C and 3.16 A at 50 C, against 2.4-3.1 A into the
# LM2596 at full load (5 V at 3 A out of a 7.4-6.3 V pack). The -300 the block
# carries derates to 2.55 A at 40 C and 2.28 A at 50 C, under that load (pre-fab
# review SF-4). C47263807, Extended, 15,582 in stock (JLCPCB parts search,
# 2026-10-21). The pack's own 2S BMS ends a short sooner. The fuse now sits after
# the FETs, so a fault between XT30 and the FETs (the PACK_IN track from J3 to
# Q1's drain, 23 mm, and the FET pads) has no fuse in front of it; the BMS
# covers that. The charger's branch off PACK_IN has its own fuse, F2.
#
# Not checked: turn-on inrush. The switch closes in tens of microseconds, and
# the LM2596 module's input capacitance then charges through two RDS(on) and
# F1 at whatever the pack delivers. Measure it on the first board (block
# comment). The latch's HOLD must follow the button press within the MCU's
# boot time, which is not measured either (soft-latch.toml).
[blocks.input]
block = "pack-input-pfet-switched"
net_prefix = "PACK"
build = "carrier"
refs = { fet_rp = "Q1", fet_sw = "Q2", gate_pu = "R14", gate = "R15", fuse = "F1" }
parts.fuse = { name = "4 A hold PTC fuse, pack input", value = "4A hold 16V", lcsc = "C47263807" }

# The soft latch on the switch's SW port: one button on, HOLD (D7) held high by
# firmware, firmware off. SENSE goes to the MCP23017's GPB0, not to a native
# GPIO: the socketed carrier's only spare XIAO pads are D3 and D7, and both are
# taken (HOLD and the pack divider). The button wake from deep sleep needs an RTC
# GPIO and is therefore not available; the long-press switch-off needs the
# expander fitted.
#
# R16 is 10 kOhm, not the block's 100 kOhm (#1280 pre-fab review, Lauri
# 2026-11-25): GPIO44 (D7) carries the ESP32-S3's weak pull-up through reset
# (datasheet v2.2, pin 50 U0RXD: "At Reset: WPU"; RPU 45 kOhm typical, Table
# 5-4). Against 100 kOhm that put Q3's gate at about 2.28 V, inside the
# 2N7002's 1.0-2.5 V VGS(th) (JSCJ C8545), so whether the robot latched on at
# boot, and stayed off after a firmware switch-off, depended on the unit. With
# 10 kOhm the gate sits at about 0.6 V through reset: hold the button until the
# firmware drives HOLD.
[blocks.latch]
block = "soft-latch"
net_prefix = "LATCH"
build = "carrier"
refs = { hold = "Q3", hold_pd = "R16", d_sw = "D2", d_sense = "D3" }
parts.hold_pd = { name = "10 kΩ HOLD pull-down", value = "10k", lcsc = "C17414" }

# The power button is a chassis button on a JST-XH lead, not an on-board tact
# switch: the repo's tact entry has no LCSC number until its rotation entry is
# checked by hand (docs/reference/parts/tact-switch-ts1187a.toml), the robot's
# chassis is where a person reaches, and a lead costs one connector. The button
# closes BTN to GND. BTN sits at the pack voltage (less one Schottky drop) while
# the robot is off, with about 76 uA behind it (block comment), so the lead
# carries no ESD protection: the button-input block's 5 V TVS and 3V3 pull-up
# would conduct at that voltage and cannot be used here.
[parts.power_button]
name = "Power button lead"
kind = "connector"
build = "carrier"
part = "button-jst-xh2"
ref = "J19"
value = "Power button"

[[rails]]
name = "PWR_SW"
build = "carrier"
from = "input.SW"
to = ["latch.SW"]

[[rails]]
name = "PWR_BTN"
build = "carrier"
from = "latch.BTN"
to = ["power_button.1"]

# The button's SENSE input, on the MCP23017's GPB0 (and the mirror header's
# pin, so the header still shows the line). GPB0 is not in the mirror
# header's [[outputs]] list below for that reason.
#
# R32 pulls SENSE up to 3V3 (#1280 pre-fab review): the MCP23017's own weak
# pull-up is about 100 kOhm (40-115 uA at 5 V, io--mcp23017.md), so a few uA
# of leakage through D2 from the switch node would read as a held button.
# 10 kOhm needs about 66 uA to pull SENSE under VIH (0.8 VDD); pressed, D3
# pulls it to about 0.35 V at 0.33 mA, under VIL (0.2 VDD = 0.66 V).
[parts.sense_pu]
name = "10 kΩ SENSE pull-up"
kind = "resistor"
build = "carrier"
part = "r0805"
ref = "R32"
value = "10k"
lcsc = "C17414"

[[rails]]
name = "PWR_SENSE"
build = "carrier"
from = "latch.SENSE"
to = ["expander.GPB0", "exp_header.GPB0", "sense_pu.B"]

# HOLD (the hold FET's gate) and HOLD_PD (its pull-down) are one net; a net
# takes one pin each, so the block gives them a port each.
[[nets]]
role = "POWER_HOLD_PIN"
to = "latch.HOLD"
build = "carrier"
note = "HIGH holds the pack switch on"

[[nets]]
role = "POWER_HOLD_PIN"
to = "latch.HOLD_PD"
build = "carrier"
note = "100 kΩ pull-down: keeps it low while the MCU is unpowered or in reset"

# The pack-voltage divider into ADC1_CH3 (D3). 100 kOhm from VBAT, the switched
# rail, so it draws nothing with the robot off; 22 kOhm to GND, the ratio
# 22/122 = 0.1803 of the balancebot's rev3 divider. A full 2S pack (8.4 V) reads
# 1.51 V, 6.0 V reads 1.08 V and the BMS-cutoff region around 5 V reads 0.90 V.
# The ESP32-S3 ADC's usable range at each attenuation is not recorded in this
# repo's datasheet summary (docs/reference/datasheets/mcu--esp32-s3.md); 1.51 V
# is chosen to sit in the lower half of any attenuation range ESP-IDF offers,
# and the range is unverified until read from the datasheet. Current: 8.4 V /
# 122 kOhm = 69 uA. The
# source impedance 100k || 22k = 18 kOhm is above the ~10 kOhm usually quoted for
# the ADC's sample-and-hold; the 100 nF at the pad supplies the sampling charge
# and puts a 1.8 ms RC on the reading, slower than a motor-start sag (#991),
# which is what firmware's minimum-duration filter then sees. LCSC numbers as
# balancebot's R2/R3/C3 (R3 is C17560, Basic).
[parts.sense_top]
name = "100 kΩ pack divider, top"
kind = "resistor"
build = "carrier"
part = "r0805"
ref = "R17"
value = "100k"
lcsc = "C149504"

[parts.sense_bottom]
name = "22 kΩ pack divider, bottom"
kind = "resistor"
build = "carrier"
part = "r0805"
ref = "R18"
value = "22k"
lcsc = "C17560"

[parts.sense_filter]
name = "100 nF pack divider filter"
kind = "capacitor"
build = "carrier"
part = "c0805"
ref = "C9"
value = "100nF"
lcsc = "C49678"

[[nets]]
role = "PACK_SENSE_PIN"
to = "sense_top.B"
build = "carrier"
note = "100 kΩ from VBAT"

[[nets]]
role = "PACK_SENSE_PIN"
to = "sense_bottom.A"
build = "carrier"
note = "22 kΩ to GND: 8.4 V (full 2S) reads 1.51 V"

[[nets]]
role = "PACK_SENSE_PIN"
to = "sense_filter.A"
build = "carrier"

# The pack's charger (ADR-038, #1272): the `bq25887-2s-usb-charger` block, on its
# own USB-C receptacle. Its comments carry the datasheet reasoning; checked
# against this robot:
#
# - The USB-C port reaches nothing but the charger. CHG_VBUS is the receptacle's
#   VBUS and the charger's VBUS pin, and no other rail names it: the XIAO's 5V
#   pin is the XIAO's own VBUS (#1252), so tying CHG_VBUS to the 5 V rail, or to
#   mcu.5V, would back-feed it. The XIAO's own USB-C stays the data port and has
#   no connection to this one but the common GND.
# - BAT joins PACK_IN, the pack side of the switched input, so the pack charges
#   with the robot off; the charge current goes through the XT30's + wire and the
#   pack's BMS, not through F1 or the switch FETs. Charging with the robot on
#   shares the part's <= 0.96 A with the load, and the charge then never
#   terminates (block comment): charge with the robot off.
# - The pack's BMS stays. Only the cells' midpoint comes to the carrier, on a
#   JST-XH 3 balance header whose end pins are left open on purpose: wiring a
#   raw cell terminal to GND or PACK_IN would bypass the BMS's switch.
# - Cutoff versus charger: the BMS's over-charge cutoff must sit above 4.221 V
#   per cell (4.20 V + 0.5 %), or it cuts an ordinary charge. This pack's BMS
#   is not recorded in the repo: read it before the first charge.
# - No temperature sensing: TS reads a 10 kohm resistor in place of an NTC, so
#   only the BMS (if it has an NTC input) and the charger's own thermal
#   regulation (120 degC) limit a hot charge.
# - Heat: 0.45 W in the IC and 0.1 W in the inductor at 1.35 A input (block
#   comment). The carrier's copper under the IC and the case are not assessed.
[blocks.charger]
block = "bq25887-2s-usb-charger"
net_prefix = "CHG"
build = "carrier"
refs = { ic = "U5", l = "L1", cvbus = "C10", cpmid1 = "C11", cpmid2 = "C12", csns1 = "C13", csns2 = "C14", csns3 = "C15", cbat1 = "C16", cbat2 = "C17", cregn = "C18", cboot = "C19", rilim = "R19", rmid = "R20", rcb1 = "R21", rcb2 = "R22", rcb3 = "R23", rcb4 = "R24", rt1 = "R25", rt2 = "R26", rts = "R27", sda_pu = "R28", scl_pu = "R29", rd1 = "R30", rd2 = "R31" }

# The charge-only USB-C port. Its data and sideband pins are open (the part's
# no_connect list); the shield goes to GND with the receptacle's own GND pins.
[parts.charge_port]
name = "USB-C charge port"
kind = "connector"
build = "carrier"
part = "usb-c-receptacle-hro-16p"
ref = "J20"
value = "Charge port"

# The pack's balance lead: the cells' midpoint on pin 2, nothing on pins 1 and 3.
[parts.balance_lead]
name = "Pack balance lead (midpoint only)"
kind = "connector"
build = "carrier"
part = "balance-jst-xh3"
ref = "J21"
value = "Pack balance"

[[rails]]
name = "CHG_VBUS"
build = "carrier"
from = "charger.VBUS"
to = ["charge_port.VBUS"]

[[rails]]
name = "CHG_CC1"
build = "carrier"
from = "charger.CC1"
to = ["charge_port.CC1"]

[[rails]]
name = "CHG_CC2"
build = "carrier"
from = "charger.CC2"
to = ["charge_port.CC2"]

[[rails]]
name = "CHG_MID"
build = "carrier"
from = "charger.MID"
to = ["balance_lead.MID"]

# The charger's BAT branch through its own PTC (#1280 pre-fab review): BAT
# joins the pack side of the switch, so its track and the two BAT capacitors
# (C16, C17) sit across the pack with only the BMS behind them, and a cracked
# MLCC is a short. F2 at the XT30 limits that branch. BSMD1812-200-16V (BHFUSE,
# LCSC C883156, Extended, 44,159 in stock on 2026-11-25): 2 A hold, 4 A trip,
