to = "pull_ch3_sda.B"
line = "SDA"
build = "carrier"

[[bus_nets]]
role = "I2C_BUS_CHANNEL_RANGER_FRONT"
from = "mux"
to = "pull_ch3_scl.B"
line = "SCL"
build = "carrier"

[[bus_nets]]
role = "I2C_BUS_CHANNEL_RANGER_REAR"
from = "mux"
to = "pull_ch4_sda.B"
line = "SDA"
build = "carrier"

[[bus_nets]]
role = "I2C_BUS_CHANNEL_RANGER_REAR"
from = "mux"
to = "pull_ch4_scl.B"
line = "SCL"
build = "carrier"

# A continuation of 5V: the bulk capacitors, the LDO's input, and the
# MAX98357A's SD_MODE strapped to its VDD (left channel; the firmware sends the
# same sample on both).
[[rails]]
name = "5V"
build = "carrier"
to = [
    "bulk_pwm.+",
    "bulk_motor.+",
    "bulk_amp.+",
    "ldo.VI",
    "ldo_in.+",
    "amp.SD",
    "tp_power.5V",
    "xiao_diode.A",
]

# The main board's own 3V3, from the LDO; the XIAO's 3V3 pad stays open on the
# head. The loads are the harness rail's above and the carrier's own. The
# MCP23017's RESET is tied straight to 3V3 (active low: always running).
[[rails]]
name = "3V3"
build = "carrier"
from = "ldo.VO"
to = [
    "motor_driver.VCC",
    "pwm.VCC",
    "mux.VIN",
    "ranger_front.VCC",
    "ranger_rear.VCC",
    "oled.VCC",
    "expander.VCC",
    "expander.RESET",
    "exp_header.3V3",
    "ldo_out.+",
    "decouple_pwm.A",
    "decouple_mux.A",
    "pull_ch0_sda.A",
    "pull_ch0_scl.A",
    "pull_ch1_sda.A",
    "pull_ch1_scl.A",
    "pull_ch2_sda.A",
    "pull_ch2_scl.A",
    "pull_ch3_sda.A",
    "pull_ch3_scl.A",
    "pull_ch4_sda.A",
    "pull_ch4_scl.A",
    "pull_up_sda.A",
    "pull_up_scl.A",
    "decouple_exp.A",
    "tp_power.3V3",
    "sense_pu.A",
]

# The series resistor's far end to the buzzer.
[[rails]]
name = "PIEZO_DRV"
build = "carrier"
from = "piezo_r.B"
to = ["buzzer.+"]

# WIRING.md keeps the harness's common ground in prose; the carrier draws it.
# GAIN_SLOT to GND sets the MAX98357A to 12 dB. The MCP23017's A0-A2 go
# straight to GND, so it answers at 0x20 (MCP23017_ADDR) whatever the module's
# own bias on those pins.
[[rails]]
name = "GND"
build = "carrier"
from = "pack.-"
to = [
    "buck.IN-",
    "buck.OUT-",
    "mcu.GND",
    "motor_driver.GND",
    "pwm.GND",
    "mux.GND",
    "amp.GND",
    "amp.GAIN",
    "ranger_front.GND",
    "ranger_rear.GND",
    "oled.GND",
    "expander.GND",
    "expander.A0",
    "expander.A1",
    "expander.A2",
    "exp_header.GND",
    "buzzer.-",
    "ldo.GND",
    "bulk_pwm.-",
    "bulk_motor.-",
    "bulk_amp.-",
    "decouple_pwm.B",
    "decouple_mux.B",
    "decouple_exp.B",
    "ldo_in.-",
    "ldo_out.-",
    "uart_tap.GND",
    "tp_power.GND",
    "tp_i2c.GND",
    "gnd_post_amp.GND",
    "gnd_post_ldo.GND",
    "latch.GND",
    "charger.GND",
    "charge_port.GND",
    "charge_port.SHIELD",
    "power_button.2",
    "sense_bottom.B",
    "sense_filter.B",
]

