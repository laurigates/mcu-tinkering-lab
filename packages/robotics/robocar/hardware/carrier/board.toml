D2 = [80.0, 74.0, 0]
D3 = [80.0, 77.0, 0]
Q3 = [80.0, 80.5, 0]
R16 = [75.0, 80.5, 90]
R32 = [84.5, 74.0, 0]
F2 = [87.0, 80.8, 90]     # the charger's BAT branch PTC, above the XT30's "+"

