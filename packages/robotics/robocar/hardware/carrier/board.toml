R18 = [68.0, 5.0, 0]
C9 = [72.5, 3.75, 90]

# The BQ25887 USB charger (block bq25887-2s-usb-charger), placed by the
# datasheet's priority list (SLUSD89B §11.1) with Figure 81 as the pattern
# (#1280 pre-fab review, two rounds). U5 is unturned: its GND/PMID side faces
# north, its SW/SNS/BAT side east. C11 stands straight over the PMID pins,
# PMID pad over the PMID pins and GND pad over U5's GND pins. The
# 1210 SNS capacitor C13 stands just east of the SNS pins, its GND pad at the
# GND corner and tied 1.0 mm wide to C11's GND. SW leaves under C13's body to
# L1, beside C13, and L1's PMID pad runs north to C12, which stands beside it
# with its GND pad tied to C13's, then west to C11. C19 sits by L1's SW pad.
# BTST (pin 12) and
# SW (17-18) are on opposite corners of the package, with BAT and SNS between,
# so on two layers BTST reaches C19 as fixed tracks through two vias
# ([[vias]]). C14 and C15 are the SNS bulk, C16 and C17 the BAT capacitors
# under the BAT pins; the setting resistors fan out below in pin order, the
# I2C pull-ups and the STAT LED in the second row. The resistor row stands
# 2 mm below U5's pins: at 1 mm only one track fitted between them and the six
