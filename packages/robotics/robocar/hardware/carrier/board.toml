# (SLUSD89B §11.1 items 1, 6; #1280 pre-fab review: a BTST track there cut the
# SNS capacitors' return).
# Notched at x 88.15-89.55 below y 56.0 for BTST's fixed B.Cu run and via to C19.
[[route_keepouts]]
name = "charger power stage, B.Cu"
layer = "B.Cu"
rect = [79.0, 48.5, 88.15, 57.8]

[[route_keepouts]]
name = "charger power stage, B.Cu, over the BTST notch"
layer = "B.Cu"
rect = [88.15, 48.5, 92.5, 56.0]

[[route_keepouts]]
name = "charger power stage, B.Cu, east of the BTST notch"
layer = "B.Cu"
rect = [89.55, 56.0, 92.5, 57.8]

# J21's end pins are the pack's raw cell terminals: keep tracks 1.5 mm off
# them on both layers (the .kicad_dru keeps the pour off), so MID reaches pin 2
# from the north or south and a solder bridge from pin 1 or 3 meets nothing.
[[route_keepouts]]
name = "J21 pin 1, F.Cu"
layer = "F.Cu"
rect = [70.4, 42.4, 73.4, 45.6]

[[route_keepouts]]
name = "J21 pin 1, B.Cu"
layer = "B.Cu"
rect = [70.4, 42.4, 73.4, 45.6]

[[route_keepouts]]
name = "J21 pin 3, F.Cu"
layer = "F.Cu"
rect = [75.6, 42.4, 78.6, 45.6]

[[route_keepouts]]
name = "J21 pin 3, B.Cu"
layer = "B.Cu"
rect = [75.6, 42.4, 78.6, 45.6]

# Around A1's VM pad, where the 2 mm 5V trunk starts: route_board's keepout
# stops flush at a track's end, but the track's round end is wider than the
# socket pad, and Freerouting ran CH1_SDA 0.14 mm from it (#1280). A1:8 is
# the trunk's first pad, out of Freerouting's netlist, so nothing needs in.
[[route_keepouts]]
name = "5V trunk end at A1 VM, F.Cu"
layer = "F.Cu"
rect = [9.3, 61.6, 11.7, 64.0]

# Room for C2's required GND fanout via, west of its GND pad where the
# committed board had it (28.9, 65.2). With the 2 mm VBAT corridor fixed, 5 of
# 8 routes left no place for it within reach (carrier-pcb trap 38).
[[route_keepouts]]
name = "C2 GND fanout via, F.Cu"
layer = "F.Cu"
rect = [28.0, 64.3, 29.8, 66.1]

[[route_keepouts]]
name = "C2 GND fanout via, B.Cu"
layer = "B.Cu"
rect = [28.0, 64.3, 29.8, 66.1]

# Room for U2's required GND fanout via, below its pin 1 where the committed
# board had it (42.62, 75.4). With the pull-up row moved behind the TCA9548A
# clone's outline (2026-11-02), Freerouting ran CH1_SDA down x 42.7 on B.Cu and
# the via found no place on every complete route. Clear of the pad (y 74.5)
# and the 5V trunk (x 41.8), so the pad stays reachable (trap 44).
[[route_keepouts]]
name = "U2 GND fanout via, F.Cu"
layer = "F.Cu"
rect = [41.85, 74.6, 43.45, 76.2]

[[route_keepouts]]
name = "U2 GND fanout via, B.Cu"
layer = "B.Cu"
rect = [41.85, 74.6, 43.45, 76.2]

# Room for C7's required GND fanout via, between its pads under the body,
# where the committed board had it (45.25, 63.4). With the fixed tracks read
# as wiring instead of walled off (#1280), Freerouting packed tracks against
# the 5V trunk there and 7 of 8 routes left no place for it (trap 38).
[[route_keepouts]]
name = "C7 GND fanout via, F.Cu"
layer = "F.Cu"
rect = [44.9, 62.6, 46.2, 64.2]

[[route_keepouts]]
name = "C7 GND fanout via, B.Cu"
layer = "B.Cu"
rect = [44.9, 62.6, 46.2, 64.2]

# Freerouting width classes, in this order. `nets` are net names or fnmatch
# patterns over them; every pattern must match, and no net may be in two classes.
[[net_classes]]
name = "power"
nets = ["PACK_IN", "PACK_SWD", "VBAT", "CHG_BAT", "+5V", "MOT_*"]
track_um = 1000
clearance_um = 300
via_um = [1000, 500]

# GND at 0.5 mm: the pours carry its current, and a 1.0 mm track landing on
# the USB-C port's 0.6 mm GND pads would come within 0.25 mm of the VBUS pad
# beside them (until #1280 GND was in the power class at 1.0 mm). Its routing
# vias are 0.6/0.3 mm: route_board grows a smaller via to its class's size,
# and grown to 1.0 mm two landed 0.16 mm and 0.07 mm from +3V3 copper. The
# [fanout] vias keep their own 1.0/0.5 mm.
[[net_classes]]
name = "ground"
nets = ["GND"]
track_um = 500
clearance_um = 200
via_um = [600, 300]

# The USB-C input, port to C10, at 1.35 A (R19's input limit).
[[net_classes]]
name = "usb_power"
nets = ["CHG_VBUS"]
track_um = 500
clearance_um = 200
via_um = [600, 300]

# The charger's switching nodes. Their wide paths are fixed [[tracks]]; this
# is the width Freerouting may use into U5's 0.5 mm-pitch pins.
[[net_classes]]
name = "charger"
nets = ["CHG_PMID", "CHG_SW", "CHG_SNS"]
track_um = 300
clearance_um = 200
via_um = [600, 300]

# The logic rails: the XIAO and its camera draw well under 1 A. XIAO_5V is
# the ribbon's 5V behind D1. The via is the signal one: Freerouting placed
# U2's +3V3 via at 0.6 mm whatever the class said (carrier-pcb trap 36), and
# grown to 0.8/0.4 after routing it came 0.16 mm from a GND track in 8 of 12
# routes (#1280). A 0.3 mm drill carries over 1 A (estimate), above these
# rails' load.
[[net_classes]]
name = "logic_power"
nets = ["+3V3", "XIAO_5V"]
track_um = 500
clearance_um = 250
via_um = [600, 300]

# Every net not in a class above. Its via must be the .kicad_pro Default class's.
# 200 um clearance, the .kicad_pro Default's, because Freerouting left
# sub-minimum necking between 2.54 mm-pitch pads at 250 (#793). 0.2 mm wide,
# the .kicad_pro minimum, since #1280: J1's 2x8 2.0 mm-pitch pads leave 0.65 mm
# between pins and U5's setting pins sit at 0.5 mm, where a 0.3 mm track does
# not pass; at 0.3 mm UART0_TX and I2C_SDA could not leave J1. 220 um
# clearance: at exactly the DRC's 200 Freerouting left gaps of 0.18-0.19 mm.
[signal]
track_um = 200
clearance_um = 220
via_um = [600, 300]

# A GND pour on both layers after routing, the whole board. The .kicad_dru
# lets a thermal resolve to one spoke because route_board first checks every
# pad of the net has a routed track.
[pour]
layers = ["F.Cu", "B.Cu"]
regions = [
    { net = "GND", rect = [0.0, 0.0, 100.0, 100.0] },
]
clearance_mm = 0.4
min_thickness_mm = 0.25
thermal_gap_mm = 0.3
spoke_mm = 0.35
# A via of each ground at each 5 mm grid point where both layers' fill holds
# one (pcb/stitch.py): joins the F.Cu and B.Cu pours where no pad or routed via
# does.
stitch = { pitch_mm = 5.0, via_um = [600, 300] }
# J20's GND pads (the stacked A1/B12 and A12/B1, 0.3 mm wide at 0.5 mm pitch)
# have room for one thermal spoke beside the VBUS pads and DRC asks for two;
# each already ties to the shield by a fixed track, so they join the pour
# solid. The receptacle is machine-placed (#1280).
solid_pads = ["J20:A1", "J20:B12", "J20:A12", "J20:B1"]

# A via beside every SMD pad of a poured net, added after routing where there
# is room (#810): Freerouting adds a via only where a track changes layer, so
# the committed board reached B.Cu's GND from its SMD ground pads through one
# via in all. `required` is every SMD ground pad on a power path: the 470 uF
# bulk capacitors C1 (PCA9685 V+) and C2 (TB6612FNG VM), the decoupling C4
# and C5, and the AMS1117 with its input and output capacitors.
# route_board.py fails the route if one of those finds no room. C3's GND pad
# reaches both layers through J13's through-hole pad instead ([[tracks]]).
[fanout]
nets = ["GND"]
# The power class's via: route_board.py grows a smaller one to it after
# placing it, which can land it on its own pad (carrier-pcb skill, trap 42).
via_um = [1000, 500]
track_um = 400
reach_mm = 2.5
required = ["C1:2", "C2:2", "C4:2", "C5:2", "C7:2", "C8:2", "U2:1"]
# J20's GND pads tie into the shield's through-hole pad, which joins both
# layers, as C3:2 does through J13.
exempt = ["C3:2", "J20:A1", "J20:B12", "J20:A12", "J20:B1"]
# U5's exposed pad (pin 25) sits inside its ring of pins, where Freerouting
# cannot reach it (trap 28): it leaves the netlist and takes its vias in the
# pad. Five 0.3 mm-drill vias, at the centre and 1 mm along each axis
# (SLUSD89B §11.1 item 6: "sufficient thermal vias directly under the IC";
# #1280 pre-fab review: one via carried the whole charger ground). They
# overlap the footprint's paste windows' corners, so order the board with via
# filling and capping or accept some solder wicking.
in_pad = ["U5:25"]
in_pad_vias = { "U5:25" = { via_um = [500, 300], at = [[0, 0], [1.0, 0], [-1.0, 0], [0, 1.0], [0, -1.0]] } }

# Where carrier-fab writes the commit on F.SilkS: `r<N> <sha7> <pcb8>`, the git
# commit and the first 8 hex digits of the check stamp's board_sha256, so the
# Gerber viewer and the delivered board both say which upload was built
# (kicad.provenance). On a plotting copy only; the committed board and stamp
# stay as they are. Under the title (the board has no revision text), inside
# A2's outline; carrier-fab fails if DRC finds it on a pad or a line.
# [fab] revision (kicad.revision): carrier-fab writes it as `r<N>` ahead of
# the commit, and in every output name. Bump it when the board changes after
# an order in orders.toml; the kicad-carrier hook fails until it is.
[fab]
revision = 2
provenance_at = [22.0, 49.4]
provenance_size = 1.0
