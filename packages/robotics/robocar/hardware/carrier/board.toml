C12 = [87.0, 50.6, 270]   # PMID, beside L1's PMID pad: PMID pad north, GND pad south
C13 = [86.6, 55.2, 90]    # SNS, GND pad north
L1 = [89.65, 53.6, 90]    # PMID (top) to SW (bottom)
C19 = [90.95, 56.77, 0]   # BTST (west) to SW (east)
C14 = [93.2, 60.4, 270]   # SNS bulk
C15 = [96.6, 60.4, 270]   # SNS bulk
C16 = [84.95, 60.9, 270]  # BAT
C17 = [87.2, 60.9, 270]   # BAT
C18 = [82.5, 62.0, 270]   # REGN
