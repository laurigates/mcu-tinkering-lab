# Carrier PCB layout for tools/kicad: everything the netlist does not say.
# Parts, footprints and nets come from ../../hardware.toml and the parts
# registry (docs/reference/parts/); this file says where each part sits, how
# wide each net's tracks are, and what goes on the silkscreen.
#
# The main board (chassis plate), the whole 100 x 100 mm PCB. The three head
# boards that carry the XIAO are a PCB of their own (../../head/, side "head");
# they shared this panel, in a column on the right, until #1280 (Lauri,
# 2026-11-25), when the main board needed their area for the power switch, the
# soft latch and the USB charger (ADR-038). This board is side "main" of the
# hardware.toml's [[cables]] split (kicad.netlist).
#
# Every dimension below is Claude's proposal, not a measurement, and each one
# says what to measure. Correct it, then re-run
# `just robocar::carrier-board` and `just robocar::carrier-check`.
# The power tracks in [[tracks]] are laid by hand; the rest are Freerouting's.
# An adversarial pre-fab review checked the routed board (README § Pre-order
# review); Lauri's bench checks there still come before paying for an order.
#
# Coordinates: millimetres from the outline's top-left corner, x right, y down.
# The top edge is the robot's front, the bottom edge its rear.
#
# `python3 -m kicad.boardcheck` validates every table against the netlist.
# `python3 -m kicad.boardinput` turns this file and the netlist into the JSON
# the pcbnew scripts in tools/kicad/pcb/ place and route from.

[project]
name = "robocar-carrier"     # the KiCad project directory and file stem here
side = "main"                # the heads are ../../head/hardware/carrier/
# The schematic writer grows the sheet until the drawing fits; this carrier's
# needs A2, so the sheet is named as the generated file has it.
paper = "A2"

# 100 x 100 mm keeps the order in JLCPCB's smallest price band (Lauri: stay
# within it). No ready-made chassis plate constrains it, and hole placement has
# no hard requirement (Lauri, 2026-10-16): the chassis is drilled to match the
# board.
[outline]
origin = [100.0, 100.0]
size = [100.0, 100.0]

# KiCad's copper-to-edge clearance (0.5 mm, .kicad_pro) as rule areas along
# the outline: Freerouting keeps only its class clearance from the board
# boundary (carrier-pcb trap 22). Not along the bottom edge, where J3's
# courtyard reaches the outline and a rule area would refuse the footprint.
[[keepouts]]
name = "edge clearance, top"
rect = [0.0, 0.0, 100.0, 0.5]

[[keepouts]]
name = "edge clearance, left"
rect = [0.0, 0.0, 0.5, 100.0]

# Split round J20, which sits flush with the edge (HRO's recommended board
# edge line); its mouth would otherwise be 1.5 mm in from the edge.
[[keepouts]]
name = "edge clearance, right, above J20"
rect = [99.5, 0.0, 100.0, 39.0]

[[keepouts]]
name = "edge clearance, right, below J20"
rect = [99.5, 51.0, 100.0, 100.0]

# ref = [x_mm, y_mm, rotation_deg], or [x_mm, y_mm, rotation_deg, "back"] for a
# part on the back face (rotation as seen from the top), relative to the
# origin; each footprint's own anchor (pad 1 for the sockets and connectors). A
# breakout socket's courtyard is its module's outline, so no part sits under a
# module.
[placement]
# M3 holes at the corners; the chassis is drilled to match them (no hard
# requirement on placement, Lauri, 2026-10-16). H2 and H4 moved from x 65 to the
# right-hand corners when the heads left the panel (#1280).
H1 = [4.0, 4.0, 0]
H2 = [96.0, 4.0, 0]
H3 = [4.0, 96.0, 0]
H4 = [96.0, 96.0, 0]
# Front row: both rangefinders side by side over the TCA9548A's channel 3 and 4
# pads, then the ribbon's main end and the UART0 tap beside it. Lauri's
# "a 10-15 cm ribbon reaches the head" (2026-10-16) was said of J1's spot
# beside the old head column, about 22 mm further right; confirm it reaches
# from here. J1 is a 2x8 since ADR-038, 2 mm longer toward +x, so D1 and J15
# moved 2.2 mm right.
J7 = [11.0, 4.0, 0]       # RCWL-1601 front
J8 = [25.0, 4.0, 0]       # RCWL-1601 rear
J1 = [37.5, 6.0, 90]      # ribbon, main end
# D1 between J1 and J15: the XIAO's 5V through a Schottky (pre-fab review BL-2).
D1 = [54.6, 4.0, 90]
J15 = [57.7, 2.3, 0]      # UART0 TX tap: GND, TX; the ROM boot log, 115200 baud
# The MCP23017's decoupling (WIRING.md's C6) beside the CJMCU-2317's VCC pin.
C6 = [38.6, 8.6, 0]
# The TCA9548A turned so its channel 3/4 header faces the rangefinders and its
# upstream and channel 0/1/2 header faces the PCA9685 and the expander. The
# socket also takes the purple TCA9548A/PCA9548A clone, whose rows are one
# pitch wider: its upstream row goes in the second row of holes at y 28.04,
# one pitch toward the rear (Breakout_Sockets twin, Lauri, 2026-11-02). Its
# 21.8 x 31.2 mm board reaches y 30.25 there, and to x 32.55 along the rows.
# The socket sits 0.3 mm further forward than before for that row; its
# silkscreen then needs J7's and J8's labels at 0.8 mm.
A3 = [2.5, 25.7, 90]
# One row behind the clone's outline and in front of the PCA9685's courtyard
# (y 34.58), at a 2.9 mm pitch: the VIN decoupling below its VIN pin, the
# upstream I2C pull-ups (pre-fab review N-4), then the mux channel pull-ups,
# ch0 and ch1, then ch3 and ch4. Channel 2's pair sits under the test headers,
# on its way to the expander (Freerouting necked tracks between the row's pads
# at a 2.5 mm pitch).
C5 = [1.7, 32.45, 90]      # TCA9548A VIN decoupling
R12 = [4.6, 32.45, 90]     # SDA
R13 = [7.5, 32.45, 90]     # SCL
R2 = [10.4, 32.45, 90]
R3 = [13.3, 32.45, 90]
R4 = [16.2, 32.45, 90]
R5 = [19.1, 32.45, 90]
R6 = [22.0, 32.45, 90]
R7 = [24.9, 32.45, 90]
R8 = [27.8, 32.45, 90]
R9 = [30.7, 32.45, 90]
R10 = [34.4, 33.3, 0]     # ch2 SDA
R11 = [38.4, 33.3, 0]     # ch2 SCL
# Test headers right of the mux, clear of the clone's outline (x 32.55).
J11 = [34.7, 11.0, 0]     # supply: 3V3, 5V, GND, VBAT; VBAT's only neighbour is GND
J12 = [34.7, 22.5, 0]     # I2C SDA/SCL and MUX_RST, main side of the ribbon
# The MCP23017 module (CJMCU-2317) in sockets under all 30 holes, turned 180
# degrees: its single column (I2C and supply) faces the mux and its GPIO double
# column faces the right edge. The mirror header J18 copies that double column
# beside it, turned the same way, so its rows and columns sit in the module's
# own order: column A (GPA, the outer column) at the edge, row 1 (GND/3V3) at
# the bottom.
A5 = [60.7, 32.7, 180]
J18 = [67.0, 32.7, 180]
# The PCA9685 across the board; servo columns on the module face the rear.
A2 = [5.0, 53.8, 0]
C4 = [1.6, 51.3, 90]      # PCA9685 VCC decoupling, beside its VCC pin
# The motor driver with both motor connectors beside its motor outputs, its
# bulk capacitor and the PCA9685's to its right, then the 3V3 regulator, the
# amplifier at the right. C1, C2 and C7 are turned so their "+" pads face the
# 5V trunk ([[tracks]] below).
J6 = [3.5, 67.1, 90]      # right motor (channel A)
J5 = [3.5, 76.1, 90]      # left motor (channel B)
A1 = [10.5, 80.6, 0]      # TB6612FNG socket
C2 = [35.5, 65.2, 180]    # TB6612FNG VM bulk
C1 = [35.5, 75.1, 180]    # PCA9685 V+ bulk
C7 = [45.6, 63.4, 180]    # LDO input
U2 = [45.6, 70.6, 90]     # AMS1117-3.3
C8 = [45.6, 77.0, 0]      # LDO output
J14 = [44.0, 81.2, 90]    # GND post beside the AMS1117
A4 = [67.0, 79.0, 0]      # MAX98357A socket; the speaker lead leaves the module
# Rear row, left: the buzzer and its resistor where the XT30 and the buck lead
# were, the OLED lead, the amplifier's bulk under the amplifier beside its Vin
# pin, its ground post.
J9 = [31.6, 82.6, 0]      # SSD1306 OLED lead
C3 = [62.6, 86.55, 180]   # MAX98357A Vin bulk
J13 = [50.5, 85.3, 90]    # GND post beside the MAX98357A
BZ1 = [20.0, 92.5, 180]   # 12 mm buzzer, soldered to the board; "+" toward R1
R1 = [25.5, 95.5, 0]      # buzzer series resistor

# Rear row, right: the pack path along the rear edge (ADR-038, #1270), PACK_IN
# from the XT30's "+" through the back-to-back P-FETs Q1 and Q2 (common source
# PACK_COMMON, gates on PACK_GATE), the PTC F1 after Q2, and VBAT into the buck
# lead's IN+. J4 is turned 180 degrees so IN+ (pin 1) is its right-hand pin.
# R14 and R15 sit north of the FETs: beside the rear edge, between the FETs
# and the fixed tracks, Freerouting could not get PWR_SW or PACK_GATE out.
J3 = [82.0, 86.3, 180]    # XT30 pack in, mating face to the rear edge
Q1 = [73.5, 96.5, 0]      # pack-side P-FET, drain on PACK_IN, source pin 1 at the top
Q2 = [67.5, 96.5, 180]    # load-side P-FET, drain on PACK_SWD, gate at the top
F1 = [61.0, 96.5, 180]    # PTC fuse after Q2: PACK_SWD to VBAT
J4 = [53.9, 94.4, 180]    # LM2596 lead, JST VH 4, IN+ at the right
R14 = [70.5, 92.8, 180]   # gate pull-up to PACK_COMMON (FETs off): Q1 source to Q2 gate
R15 = [66.5, 92.8, 180]   # gate (east pad) to PWR_SW (west pad)

# The soft latch (block soft-latch): the power button's lead J19, its two
# diodes (D2 into PWR_SW, D3 into the expander's PWR_SENSE) and Q3, which holds
# PWR_SW low once the XIAO drives PWR_HOLD; R16 pulls PWR_HOLD down, R32 pulls
