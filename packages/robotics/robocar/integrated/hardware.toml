# The socketed carrier's 470 µF electrolytics (WIRING.md § Suggested
# capacitors) made up for an LM2596 module at the end of a lead; here the buck
# is millimetres away, and TI caps the low-ESR capacitance on its output
# (above). These are the LDO's 22 µF tantalum, part for part: their ESR keeps
# them out of the buck's loop, and on AMP_5V it damps FB1 against C17, a
# ferrite and a ceramic alone being a resonant LC.
