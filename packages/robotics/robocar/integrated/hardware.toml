# The robocar carrier with every breakout's chip on the main board
# itself: the integrated variant of ../hardware.toml, kept as a subproject of
# the firmware project to compare the two approaches (board area, part count,
# assembly). The firmware, the pin header and the head board are robocar's;
# this file holds no pin numbers, and every `role` resolves against
# ../main/pin_config.h.
#
# What differs from ../hardware.toml's carrier view:
#
# - The five breakout sockets (A1-A5) are bare chips (U5-U9) with the
#   passives each breakout carried that the circuit still needs: decoupling,
#   the mux's upstream pull-ups and reset pull-up, the PCA9685's output series
#   resistors on the servo and LED channels.
# - The MAX98357A takes 5V through a ferrite bead (FB1) as its own net, AMP_5V.
# - The LM2596 module and its lead (J4) are a TPS563208 buck converter (U10)
#   on the board, 3 A like the module, with its inductor, capacitors and
#   feedback divider.
# - The servos, the RGB LEDs and the speaker plug into the board (J19-J23),
#   where the socketed carrier uses the breakouts' own columns and terminal.
# - The same three head boards as the socketed carrier (U1/J2, and the spares
#   U3/J16 and U4/J17 on nets HEAD2_* and HEAD3_*), so both PCBs carry the
#   same set of parts outside the main board.
#
# Every other part keeps its reference and its role: the connectors, test
# headers, bulk capacitors, LDO, pull-ups, buzzer and mounting holes. No entry
# carries `build`, except the cable, so the harness view is this carrier
# without its ribbon. Nothing generates documentation from that view: the
# project has no WIRING.md and no build guide.
#
# Every SMD part has an LCSC number (#808), on its registry entry for the
# chips and the inductor, here for the passives, so JLCPCB can assemble the
# whole front side; only the through-hole connectors, sockets and headers are
# left to solder. Passives are JLCPCB Basic parts where one exists (stock and
# library type checked 2026-10-19); each Extended part costs a loading fee per
# order. Every LCSC number has a checked placement rotation in
# docs/reference/jlcpcb-rotations.toml. Three fiducials (FID1-FID3) mark the
# main board for the pick-and-place camera.

[source]
convention = "robocar"
header = "../main/pin_config.h"
board = "docs/reference/boards/xiao-esp32s3.md"
mcu = "XIAO ESP32-S3 Sense"
part = "seeed-xiao-esp32s3-socket"
ref = "U1"

# --- The breakout chips, on the board ----------------------------------------

# A0-A2 to GND: address 0x70 (TCA9548A_ADDR). RESET is pulled up here (R16),
# as the breakout does, and still driven by the XIAO's D2.
[parts.mux]
name = "TCA9548A"
kind = "i2c-mux"
part = "tca9548a-tssop24"
ref = "U5"

# A0-A5, OE and EXTCLK to GND: address 0x40 (PCA9685_ADDR), outputs always
# enabled, the internal oscillator. The breakout pulls OE low through a
# resistor and A0-A5 low the same way; tied straight to GND here.
[parts.pwm]
name = "PCA9685"
kind = "pwm-driver"
part = "pca9685-tssop28"
ref = "U6"

[parts.motor_driver]
name = "TB6612FNG"
kind = "motor-driver"
part = "tb6612fng-ssop24"
ref = "U7"

# SD_MODE strapped to VDD (left channel) and GAIN_SLOT to GND (12 dB), as on
# the socketed carrier.
[parts.amp]
name = "MAX98357A"
kind = "i2s-amp"
part = "max98357a-tqfn16"
ref = "U8"

# A0-A2 to GND: address 0x20 (MCP23017_ADDR); RESET tied to 3V3.
[parts.expander]
name = "MCP23017"
kind = "gpio-expander"
note = "optional in firmware; always fitted here"
part = "mcp23017-ssop28"
ref = "U9"

# --- 5 V buck converter (replaces the LM2596 module) ------------------------
# The TPS563208 stage is the `tps563208-5v` block (docs/reference/blocks/): the
# datasheet reasoning for every value is there. What is this board's:
#
# - fb_top (R12) is 56 kΩ: 5.07 V typical, 4.94-5.19 V over VFB's tolerance.
#   At typical VFB, less the trunk's roughly 50 mV at 2 A, VM stays in the
#   TB6612FNG's VM >= 5 V operating row (1.0 A per channel; 0.4 A below 5 V);
#   at VFB's minimum it does not. It stays under the MAX98357A's 5.5 V.
# - The bulk capacitors on 5V (C1, C2, C3 below) are MnO2 tantalums, as the
#   block requires; the input side carries the electrolytic bulk (C19, below).
# - The forced-continuous part matters here: the TB6612FNG's body diodes push
#   a braking motor's energy back into 5V.
# - The EN divider cuts out at about 4.0-4.6 V; the pack's external 2S BMS is
#   the undervoltage protection.
[blocks.buck]
block = "tps563208-5v"
net_prefix = "BUCK"

[blocks.buck.refs]
ic = "U10"
l = "L1"
en_top = "R25"
en_bot = "R26"
cin1 = "C9"
cin2 = "C11"
cin_hf = "C10"
boot = "C12"
cout1 = "C13"
cout2 = "C14"
cout3 = "C20"
fb_top = "R12"
fb_bot = "R13"

# Pack input protection is the `pack-input-pfet-ptc` block: XT30 + -> Q1 -> F1
# -> VBAT (sixth pre-fab layout review, N9). The block carries the DMP3013SFV
# and fuse reasoning. Sized for this board: about 2.5-3 A on VBAT near the end
# of discharge, and up to about 5.5 A while the buck sits in its current limit.
# Q1 sits before F1 here, where balancebot's sits after it; the order keeps
# PACK_IN, PACK_RP and VBAT running one way across the board.
#
# Power-stage checklist (.claude/rules/power-stage-checklist.md) for the input
# stage: 3 (input protection) is F1 and Q1; 11 (input path) is the fixed
# tracks in board.toml, PACK_IN 1.2 mm over 3.48 mm and PACK_RP 1.5 mm over
# 2.30 mm, no via (`carrier-measure path`; about 1.5 and 0.5 mohm by
# `carrier-measure resistance`, estimates). The rest belong to the buck above.
[blocks.input]
block = "pack-input-pfet-ptc"
net_prefix = "PACK"
net_names = { GATE = "PFET_GATE" }
refs = { fet = "Q1", gate = "R27", fuse = "F1" }

# The input's bulk capacitor. On VBAT, where it does not touch the buck's loop,
# and an aluminium electrolytic for its ESR: it damps the ringing between the
# battery leads' inductance and the ceramic input capacitors when the XT30 is
# plugged in, which a polymer or MnO2 tantalum would not (and a tantalum takes
# that surge badly). C2836437 (100 µF 35 V, 6.3 x 7.7 mm), the balancebot's
# input capacitor: 35 V costs nothing over 25 V in this case size.
[parts.bulk_in]
name = "100 µF 35 V bulk capacitor, buck input"
kind = "capacitor"
part = "cp-elec-6.3x7.7"
ref = "C19"
value = "100uF 35V"
lcsc = "C2836437"

# --- Passives the breakouts carried -----------------------------------------

[parts.decouple_exp]
name = "100 nF decoupling, MCP23017 VDD"
kind = "capacitor"
part = "c0805"
ref = "C6"
value = "100nF"
lcsc = "C49678"

[parts.motor_vcc_c]
name = "100 nF decoupling, TB6612FNG VCC"
kind = "capacitor"
part = "c0805"
ref = "C15"
value = "100nF"
lcsc = "C49678"

[parts.motor_vm_c]
name = "10 µF ceramic, TB6612FNG VM"
kind = "capacitor"
part = "c0805"
ref = "C16"
value = "10uF 25V"
lcsc = "C15850"

# VM1 (pin 24) is at the other end of the package from VM2/VM3 (pins 13/14),
# 11.6 mm of track from C16: its own 10 µF beside it (pre-fab layout review, m3).
# The XIAO's 5V pad is its USB-C VBUS (docs/reference/boards/xiao-esp32s3.md;
# Seeed asks for a diode between an external supply and it). Without one, a
# USB cable on the head's XIAO and the buck feed each other: the PC's port
# carries motor and servo current, or the buck back-drives the PC. A B5819W
# from 5V to the ribbon's 5V conductors, as the balancebot carrier's D1: USB
# then reverse-biases it, and the XIAO sees 5V less about 0.4 V (pre-fab
# review of the socketed carrier, BL-2).
[parts.xiao_diode]
name = "B5819W Schottky, 5V to the XIAO's 5V pad"
kind = "diode"
part = "b5819w"
ref = "D1"

[parts.motor_vm1_c]
name = "10 µF ceramic, TB6612FNG VM1"
kind = "capacitor"
part = "c0805"
ref = "C21"
value = "10uF 25V"
lcsc = "C15850"

[parts.amp_c10u]
name = "10 µF ceramic, MAX98357A VDD"
kind = "capacitor"
part = "c0805"
ref = "C17"
value = "10uF 25V"
lcsc = "C15850"

[parts.amp_c100n]
name = "100 nF decoupling, MAX98357A VDD"
kind = "capacitor"
part = "c0805"
ref = "C18"
value = "100nF"
lcsc = "C49678"

# The XIAO has no I2C pull-ups; the TCA9548A breakout pulled up its upstream
# SDA and SCL, and its RESET. 2.2 kΩ, not the breakout's 10 kΩ, for the
# 400 kHz rise time (the socketed carrier's reasoning, #810): the upstream bus
# carries the XIAO, the mux, the PCA9685 and the MCP23017. R16 (RESET) stays
# 10 kΩ.
[parts.pull_up_sda]
name = "2.2 kΩ pull-up, upstream I2C SDA"
kind = "resistor"
part = "r0805"
ref = "R14"
value = "2.2k"
lcsc = "C17520"

[parts.pull_up_scl]
name = "2.2 kΩ pull-up, upstream I2C SCL"
kind = "resistor"
part = "r0805"
ref = "R15"
value = "2.2k"
lcsc = "C17520"

[parts.pull_rst]
name = "10 kΩ pull-up, TCA9548A RESET"
kind = "resistor"
part = "r0805"
ref = "R16"
value = "10k"
lcsc = "C17414"

# The PCA9685 breakout's 220 Ω series resistor on every output, kept on the
# channels that leave the board (LEDs and servos). The six motor-driver
# channels stay on the board and go straight to the TB6612FNG. Green and blue
# take 47 Ω instead: the anode is 3V3 and their forward voltage is 2.9-3.2 V,
# which leaves next to nothing across 220 Ω (about 4-6 mA through 47 Ω; red
# keeps 220 Ω, about 6 mA at 2 V).
[parts.res_led_l_r]
name = "220 Ω series, left LED red"
kind = "resistor"
part = "r0805"
ref = "R17"
value = "220"
lcsc = "C17557"

[parts.res_led_l_g]
name = "47 Ω series, left LED green"
kind = "resistor"
part = "r0805"
ref = "R18"
value = "47"
lcsc = "C17714"

[parts.res_led_l_b]
name = "47 Ω series, left LED blue"
kind = "resistor"
part = "r0805"
ref = "R19"
value = "47"
lcsc = "C17714"

[parts.res_led_r_r]
name = "220 Ω series, right LED red"
kind = "resistor"
part = "r0805"
ref = "R20"
value = "220"
lcsc = "C17557"

[parts.res_led_r_g]
name = "47 Ω series, right LED green"
kind = "resistor"
part = "r0805"
ref = "R21"
value = "47"
lcsc = "C17714"

[parts.res_led_r_b]
name = "47 Ω series, right LED blue"
kind = "resistor"
part = "r0805"
ref = "R22"
value = "47"
lcsc = "C17714"

[parts.res_servo_pan]
name = "220 Ω series, pan servo signal"
kind = "resistor"
part = "r0805"
ref = "R23"
value = "220"
lcsc = "C17557"

[parts.res_servo_tilt]
name = "220 Ω series, tilt servo signal"
kind = "resistor"
part = "r0805"
ref = "R24"
value = "220"
lcsc = "C17557"

# The amplifier's own supply, AMP_5V, through a ferrite bead from 5V: it keeps
# the class-D switching off the motor and logic rail, and it lets the autorouter
# give 5V tracks wider than the MAX98357A's 0.5 mm-pitch pins allow (one width
# per net). Murata BLM21PG221SN1D (C85840): 220 Ω at 100 MHz, 2 A, 45 mΩ DCR
# (JLCPCB's listing, 2026-10-19). The amplifier's 1 A peaks drop about 45 mV.
[parts.amp_fb]
name = "Ferrite bead, MAX98357A supply"
kind = "ferrite-bead"
part = "ferrite-bead-0805"
ref = "FB1"
value = "220R@100MHz 2A"
lcsc = "C85840"

