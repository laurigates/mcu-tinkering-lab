# --- Power --------------------------------------------------------------------

[[rails]]
name = "PACK_IN"
from = "pack.+"
to = ["input.IN"]

[[rails]]
name = "VBAT"
from = "input.OUT"
to = [
    "buck.VIN",
    "bulk_in.+",
    "tp_power.VBAT",
]

# The buck's output. The servo headers' V+ is this rail, as the PCA9685
# breakout's V+ was; the amplifier takes it through FB1 (AMP_5V, above).
[[rails]]
name = "5V"
from = "buck.VOUT"
to = [
    "xiao_diode.A",
    "motor_driver.VM",
    "motor_vm_c.A",
    "motor_vm1_c.A",
    "amp_fb.1",
    "servo_pan.V+",
    "servo_tilt.V+",
    "bulk_pwm.+",
    "bulk_motor.+",
    "ldo.VI",
    "ldo_in.+",
    "tp_power.5V",
]

# The ribbon's 5V, behind D1 (above).
[[rails]]
name = "XIAO_5V"
from = "xiao_diode.K"
to = ["mcu.5V"]

# SD_MODE strapped to the amplifier's VDD (left channel), as on the socketed
# carrier.
[[rails]]
name = "AMP_5V"
from = "amp_fb.2"
to = ["amp.Vin", "amp.SD", "amp_c10u.A", "amp_c100n.A", "bulk_amp.+"]

[[rails]]
name = "3V3"
from = "ldo.VO"
to = [
    "motor_driver.VCC",
    "motor_vcc_c.A",
    "pwm.VCC",
    "decouple_pwm.A",
    "mux.VIN",
    "decouple_mux.A",
    "expander.VCC",
    "expander.RESET",
    "decouple_exp.A",
    "exp_header.3V3",
    "ranger_front.VCC",
    "ranger_rear.VCC",
    "oled.VCC",
    "led_left.ANODE",
    "led_right.ANODE",
    "ldo_out.+",
    "pull_up_sda.A",
    "pull_up_scl.A",
    "pull_rst.A",
    "pull_ch0_sda.A",
    "pull_ch0_scl.A",
    "pull_ch1_sda.A",
    "pull_ch1_scl.A",
    "pull_ch2_sda.A",
    "pull_ch2_scl.A",
    "pull_ch3_sda.A",
    "pull_ch3_scl.A",
    "pull_ch4_sda.A",
    "pull_ch4_scl.A",
    "tp_power.3V3",
]

[[rails]]
name = "PIEZO_DRV"
from = "piezo_r.B"
to = ["buzzer.+"]

# The series resistors' far ends to the LED and servo headers.
[[rails]]
name = "LED_L_R"
from = "res_led_l_r.B"
to = ["led_left.R"]

[[rails]]
name = "LED_L_G"
from = "res_led_l_g.B"
to = ["led_left.G"]

[[rails]]
name = "LED_L_B"
from = "res_led_l_b.B"
to = ["led_left.B"]

[[rails]]
name = "LED_R_R"
from = "res_led_r_r.B"
to = ["led_right.R"]

[[rails]]
name = "LED_R_G"
from = "res_led_r_g.B"
to = ["led_right.G"]

[[rails]]
name = "LED_R_B"
from = "res_led_r_b.B"
to = ["led_right.B"]

[[rails]]
name = "SERVO_PAN"
from = "res_servo_pan.B"
to = ["servo_pan.PWM"]

[[rails]]
name = "SERVO_TILT"
from = "res_servo_tilt.B"
to = ["servo_tilt.PWM"]

# One ground. The strapping pins sit here too: the address pins of the mux,
# the PWM driver and the expander, the PCA9685's OE and EXTCLK, and the
# MAX98357A's GAIN_SLOT (12 dB).
[[rails]]
name = "GND"
from = "pack.-"
to = [
    "mcu.GND",
    "buck.GND",
    "bulk_in.-",
    "input.GND",
    "motor_driver.GND",
    "motor_driver.PGND1",
    "motor_driver.PGND2",
    "motor_vcc_c.B",
    "motor_vm_c.B",
    "motor_vm1_c.B",
    "pwm.GND",
    "pwm.A0",
    "pwm.A1",
    "pwm.A2",
    "pwm.A3",
    "pwm.A4",
    "pwm.A5",
    "pwm.OE",
    "pwm.EXTCLK",
    "decouple_pwm.B",
    "mux.GND",
    "mux.A0",
    "mux.A1",
    "mux.A2",
    "decouple_mux.B",
    "amp.GND",
    "amp.PAD",
    "amp.GAIN",
    "amp_c10u.B",
    "amp_c100n.B",
    "expander.GND",
    "expander.A0",
    "expander.A1",
    "expander.A2",
    "decouple_exp.B",
    "exp_header.GND",
    "servo_pan.GND",
    "servo_tilt.GND",
    "ranger_front.GND",
    "ranger_rear.GND",
    "oled.GND",
    "buzzer.-",
    "ldo.GND",
    "bulk_pwm.-",
    "bulk_motor.-",
    "bulk_amp.-",
    "ldo_in.-",
    "ldo_out.-",
    "uart_tap.GND",
    "tp_power.GND",
    "tp_i2c.GND",
    "gnd_post_amp.GND",
    "gnd_post_ldo.GND",
]

[[outputs]]
from = "motor_driver"
to = ["motor_left", "motor_right"]
pins = ["A01", "A02", "B01", "B02"]
net = "MOT_{pin}"
load_pins.motor_right = { A01 = "1", A02 = "2" }
load_pins.motor_left = { B01 = "1", B02 = "2" }

[[outputs]]
from = "amp"
to = ["speaker"]
pins = ["VO-", "VO+"]
net = "SPK_{pin}"

[[outputs]]
from = "expander"
to = ["exp_header"]
pins = [
    "INTA",
    "INTB",
    "GPA0",
    "GPA1",
    "GPA2",
    "GPA3",
    "GPA4",
    "GPA5",
    "GPA6",
    "GPA7",
    "GPB0",
    "GPB1",
    "GPB2",
    "GPB3",
    "GPB4",
    "GPB5",
    "GPB6",
    "GPB7",
]
net = "EXP_{pin}"

