# --- The head boards and the ribbon ------------------------------------------
# As on the socketed carrier: the XIAO on the head, a 2x7 IDC ribbon to the
# main board's J1. 3V3, D3 and D7 stay open on the head. Three heads, three
# ways of mounting the ribbon header (the socketed carrier's, 2026-10-16):
# head 1 is U1 with J2, the spares U3 with J16 (head 2) and U4 with J17
# (head 3), on nets HEAD2_* and HEAD3_*. Only one is fitted at a time.
[[cables]]
part = "idc-2x07-xiao-cable"
head_ref = "J2"
main_ref = "J1"
head_no_connect = ["3V3", "D3", "D7"]
spare_heads = [
    { mcu_ref = "U3", head_ref = "J16" },
    { mcu_ref = "U4", head_ref = "J17" },
]
build = "carrier"

# --- MCU signals --------------------------------------------------------------

[[nets]]
role = "I2C_SDA_PIN"
to = "mux.SDA"

[[nets]]
role = "I2C_SDA_PIN"
to = "pull_up_sda.B"

[[nets]]
role = "I2C_SDA_PIN"
to = "tp_i2c.SDA"

[[nets]]
role = "I2C_SCL_PIN"
to = "mux.SCL"

[[nets]]
role = "I2C_SCL_PIN"
to = "pull_up_scl.B"

[[nets]]
role = "I2C_SCL_PIN"
to = "tp_i2c.SCL"

[[nets]]
role = "MOTOR_STBY_PIN"
to = "motor_driver.STBY"

[[nets]]
role = "TCA9548A_RST_PIN"
to = "mux.RST"

[[nets]]
role = "TCA9548A_RST_PIN"
to = "pull_rst.B"

[[nets]]
role = "TCA9548A_RST_PIN"
to = "tp_i2c.RST"

[[nets]]
role = "PIEZO_PIN"
to = "piezo_r.A"

[[nets]]
role = "I2S_BCLK_PIN"
to = "amp.BCLK"

[[nets]]
role = "I2S_LRCLK_PIN"
to = "amp.LRC"

[[nets]]
role = "I2S_DIN_PIN"
to = "amp.DIN"

[[nets]]
role = "UART0_TX_PIN"
to = "uart_tap.TX"
note = "ROM boot log, 115200 baud"

[[undrawn]]
role = "MIC_PDM_CLK_PIN"
why = "wired to the PDM microphone on the Sense expansion board, not brought out to a header"

[[undrawn]]
role = "MIC_PDM_DATA_PIN"
why = "wired to the PDM microphone on the Sense expansion board, not brought out to a header"

[[undrawn]]
role = "UART0_RX_PIN"
why = "UART0 RX, spare: the serial console is USB-Serial-JTAG on the USB-C connector, not this pad"

# --- PCA9685 channels ---------------------------------------------------------
# Every channel role in pin_config.h is wired: the LEDs and servos through
# their series resistors, the motor driver directly.

[[channel_nets]]
role = "LED_LEFT_R_CHANNEL"
from = "pwm"
to = "res_led_l_r.A"

[[channel_nets]]
role = "LED_LEFT_G_CHANNEL"
from = "pwm"
to = "res_led_l_g.A"

[[channel_nets]]
role = "LED_LEFT_B_CHANNEL"
from = "pwm"
to = "res_led_l_b.A"

[[channel_nets]]
role = "LED_RIGHT_R_CHANNEL"
from = "pwm"
to = "res_led_r_r.A"

[[channel_nets]]
role = "LED_RIGHT_G_CHANNEL"
from = "pwm"
to = "res_led_r_g.A"

[[channel_nets]]
role = "LED_RIGHT_B_CHANNEL"
from = "pwm"
to = "res_led_r_b.A"

[[channel_nets]]
role = "SERVO_PAN_CHANNEL"
from = "pwm"
to = "res_servo_pan.A"

[[channel_nets]]
role = "SERVO_TILT_CHANNEL"
from = "pwm"
to = "res_servo_tilt.A"

[[channel_nets]]
role = "MOTOR_RIGHT_PWM_CHANNEL"
from = "pwm"
to = "motor_driver.PWMA"

[[channel_nets]]
role = "MOTOR_RIGHT_IN2_CHANNEL"
from = "pwm"
to = "motor_driver.AIN2"

[[channel_nets]]
role = "MOTOR_RIGHT_IN1_CHANNEL"
from = "pwm"
to = "motor_driver.AIN1"

[[channel_nets]]
role = "MOTOR_LEFT_IN1_CHANNEL"
from = "pwm"
to = "motor_driver.BIN1"

[[channel_nets]]
role = "MOTOR_LEFT_IN2_CHANNEL"
from = "pwm"
to = "motor_driver.BIN2"

[[channel_nets]]
role = "MOTOR_LEFT_PWM_CHANNEL"
from = "pwm"
to = "motor_driver.PWMB"

# --- TCA9548A channels --------------------------------------------------------
[[bus_nets]]
role = "I2C_BUS_CHANNEL_PCA9685"
from = "mux"
to = "pwm"

[[bus_nets]]
role = "I2C_BUS_CHANNEL_PCA9685"
from = "mux"
to = "pull_ch0_sda.B"
line = "SDA"

[[bus_nets]]
role = "I2C_BUS_CHANNEL_PCA9685"
from = "mux"
to = "pull_ch0_scl.B"
line = "SCL"

[[bus_nets]]
role = "I2C_BUS_CHANNEL_OLED"
from = "mux"
to = "oled"

[[bus_nets]]
role = "I2C_BUS_CHANNEL_OLED"
from = "mux"
to = "pull_ch1_sda.B"
line = "SDA"

[[bus_nets]]
role = "I2C_BUS_CHANNEL_OLED"
from = "mux"
to = "pull_ch1_scl.B"
line = "SCL"

[[bus_nets]]
role = "I2C_BUS_CHANNEL_MCP23017"
from = "mux"
to = "expander"

[[bus_nets]]
role = "I2C_BUS_CHANNEL_MCP23017"
from = "mux"
to = "pull_ch2_sda.B"
