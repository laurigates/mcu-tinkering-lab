# A wall 1 m behind the origin, across the near end of the floor it stands on,
# and nothing ahead: wall-1m.yaml turned around. Units are centimetres; heading
# 0 points along +x (robocar_sim.arena owns the schema, ADR-036 section 2).
# Scenarios start the robot at the origin facing away from the wall.
floor:
  - [-100, -60]
  - [50, -60]
  - [50, 60]
  - [-100, 60]
walls:
  - {from: [-100, -60], to: [-100, 60]}
