# US-D3: he does not back into something behind him. A rear reading below
# STOP_THRESHOLD_CM (15 cm) brakes a reverse and holds it for as long as the
# obstacle is there; the rear sensor never trips the obstacle reflex (#1026,
# wheels_held_by_rangers() and rangers_rear_blocked() in reactive_controller.c).
#
# Read cycle and waking are as in us-d1-front-reflex-brakes: both rangefinders
# are triggered on tick 0 and every 165 ms after, each read 132 ms after its
# trigger; the console line at 5 s wakes the planner for the 15 s tick.
#
# The reply is a drive at heading 180, which the executor runs in reverse
# (drive_reverses(): past +-90 a drive goal backs up, issue #1025), 60 % =
# duty 2457 after the 300 ms ramp (16.005 s .. 16.170 s). 100 cm at 60 %
# outlasts the 3 s time bound (motion_bound_core.h, #1057), so each reverse
# goal runs 3 s from the first tick that read it: 16.005 s to the tick at
# 19.008 s, and 31.020 s to the tick at 34.023 s.
#
# Rear obstacle: 8 cm behind from 17 s. The rear trigger at 17.160 s
# (104 x 165) ranges it and the read at 17.292 s brakes the reverse on that
# tick: the rear reading is used unsmoothed. When the bound ends the goal at
# 19.008 s nothing asks to move, so the wheels coast. The planner asks again at
# 30 s (the goal still moves the wheels) and writes the same reverse at 31 s;
# with the obstacle still there it is braked from its first tick.
#
# Release: clear behind from 32 s. The trigger at 32.010 s (194 x 165) ranges
# 120 cm, the read at 32.142 s releases the hold, and the goal written at 31 s
# ramps the reverse up again: 546 at 32.142 s, 2457 at 32.307 s, until its
# bound ends it at 34.023 s.
#
# The front reflex is not involved: reflex_trips stays 0, so the `note` tool is
# never offered.
id: us-d3-rear-holds-reverse
stories: [US-D3]
seed: 7
duration: 44s
world:
  - {at: 0s, link: {wifi: true, key: true}}
  - {at: 0s, frame: {scene: hallway}}
  - {at: 5s, console: status}
  - {at: 0s, range: 120}
  - {at: 0s, range: {cm: 120, sensor: rear}}
  - {at: 17s, range: {cm: 8, sensor: rear}}
  - {at: 32s, range: {cm: 120, sensor: rear}}
models:
  planner: inline
default:
  status: 200
  latency: 1s
  call: drive
  args: {heading_deg: 180, distance_cm: 100, speed_pct: 60}
expect:
  - requests: {count: 2}
  - goals: {sequence: [drive, drive]}
  # Backing up at 60 % before the obstacle.
  - wheels: {left: reverse, right: reverse, left_duty: 546, between: [16.005s, 16.005s], count: 1}
  - wheels_at: {at: "range[2]", left: reverse, right: reverse, left_duty: 2457, right_duty: 2457}
  - wheels: {left: forward, count: 0}
  # Braked at the first read of a trigger that ranged the obstacle, at most
  # 297 ms after it appears (REACTIVE_REFLEX_WORST_CASE_MS, the same pacing).
  - wheels: {left: brake, right: brake, after: "range[2]", within: 297ms, count: 1}
  - wheels_at: {at: 17.292s, left: brake, right: brake, left_duty: 0, right_duty: 0}
  # Held until the bound ends the first goal, then coasting.
  - wheels: {left: reverse, between: [17.292s, 32.141s], count: 0}
  - wheels_at: {at: 19.007s, left: brake, right: brake}
  - wheels_at: {at: 19.008s, left: coast, right: coast}
  # The second reverse goal (31 s) is braked while the rear is blocked.
  - wheels_at: {at: 31.020s, left: brake, right: brake}
  - wheels_at: {at: 32.141s, left: brake, right: brake}
  # Released on the first clear rear reading.
  - wheels: {left: reverse, right: reverse, after: "range[3]", within: 297ms, min: 1}
  - wheels: {left: reverse, right: reverse, left_duty: 546, between: [32.142s, 32.142s], count: 1}
  - wheels_at: {at: 32.307s, left: reverse, right: reverse, left_duty: 2457, right_duty: 2457}
  - wheels_at: {at: 34.023s, left: coast, right: coast}
  - wheels: {left: brake, count: 2}
  # Not the obstacle reflex: nothing for the planner to note.
  - note_offered: {count: 0}
