# US-D1: one failed front read does not release the obstacle reflex (#1185).
# A failed read stays out of the running mean and leaves the latest reading as
# it was (rangers_tick() in reactive_controller.c), so with an obstacle 8 cm
# ahead the wheels stay braked under a fresh drive goal.
#
# The timeline is us-d1-front-reflex-brakes' up to the brake: a forward drive
# at 60 % written at 16 s, 8 cm ahead from 17.326 s, braked at 17.622 s, all
# inside the drive's 3 s time bound (#1057), which ends it at 19.008 s.
#
# Failure: `range_fail` on the front sensor at 18.48 s, the instant of the
# trigger (112 x 165), so the read at 18.612 s fails. The obstacle reads again
# from 18.645 s, the next trigger. Before #1185 the failed read entered the
# filter as 400 cm: the latest reading read 400 and the mean (8 + 8 + 400) / 3
# = 138, the reflex released, and the drive ramped up from 546 at 18.612 s
# until the brake at 18.777 s, 165 ms of drive toward the obstacle.
id: us-d1-failed-read-keeps-reflex
stories: [US-D1]
seed: 7
duration: 24s
world:
  - {at: 0s, link: {wifi: true, key: true}}
  - {at: 0s, frame: {scene: hallway}}
  - {at: 5s, console: status}
  - {at: 0s, range: 120}
  - {at: 17.326s, range: 8}
  - {at: 18.48s, range_fail: {}}
  - {at: 18.645s, range: 8}
models:
  planner: inline
default:
  status: 200
  latency: 1s
  call: drive
  args: {heading_deg: 0, distance_cm: 100, speed_pct: 60}
expect:
  - requests: {count: 1}
  - wheels_at: {at: 17.326s, left: forward, right: forward, left_duty: 2457, right_duty: 2457}
  - wheels: {left: brake, right: brake, after: "range[1]", within: 297ms, count: 1}
  # Held through the failed read and to the end of the run.
  - wheels: {left: forward, between: [17.622s, 24s], count: 0}
  - wheels_at: {at: 18.612s, left: brake, right: brake}
  - wheels_at: {at: 18.9s, left: brake, right: brake}
  - wheels: {left: brake, count: 1}
