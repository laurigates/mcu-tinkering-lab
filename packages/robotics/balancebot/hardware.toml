# Parts and nets around src/pin_config.h — the third layer of ADR-021's
# board × header × parts join (docs/decisions/ADR-021-hardware-source-of-truth.md).
#
# No pin numbers live here. Every `role` is a macro name in src/pin_config.h,
# and tools/hardware/ fails if one does not resolve, so this file cannot
# silently disagree with the firmware about WHICH pin — only about which part a
# pin is wired to, which is the fact the header cannot express.
#
# Two builds read this file. Entries with no `build` key are in both.
#   build = "harness"  only the hand-wired harness
#   build = "carrier"  only the carrier PCB (hardware/carrier/, issue #750)
# The docs generators — WIRING.md, pin_defs.typ, the pinouts and the docs
# schematic — read the harness view, `join()`'s default.
#
# Regenerate everything that reads it — docs/auto/pin_defs.typ, the XIAO pinout
# image and the marked tables and power diagram in WIRING.md — with
# `just hardware::gen`; `just hardware::check` fails if any of them is stale.

[source]
convention = "balancebot"
# Every header named here must also be on both trigger-path blocks of
# .github/workflows/build-guide-check.yml — see
# .claude/rules/build-guide-drift-guard.md §1.
header = "src/pin_config.h"
board = "docs/reference/boards/xiao-rp2350.md"
mcu = "XIAO RP2350"
# The XIAO on the carrier: a parts-registry entry and its reference designator.
part = "seeed-xiao-rp2350-socket"
ref = "U1"

# No part carries a `board` key: there is no vendor-sourced layout page for the
# GY-521 or the DRV8825 carrier under docs/reference/boards/, so only the XIAO
# is drawn. Their pin names below are the carriers' silkscreen names, as
# WIRING.md uses them. `part` names the parts-registry entry that maps those
# names to KiCad symbol pins (#750); `ref`, `value` and `lcsc` are the carrier
# PCB's reference designator, value text and JLCPCB part number.

[parts.imu]
name = "GY-521 MPU6050"
kind = "imu"
note = "I2C 0x68"
part = "gy-521"
ref = "J3"

[parts.drv_left]
name = "Left DRV8825"
kind = "stepper-driver"
part = "pololu-drv8825"
ref = "A1"
value = "DRV8825 left"

[parts.drv_right]
name = "Right DRV8825"
kind = "stepper-driver"
part = "pololu-drv8825"
ref = "A2"
value = "DRV8825 right"

[parts.pullup]
name = "10 kΩ resistor"
kind = "resistor"
note = "nENABLE pull-up"
part = "r0805"
ref = "R1"
value = "10k"
lcsc = "C17414"
buy = "aliexpress:32901883276"  # 10K variant

[[nets]]
role = "PIN_IMU_SDA"
to = "imu.SDA"
note = "I2C1 SDA"

[[nets]]
role = "PIN_IMU_SCL"
to = "imu.SCL"
note = "I2C1 SCL"

[[nets]]
role = "PIN_IMU_INT"
to = "imu.INT"
note = "Data-ready, active high, push-pull; no internal pull (RP2350-E9)"

[[nets]]
role = "PIN_STEP_LEFT"
to = "drv_left.STEP"
note = "PIO0 SM0"

[[nets]]
role = "PIN_DIR_LEFT"
to = "drv_left.DIR"

[[nets]]
role = "PIN_STEP_RIGHT"
to = "drv_right.STEP"
note = "PIO0 SM1"

[[nets]]
role = "PIN_DIR_RIGHT"
to = "drv_right.DIR"

# One GPIO, two drivers and the pull-up: a fan-out of the same role.
[[nets]]
role = "PIN_MOTOR_NENABLE"
to = "drv_left.nENABLE"
note = "Active low, shared by both drivers"

[[nets]]
role = "PIN_MOTOR_NENABLE"
to = "drv_right.nENABLE"

[[nets]]
role = "PIN_MOTOR_NENABLE"
to = "pullup.B"
note = "the pull-up holds the drivers disabled while the XIAO boots, resets or sits in BOOTSEL"

# The carrier's pack-voltage divider into D0. Firmware does not read it yet (#747).
[[nets]]
role = "PIN_PACK_SENSE"
to = "sense_top.B"
build = "carrier"
note = "100 kΩ from VBAT"

[[nets]]
role = "PIN_PACK_SENSE"
to = "sense_bottom.A"
build = "carrier"
note = "22 kΩ to GND: 12.6 V (3S) reads 2.27 V, 16.8 V (4S) 3.03 V"

[[nets]]
role = "PIN_PACK_SENSE"
to = "sense_filter.A"
build = "carrier"

[[undrawn]]
role = "PIN_PACK_SENSE"
why = "only the carrier PCB has the pack divider (R2/R3/C3); the hand-wired harness leaves D0 free"
build = "harness"

# The carrier's expansion header J6 (rev3): XIAO D1 and D2, each through a
# 1 kOhm series resistor at the XIAO, for a cable to an ESP-NOW companion XIAO
# (#960), a servo's PWM or an ADC input.
[[nets]]
role = "PIN_EXP_D1"
to = "exp_r_d1.A"
build = "carrier"
note = "1 kΩ in series to J6 pin 4; UART1 RX"

[[nets]]
role = "PIN_EXP_D2"
to = "exp_r_d2.A"
build = "carrier"
note = "1 kΩ in series to J6 pin 3; UART0 TX"

[[undrawn]]
role = "PIN_EXP_D1"
why = "only the carrier PCB has the expansion header (J6); the hand-wired harness leaves D1 free"
build = "harness"

[[undrawn]]
role = "PIN_EXP_D2"
why = "only the carrier PCB has the expansion header (J6); the hand-wired harness leaves D2 free"
build = "harness"

# The carrier's Qwiic-order I2C tap J7 (rev3) on the MPU6050's bus. Core 1 owns
# I2C1 at 400 kHz; the tap adds no pull-ups (the GY-521 carries its own).
[[nets]]
role = "PIN_IMU_SDA"
to = "qwiic.SDA"
build = "carrier"

[[nets]]
role = "PIN_IMU_SCL"
to = "qwiic.SCL"
build = "carrier"

[[undrawn]]
role = "PIN_STATUS_LED"
why = "the XIAO's onboard user LED, not brought out to a header"

[[undrawn]]
role = "PIN_BATT_ADC"
why = "the XIAO's onboard battery-sense divider, not brought out to a header"

[[undrawn]]
role = "PIN_BATT_ADC_ENABLE"
why = "switches the XIAO's onboard battery-sense divider, not brought out to a header"

# --- Power --------------------------------------------------------------------
# The supply side of the join, emitted as WIRING.md's power diagram. Voltages
# beyond the rail names, the 100 µF bulk capacitors and the common ground stay
# in WIRING.md's prose. docs/schematics/circuits/balancebot.py tags its power pins from these.
# The carrier PCB adds its own: the bulk capacitors and the divider on VBAT, the
# B5819W that splits 5V into BUCK_5V and XIAO_5V, and GND.

[parts.pack]
name = "3S 18650 pack + BMS"
kind = "battery"
note = "9.0–12.6 V"
part = "battery-jst-xh2"
ref = "J1"
value = "JST-XH pack in"

[parts.buck]
name = "LM2596 5 V buck"
kind = "buck-regulator"
part = "lm2596-buck-module"
ref = "J2"
value = "LM2596 module"

[parts.stepper_left]
name = "Left NEMA17"
kind = "stepper"
part = "nema17-stepper"
ref = "J4"
value = "Motor left"

[parts.stepper_right]
name = "Right NEMA17"
kind = "stepper"
part = "nema17-stepper"
ref = "J5"
value = "Motor right"

# Pack input protection, carrier only: J1's BAT+ through F1 and Q1 to VBAT.
#
# F1, a 3 A hold PTC, limits a short anywhere on VBAT (the drivers' VMOT, the
# buck lead, the divider) to the pack's fault current for its trip time.
# BSMD1812-300-24V (C7500481), BHFUSE datasheet: Ihold 3.00 A, Itrip 6.00 A at
# 25 C, Vmax 24 V, Imax 40 A, R1max 0.060 ohm; Ihold derates to 2.55 A at 40 C.
# The 16 V part in the same family (C883162, the integrated robocar carrier's)
# leaves 3.4 V over a full 3S pack's 12.6 V; the 24 V one leaves 11.4 V, for the
# overshoot of hot-plugging a pack into 200 uF of bulk capacitance, and fits the
# same 1812 pads. That overshoot can exceed Q1's +-20 V VGSS, so D2 clamps Q1's
# gate (below).
#
# Q1, a P-MOSFET high-side switch: drain to F1 (the pack side), source to VBAT,
# gate to GND through R4. Plugged in the right way the body diode conducts
# first, the gate sits 12.6 V below the source and the channel turns on;
# reversed, the gate is above the source and the body diode is reverse-biased,
# so nothing on the board sees the reversed pack. ZXMP4A16G (C141324), Diodes
# DS33584 Rev. 6-2: VDSS -40 V, VGSS +-20 V, RDS(on) max 60 mohm at VGS -10 V
# and ID -3.8 A, ID -4.6 A continuous on 25 x 25 mm of 1 oz copper (RthJA
# 62.5 C/W, note 6), VGS(th) -1.0 V min. At the PTC's 3 A hold it dissipates
# at most 0.54 W (60 mohm, 25 C), about a 34 C rise at the datasheet's RthJA;
# the carrier's copper around the SOT-223 is smaller than its 25 x 25 mm test
# board, so the rise will be higher. The robot's real pack current is not
# measured yet (#747).
#
# D2, a gate-source zener: cathode to Q1's source (VBAT), anode to the gate
# (PFET_GATE), so R4 limits its current. A steady 3S pack puts |VGS| at the
# pack voltage, at most 12.6 V, but the hot-plug overshoot F1 is rated for
# lands on the source while R4 holds the gate at GND, and above 20 V that
# exceeds VGSS. BZT52C15 (C2104), JSCJ datasheet Rev. 2.1 page 2: VZ 13.8-15.6 V
# at IZT 5 mA, ZZT 30 ohm, IR 0.1 uA at VR 10.5 V, temperature coefficient
# 9.2-13 mV/C. Its 13.8 V minimum sits above a full 3S pack, so on 3S it does
# not conduct and |VGS| follows the pack: 9.0-12.6 V over the BMS's range,
# and 8.2 V at the DRV8825's minimum supply (TI SLVSA73F, section 1), past the
# -4.5 V that DS33584's 100 mohm RDS(on) maximum is given at and near the
# -10 V of its 60 mohm one. On a full 4S pack (16.8 V, which the divider
# reads since rev3) it does conduct: 0.12-0.3 mA through R4 over its VZ
# spread, 4 mW at most, holding |VGS| at 13.8-15.6 V, still under VGSS. It
# conducts whenever a 4S pack is above about 13.8 V, so over most of a
# discharge; VZ sits a little below its 5 mA figure at these currents.
# In an overshoot it clamps |VGS| to 15.6 V at 5 mA
# (R4 passes 0.8 mA at a 24 V spike), about 16.9 V at a 125 C junction: at
# least 3 V under VGSS. A 12 V part (VZ 11.4-12.7 V) would conduct on a full
# 3S pack.
#
# Power-stage checklist (.claude/rules/power-stage-checklist.md) for this
# input stage: 1-2 (dropout, low-battery cutoff) and 4-7 belong to the LM2596
# module, off the board; 3 (input protection) is F1 and Q1 above; 8 (layout)
# is the fixed 1.5 mm PACK_IN and PACK_FUSED tracks in board.toml.
[parts.fuse_in]
name = "3 A hold PTC fuse, pack input"
kind = "fuse"
build = "carrier"
part = "polyfuse-1812"
ref = "F1"
value = "3A hold 24V"
lcsc = "C7500481"

[parts.rp_fet]
name = "ZXMP4A16G reverse-polarity P-MOSFET"
kind = "mosfet"
build = "carrier"
part = "zxmp4a16g"
ref = "Q1"

[parts.rp_gate]
name = "10 kΩ gate resistor to GND"
kind = "resistor"
build = "carrier"
part = "r0805"
ref = "R4"
value = "10k"
lcsc = "C17414"
buy = "aliexpress:32901883276"  # 10K variant

[parts.rp_zener]
name = "BZT52C15 gate-source zener for Q1"
kind = "diode"
build = "carrier"
part = "bzt52c15"
ref = "D2"

[parts.bulk_left]
name = "100 µF 35 V bulk capacitor, left driver"
kind = "capacitor"
build = "carrier"
part = "cp-elec-6.3x7.7"
ref = "C1"
value = "100uF 35V"
lcsc = "C2836437"
buy = "aliexpress:1005012777654645"  # 100UF 35V 6.3x7.7 variant

[parts.bulk_right]
name = "100 µF 35 V bulk capacitor, right driver"
kind = "capacitor"
build = "carrier"
part = "cp-elec-6.3x7.7"
ref = "C2"
value = "100uF 35V"
lcsc = "C2836437"
buy = "aliexpress:1005012777654645"  # 100UF 35V 6.3x7.7 variant

[parts.buck_diode]
name = "B5819W Schottky, buck to XIAO 5V"
kind = "diode"
build = "carrier"
part = "b5819w"
ref = "D1"

[parts.sense_top]
name = "100 kΩ pack divider, top"
kind = "resistor"
build = "carrier"
part = "r0805"
ref = "R2"
value = "100k"
lcsc = "C149504"
buy = "aliexpress:32901883276"  # 100K variant

# 22 kOhm (rev3; 27 kOhm before) so D0 reads a 4S pack: ratio 22/122 = 0.1803,
# 16.8 V (full 4S) reads 3.03 V and 12.6 V (full 3S) 2.27 V, under the
# RP2350 ADC's 3.3 V reference either way. JLC Basic. AliExpress listing
# 32901883276's variants were not checked for 22K, so no `buy`.
[parts.sense_bottom]
name = "22 kΩ pack divider, bottom"
kind = "resistor"
build = "carrier"
part = "r0805"
ref = "R3"
value = "22k"
lcsc = "C17560"

[parts.sense_filter]
name = "100 nF pack divider filter"
kind = "capacitor"
build = "carrier"
part = "c0805"
ref = "C3"
value = "100nF"
lcsc = "C49678"
buy = "owned:0805 100 nF 50 V X7R, 100 pcs (AliExpress 2026-09)"

[parts.hole_1]
name = "M3 mounting hole"
kind = "mounting-hole"
build = "carrier"
part = "m3-mounting-hole"
ref = "H1"

[parts.hole_2]
name = "M3 mounting hole"
kind = "mounting-hole"
build = "carrier"
part = "m3-mounting-hole"
ref = "H2"

[parts.hole_3]
name = "M3 mounting hole"
kind = "mounting-hole"
build = "carrier"
part = "m3-mounting-hole"
ref = "H3"

[parts.hole_4]
name = "M3 mounting hole"
kind = "mounting-hole"
build = "carrier"
part = "m3-mounting-hole"
ref = "H4"

# --- rev3 headers and links (Lauri, 2026-11-06) -------------------------------
# J6: expansion header, 5V (EXP_5V: XIAO_5V through D3), GND, D2, D1. R5 and
# R6, 1 kOhm at the
# XIAO's pins, limit the current if the cable's far end drives the same line
# or the lead goes on one pin over. JLC Basic (C17513); AliExpress listing
# 32901883276's variants were not checked for 1K, so no `buy`.
[parts.exp]
name = "Expansion header, 5V GND D2 D1"
kind = "connector"
build = "carrier"
part = "exp-header-1x4"
ref = "J6"

# D3 (rev3, Lauri 2026-11-06): a B5819W in series with J6's 5V pin, anode on
# XIAO_5V and cathode on EXP_5V, so a companion board powered from its own USB
# or supply cannot back-feed this board's XIAO_5V (and through it the XIAO's
# 5V pad). The companion gets XIAO_5V minus one Schottky drop (about 0.3 V),
# so about 4.4-4.7 V with the buck at 5.0-5.3 V, and shares D1's 1 A budget.
# Same part as D1 (LCSC C8598, JLC Basic).
[parts.exp_diode]
name = "B5819W Schottky, XIAO 5V to the expansion header"
kind = "diode"
build = "carrier"
part = "b5819w"
ref = "D3"

[parts.exp_r_d1]
name = "1 kΩ series resistor, D1 to J6"
kind = "resistor"
build = "carrier"
part = "r0805"
ref = "R5"
value = "1k"
lcsc = "C17513"

[parts.exp_r_d2]
name = "1 kΩ series resistor, D2 to J6"
kind = "resistor"
build = "carrier"
part = "r0805"
ref = "R6"
value = "1k"
lcsc = "C17513"

# R7 and R8: an 0805 pad pair from each driver socket's pin 2 to 3V3, left
# open. Pin 2 is FAULT on a DRV8825 carrier, VDD on an A4988 and VIO on some
# TMC2209 carriers; bridging it (a 0 ohm 0805 or a wire offcut) powers such a
# driver's logic. No LCSC number, so JLCPCB never fits it. Bridge it only for an
# A4988, or a TMC2209 whose pin 2 is VIO, and only if the DRV8825 carriers that
# may also go in the socket have the 1.5 kOhm series resistor on FAULT
# (Pololu's does; check a clone): with it bridged, a DRV8825 reporting a fault
# pulls 3V3 through that resistor. See hardware/carrier/README.md.
[parts.vio_left]
name = "VIO link, left driver pin 2 to 3V3 (open)"
kind = "resistor"
build = "carrier"
part = "r0805"
ref = "R7"
value = "VIO link"
buy = "owned:fitted by hand when needed: a 0 ohm 0805 or a wire offcut across the pads"

[parts.vio_right]
name = "VIO link, right driver pin 2 to 3V3 (open)"
kind = "resistor"
build = "carrier"
part = "r0805"
ref = "R8"
value = "VIO link"
buy = "owned:fitted by hand when needed: a 0 ohm 0805 or a wire offcut across the pads"

# J7: Qwiic-order I2C tap on the IMU bus (see the PIN_IMU_SDA/SCL nets above).
[parts.qwiic]
name = "Qwiic-order I2C tap"
kind = "connector"
build = "carrier"
part = "testpoint-qwiic-1x4"
ref = "J7"

# J8: supply test header, 3V3, GND, 5V (BUCK_5V, the buck's output before D1),
# GND, VBAT (Lauri, 2026-11-06); every rail has only GND beside it. J9: a
# ground post for a scope probe's clip.
[parts.test]
name = "Supply test header, 3V3 GND 5V GND VBAT"
kind = "connector"
build = "carrier"
part = "testpoint-power-1x5"
ref = "J8"

[parts.gnd_post]
name = "Ground post"
kind = "connector"
build = "carrier"
part = "gnd-post-1x2"
ref = "J9"

# Motor power straight from the pack; never from the XIAO's battery pads.
# The harness wires the pack to VBAT; the carrier puts F1 and Q1 between them.
[[rails]]
name = "VBAT"
build = "harness"
from = "pack.BAT+"
to = ["buck.IN+", "drv_left.VMOT", "drv_right.VMOT"]

[[rails]]
name = "PACK_IN"
build = "carrier"
from = "pack.BAT+"
to = ["fuse_in.1"]

[[rails]]
name = "PACK_FUSED"
build = "carrier"
from = "fuse_in.2"
to = ["rp_fet.D"]

[[rails]]
name = "VBAT"
build = "carrier"
from = "rp_fet.S"
to = ["buck.IN+", "drv_left.VMOT", "drv_right.VMOT"]

[[rails]]
name = "PFET_GATE"
build = "carrier"
from = "rp_fet.G"
to = ["rp_gate.A", "rp_zener.A"]

# A continuation: same name, no `from` — these loads join the VBAT rail above.
[[rails]]
name = "VBAT"
build = "carrier"
to = ["bulk_left.+", "bulk_right.+", "sense_top.A", "rp_zener.K", "test.VBAT"]

[[rails]]
name = "5V"
build = "harness"
from = "buck.OUT+"
to = ["mcu.5V"]

# On the carrier a B5819W sits between the buck and the XIAO 5V pad, so a
# USB-powered XIAO cannot back-feed the buck.
[[rails]]
name = "BUCK_5V"
build = "carrier"
from = "buck.OUT+"
to = ["buck_diode.A", "test.5V"]

[[rails]]
name = "XIAO_5V"
build = "carrier"
from = "buck_diode.K"
to = ["mcu.5V", "exp_diode.A"]

# J6's 5V pin, behind D3, so nothing on the expansion cable can back-feed XIAO_5V.
[[rails]]
name = "EXP_5V"
build = "carrier"
from = "exp_diode.K"
to = ["exp.5V"]

# The expansion header's signal side of R5 and R6.
[[rails]]
name = "EXP_D1"
build = "carrier"
from = "exp_r_d1.B"
to = ["exp.D1"]

[[rails]]
name = "EXP_D2"
build = "carrier"
from = "exp_r_d2.B"
to = ["exp.D2"]

# Each driver socket's pin 2 to its VIO link's other pad (R7, R8); the link's
# 3V3 pad is on the 3V3 continuation below.
[[rails]]
name = "VIO_L"
build = "carrier"
from = "drv_left.FAULT"
to = ["vio_left.A"]

[[rails]]
name = "VIO_R"
build = "carrier"
from = "drv_right.FAULT"
to = ["vio_right.A"]

# nSLEEP and nRESET are tied high, and M0/M1 strapped high for 1/8 microstep
# (M2 to GND), per WIRING.md § DRV8825 carriers.
[[rails]]
name = "3V3"
from = "mcu.3V3"
to = [
    "imu.VCC",
    "pullup.A",
    "drv_left.nSLEEP",
    "drv_left.nRESET",
    "drv_left.M0",
    "drv_left.M1",
    "drv_right.nSLEEP",
    "drv_right.nRESET",
    "drv_right.M0",
    "drv_right.M1",
]

# A continuation: the carrier's own 3V3 loads (rev3).
[[rails]]
name = "3V3"
build = "carrier"
to = ["vio_left.B", "vio_right.B", "qwiic.3V3", "test.3V3"]

# WIRING.md keeps the harness's common ground in prose; the carrier draws it.
# M2 to GND is the 1/8-microstep strap; AD0 to GND sets the MPU6050 to 0x68.
[[rails]]
name = "GND"
build = "carrier"
from = "pack.BAT-"
to = [
    "buck.IN-",
    "buck.OUT-",
    "mcu.GND",
    "imu.GND",
    "imu.AD0",
    "drv_left.GND",
    "drv_left.M2",
    "drv_right.GND",
    "drv_right.M2",
    "bulk_left.-",
    "bulk_right.-",
    "sense_bottom.B",
    "sense_filter.B",
    "rp_gate.B",
    "exp.GND",
    "qwiic.GND",
    "test.GND",
    "gnd_post.GND",
]

# `pins` wires each named driver pin to the same-named pin on the load, one net
# each, named by `net` with {pin} replaced. Only the carrier reads them; the
# power diagram still draws one edge per load.
[[outputs]]
from = "drv_left"
to = ["stepper_left"]
pins = ["A1", "A2", "B1", "B2"]
net = "MOTL_{pin}"

[[outputs]]
from = "drv_right"
to = ["stepper_right"]
pins = ["A1", "A2", "B1", "B2"]
net = "MOTR_{pin}"

# Carrier net names, where they differ from the role or rail name.
[net_names]
PIN_IMU_SDA = "IMU_SDA"
PIN_IMU_SCL = "IMU_SCL"
PIN_IMU_INT = "IMU_INT"
PIN_STEP_LEFT = "STEP_L"
PIN_DIR_LEFT = "DIR_L"
PIN_STEP_RIGHT = "STEP_R"
PIN_DIR_RIGHT = "DIR_R"
PIN_MOTOR_NENABLE = "NENABLE"
PIN_PACK_SENSE = "PACK_SENSE"
PIN_EXP_D1 = "XIAO_D1"
PIN_EXP_D2 = "XIAO_D2"
3V3 = "+3V3"
