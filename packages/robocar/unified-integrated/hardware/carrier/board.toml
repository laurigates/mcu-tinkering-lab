# Carrier PCB layout for the integrated robocar-unified carrier: everything
# the netlist does not say. Parts, footprints and nets come from
# ../../hardware.toml and the parts registry; this file says where each part
# sits, how wide each net's tracks are, and what goes on the silkscreen.
#
# PROVISIONAL: DO NOT ORDER THIS BOARD. It exists to compare with the socketed
# carrier (../../../unified/hardware/carrier/board.toml), whose layout rules it
# follows: one rectangular PCB holding the main board (x 0-64.5, y 0-76, the
# chassis plate) and the socketed carrier's three head boards (x 64.5-94, each
# the 29.5 mm square for the pan-tilt cradle), split by copper-free saw bands,
# no V-cuts or tabs. The head column is the socketed carrier's, 6 mm to the
# left. The strip below the main board (y 76-100) is waste. The main board is
# 64.5 x 76 mm after sawing; the socketed carrier's is about 70.5 x 100 mm.
#
# Every position is Claude's proposal, checked only by the carrier gates
# (DRC, parity, board check). The tracks are Freerouting's; nobody has
# reviewed them. Regenerate with `just robocar-unified-integrated::carrier-board`
# and check with `::carrier-check` (KiCad 10.0.6; `just kicad::setup`).
#
# Coordinates: millimetres from the outline's top-left corner, x right, y down.
# The top edge is the robot's front.

[project]
name = "robocar-unified-integrated-carrier"
paper = "A2"

[outline]
origin = [100.0, 100.0]
size = [94.0, 100.0]

# The saw bands and the waste below the main board: no copper. KiCad's 0.5 mm
# copper-to-edge clearance as rule areas, since Freerouting ignores it; not
# where J3's courtyard reaches the main board's bottom edge (a rule area also
# refuses footprints; the courtyard ends at y 75.9).
[[keepouts]]
name = "head column cut band, vertical"
rect = [63.0, 0.0, 66.0, 100.0]

[[keepouts]]
name = "head 1 / head 2 cut band"
rect = [66.0, 28.0, 93.5, 35.75]

[[keepouts]]
name = "head 2 / head 3 cut band"
rect = [66.0, 63.25, 93.5, 71.0]

[[keepouts]]
name = "head 3 bottom band"
rect = [66.0, 98.5, 93.5, 100.0]

[[keepouts]]
name = "waste below the main board"
rect = [0.0, 76.0, 63.0, 100.0]

[[keepouts]]
name = "edge clearance, top"
rect = [0.0, 0.0, 94.0, 0.5]

[[keepouts]]
name = "edge clearance, left"
rect = [0.0, 0.0, 0.5, 76.0]

[[keepouts]]
name = "edge clearance, bottom left of J3"
rect = [0.0, 75.5, 8.0, 76.0]

[[keepouts]]
name = "edge clearance, bottom right of J3"
rect = [23.0, 75.5, 63.0, 76.0]

[[keepouts]]
name = "edge clearance, right"
rect = [93.5, 0.0, 94.0, 100.0]

