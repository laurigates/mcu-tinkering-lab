# The pack input, XT30 to Q1's drain pad: 1.2 mm, because it carries every amp
# the robot draws (pre-fab layout review, B2: as a 0.25 mm signal track it
# would heat by about 65 C at 2 A and could fuse before F1 trips). It runs
# through the 1.65 mm slot between F1's pad 1 and the XT30's GND pin (a 3.5 mm
# rounded square), so 1.2 mm is the widest track that keeps 0.2 mm from both.
[[tracks]]
name = "pack input"
net = "PACK_IN"
layer = "F.Cu"
width_mm = 1.2
points = [[17.2, 61.0], [16.4, 59.75], [14.4, 59.75], [13.3, 59.2]]

# Q1's source pads tied along their row, then 1.5 mm into F1 (sixth pre-fab
# layout review, N9). One entry per pad pair: the pad under each first point
# leaves Freerouting's netlist, and a keepout over a pad centre would leave
# that pad unroutable (carrier-pcb skill trap 27).
[[tracks]]
name = "Q1 source, pin 3 to 2"
net = "PACK_RP"
layer = "F.Cu"
width_mm = 0.4
points = [[12.675, 56.0], [13.325, 56.0]]

[[tracks]]
name = "Q1 source, pin 2 to 1"
net = "PACK_RP"
layer = "F.Cu"
width_mm = 0.4
points = [[13.325, 56.0], [13.975, 56.0]]

[[tracks]]
name = "Q1 source to F1"
net = "PACK_RP"
layer = "F.Cu"
width_mm = 1.5
points = [[13.975, 56.0], [16.275, 56.0]]

[[tracks]]
name = "Q1 gate to R27"
net = "PFET_GATE"
layer = "F.Cu"
width_mm = 0.3
points = [[12.025, 56.0], [9.6, 56.0]]

# The buck's output node. Each [[tracks]] entry joins the pad under its first
# point to the pad under its last, and the first leaves Freerouting's netlist
# (route_board.py), so the output capacitors chain onto L1's output pad, and
# every 5V load hangs off that node: C13 to C14 to C20 to L1, then the trunk
# from L1 west. Before, the capacitors sat 1.1 mm from L1 with no copper
# between them and Freerouting joined them 75 mm round (pre-fab layout review,
# B1: TI SLVSD90B 7.4.1, rules 2 and 10).
[[tracks]]
name = "C13 to C14"
net = "+5V"
layer = "F.Cu"
width_mm = 1.0
points = [[34.26, 68.2], [34.26, 69.6]]

[[tracks]]
name = "C14 to C20"
net = "+5V"
layer = "F.Cu"
width_mm = 1.0
points = [[34.26, 70.4], [34.26, 71.8]]

[[tracks]]
name = "C20 to L1"
net = "+5V"
layer = "F.Cu"
width_mm = 2.0
points = [[34.0, 72.2], [32.2, 72.2]]

# The 5V trunk, laid down before routing (build_board.py locks it, so
# Freerouting keeps it and routes around it): 1.5 mm on F.Cu, over B.Cu kept
# GND by [[route_keepouts]] below (VBAT crosses under it once, at y 57.0),
# from L1's output pad west under the buck, north past the XT30
# and under the PCA9685, north past C4, then west along the TB6612FNG's VM side
# to C2's + pad, beside C16 and the VM pins. Both ends stop just inside a pad
# edge, not on its centre: route_board.py walls the trunk off from Freerouting
# with DSN keepouts flush with its ends, and a keepout over a pad centre leaves
# that pad unroutable. The last millimetres to C16 and the VM pins, the
# servos, the head cable and the test header are routed 0.45 mm tracks.
[[tracks]]
name = "5V trunk"
net = "+5V"
layer = "F.Cu"
width_mm = 1.5
points = [[27.65, 71.98], [24.6, 71.98], [24.6, 53.69]]

# The feedback divider's top senses 5V at C20, on its own track (TI rule 6),
# east of the input capacitors and away from the switch node. Before, R12 hung
# off the amplifier branch 54 mm from L1 (pre-fab layout review, B1). Its run
# at x 39.6 leaves room east of C10 for VBAT's 1.0/0.5 mm via: at x 38.9
# Freerouting picked a 0.6/0.3 there (second review, S1).
[[tracks]]
name = "5V sense"
net = "+5V"
layer = "F.Cu"
width_mm = 0.25
points = [[34.3, 57.6], [39.6, 57.6], [39.6, 73.4], [34.6, 73.4], [34.3, 72.7]]

# The east 5V branch, 1 mm from the output node: the amplifier's ferrite
# (FB1), the LDO (U2) and its input capacitor C7. Routed, these took 0.45 mm
# tracks through one via shared with every other load (pre-fab layout
# review, M1).
[[tracks]]
name = "5V to C7"
net = "+5V"
layer = "F.Cu"
width_mm = 1.0
points = [[42.5, 70.6], [42.5, 74.5], [34.26, 74.5], [34.26, 72.7]]

[[tracks]]
name = "5V to FB1"
net = "+5V"
layer = "F.Cu"
width_mm = 1.0
points = [[40.4, 54.3], [40.6, 54.8], [40.6, 69.0], [41.7, 70.2]]

[[tracks]]
name = "5V to the LDO"
net = "+5V"
layer = "F.Cu"
width_mm = 1.0
points = [[46.4, 69.3], [43.2, 70.0]]

# The bootstrap capacitor's switch-node end straight down into L1, leaving
# the corner between it, U10's GND pin and L1 free for that pin's own via
# ([fanout] own; pre-fab layout review, M2).
[[tracks]]
name = "C12 to L1"
net = "BUCK_SW"
layer = "F.Cu"
width_mm = 0.8
points = [[27.2, 64.3], [27.2, 66.3], [27.75, 66.9]]

# The TB6612FNG's small-signal GND (pin 18) to C16's GND pad, which has a
# fanout via: with C15 turned, the pin lost its pour contact and reached
# ground through 0.19 mm of routed track (fourth pre-fab layout review, N1).
[[tracks]]
name = "U7 GND pin 18"
net = "GND"
layer = "F.Cu"
width_mm = 0.3
points = [[19.2, 49.32], [20.5, 49.32], [21.2, 49.8]]

# The servos' ground (J21:3, and through the routed J20:3 and C1's GND pad,
# all in one pour piece) to U6's GND pins 1-5, 0.8 mm through the gap R17
# leaves above R18. A second tie from J20:3 to J21:3 walled F.Cu off from x
# 1.7 to 18.5 and +3V3 lost 24 connections. Routed,
# that piece reached the plane only through a 0.25 mm F.Cu track (seventh
# pre-fab layout review, SF2; the sixth review's N1). U6:1's neighbours are
# GND as well, so the track may land on the pin at full width. It starts on
# U6:1 so that pin leaves Freerouting's netlist: ending on it, the track's
# keepout boxed the pin in and GND lost 15 connections (trap 28).
[[tracks]]
name = "servo GND to U6"
net = "GND"
layer = "F.Cu"
width_mm = 0.8
points = [[18.537, 29.775], [18.537, 28.25], [6.3, 28.25]]

# The buck's ground: U10's GND pin to its input capacitor's, under the package
# between the two pin rows, TI's first layout rule (the input loop, VIN pin
# to capacitor to GND pin, as small as it goes). Laid down rather than routed:
# the pin sits between C12, L1 and its own SW pin, and with the trunk walling
# off its usual way west Freerouting abandoned the whole GND net over it.
[[tracks]]
name = "buck GND"
net = "GND"
layer = "F.Cu"
width_mm = 0.4
points = [[29.05, 63.6], [29.05, 63.0], [32.5, 63.0]]

# The MAX98357A's GND pins (3, 11, 15) and GAIN_SLOT (2, strapped to GND for
# 12 dB) each tied straight across to the exposed pad, whose in-pad fanout via
