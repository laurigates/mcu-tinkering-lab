# The 5V trunk, laid down before routing (build_board.py locks it, so
# Freerouting keeps it and routes around it): 1.5 mm on F.Cu, over the solid
# GND of B.Cu, from L1's output pad west under the buck, north past the XT30
# and under the PCA9685, north past C4, then west along the TB6612FNG's VM side
# to C2's + pad, beside C16 and the VM pins. Both ends stop just inside a pad
# edge, not on its centre: route_board.py walls the trunk off from Freerouting
# with DSN keepouts flush with its ends, and a keepout over a pad centre leaves
# that pad unroutable; L1's pad, under the first point, leaves Freerouting's
# netlist, the trunk being its connection. The last millimetres to C16 and
# the VM pins, and 5V everywhere else, are routed 0.45 mm tracks.
[[tracks]]
name = "5V trunk"
net = "+5V"
layer = "F.Cu"
width_mm = 1.5
points = [[27.65, 71.98], [24.6, 71.98], [24.6, 53.69]]

# The buck's ground: U10's GND pin to its input capacitor's, under the package
# between the two pin rows, TI's first layout rule (the input loop, VIN pin
# to capacitor to GND pin, as small as it goes). Laid down rather than routed:
# the pin sits between C12, L1 and its own SW pin, and with the trunk walling
# off its usual way west Freerouting abandoned the whole GND net over it.
[[tracks]]
name = "buck GND"
net = "GND"
layer = "F.Cu"
width_mm = 0.4
points = [[29.05, 63.6], [29.05, 63.0], [32.5, 63.0]]

# The MAX98357A's GND pins (3, 11, 15) and GAIN_SLOT (2, strapped to GND for
# 12 dB) each tied straight across to the exposed pad, whose in-pad fanout via
# takes them to the B.Cu plane: at 0.5 mm pitch there is no room for a via
# beside a pin. Pin 2 must be tied too: the pin 3 track's keepout boxes it in,
# and Freerouting then abandons the whole GND net (carrier-pcb skill trap 28).
[[tracks]]
name = "U8 GAIN_SLOT pin 2"
net = "GND"
layer = "F.Cu"
width_mm = 0.25
points = [[46.8, 48.75], [47.5, 48.75]]

[[tracks]]
name = "U8 GND pin 3"
net = "GND"
layer = "F.Cu"
width_mm = 0.25
points = [[46.8, 49.25], [47.5, 49.25]]

[[tracks]]
name = "U8 GND pin 11"
net = "GND"
layer = "F.Cu"
width_mm = 0.25
points = [[49.2, 48.75], [48.5, 48.75]]

[[tracks]]
name = "U8 GND pin 15"
net = "GND"
layer = "F.Cu"
width_mm = 0.25
points = [[47.75, 47.8], [47.75, 48.5]]

# Freerouting width classes. One width per net, so each class is the widest
# track every pin on its nets accepts: the TPS563201's SOT-23-6 pads (0.6 mm at
# 0.95 mm) take 0.8 mm, the TB6612FNG's SSOP-24 pads (0.4 mm at 0.65 mm) 0.45 mm,
# and the MAX98357A's TQFN pads (0.25 mm at 0.5 mm) the 0.25 mm signal width,
# which is why the amplifier has its own AMP_5V net behind FB1. GND is poured on
# both layers, so its routed tracks only need to reach every pad.
[[net_classes]]
name = "input_power"
nets = ["VBAT", "BUCK_SW"]
track_um = 800
clearance_um = 200
via_um = [1000, 500]

[[net_classes]]
name = "motor_power"
nets = ["+5V", "MOT_*"]
track_um = 450
clearance_um = 200
via_um = [800, 400]

[[net_classes]]
name = "head_power"
nets = ["HEAD*_+5V", "HEAD*_GND"]
track_um = 500
clearance_um = 200
via_um = [800, 400]

[[net_classes]]
name = "logic_power"
nets = ["+3V3"]
track_um = 350
clearance_um = 200
via_um = [600, 300]

[signal]
track_um = 250
clearance_um = 200
via_um = [600, 300]

# GND on both layers of the main board, each head's own ground (HEAD_GND,
# HEAD2_GND, HEAD3_GND) on its head. Each region stops 1 mm short of a cut
# line. There is no 5V pour: on F.Cu it cut GND into islands around every chip
# in the power half (the pre-fab review's B1); the trunk carries 5V instead.
[pour]
layers = ["F.Cu", "B.Cu"]
regions = [
    { net = "GND", rect = [0.0, 0.0, 63.0, 75.0] },
    { net = "HEAD_GND", rect = [66.0, 0.0, 94.0, 28.0] },
    { net = "HEAD2_GND", rect = [66.0, 36.25, 94.0, 63.25] },
    { net = "HEAD3_GND", rect = [66.0, 71.5, 94.0, 98.5] },
]
clearance_mm = 0.3
min_thickness_mm = 0.25
thermal_gap_mm = 0.3
spoke_mm = 0.35

# A via beside every SMD pad of a poured net, added after routing wherever
# there is room: Freerouting adds a via only where a track changes layer, so
# without these an SMD ground pad reaches the B.Cu plane only through whatever
# thin track it was routed with. The MAX98357A's exposed pad takes its via in
# the pad. `required` is every pad on a power path: the buck's input and output
# capacitors and its GND pin and feedback ground, the motor driver's PGND and
# its VM capacitors, the amplifier's supply capacitors, the LDO and its
# capacitors. route_board.py fails if one of those finds no room; a logic
# chip's ground pin or strap without one keeps its routed track.
[fanout]
nets = ["GND", "HEAD_GND", "HEAD2_GND", "HEAD3_GND"]
via_um = [600, 300]
track_um = 400
reach_mm = 2.5
in_pad = ["U8:17"]
required = [
    "U10:1", "C9:2", "C10:2", "C11:2", "C13:2", "C14:2", "C20:2", "C19:2", "R13:2",
    "U7:3", "U7:4", "U7:9", "U7:10", "C16:2", "C2:2", "C1:2",
    "C3:2", "C17:2", "C18:2",
    "U2:1", "C7:2", "C8:2",
]
