[[tracks]]
name = "U8 GND pin 11"
net = "GND"
layer = "F.Cu"
width_mm = 0.25
points = [[49.2, 48.75], [48.5, 48.75]]

[[tracks]]
name = "U8 GND pin 15"
net = "GND"
layer = "F.Cu"
width_mm = 0.25
points = [[47.75, 47.8], [47.75, 48.5]]

# Room for U8's GND pin 3's own via ([fanout] own, S3), west of the pin,
# kept free of Freerouting's tracks: [fanout] runs after routing and takes
# whatever space is left. The square holds the 0.6 mm via plus 0.2 mm
# clearance and stops short of every pad centre.
[[route_keepouts]]
name = "U8:3's via, F.Cu"
layer = "F.Cu"
rect = [45.15, 48.75, 46.1, 49.75]

[[route_keepouts]]
name = "U8:3's via, B.Cu"
layer = "B.Cu"
rect = [45.15, 48.75, 46.1, 49.75]

# U8's exposed-pad via goes in after routing ([fanout] in_pad) and the pad
# leaves Freerouting's netlist, so the router does not know it is there: a
# B.Cu CH1_SDA track ran 0.075 mm from it. Keep B.Cu under the pad clear.
[[route_keepouts]]
name = "under U8's exposed-pad via"
layer = "B.Cu"
rect = [47.2, 48.2, 48.8, 49.8]

# Bind Freerouting only (no rule area: the pour still fills there). B.Cu
# under the feedback divider and FB pin stays clear of other nets, so VBAT's
# bottom-layer run cannot pass under the high-impedance FB node (TI SLVSD90B
# 7.4.1 rule 8; second pre-fab layout review, S4).
[[route_keepouts]]
name = "under the feedback divider"
layer = "B.Cu"
rect = [30.4, 56.3, 35.2, 62.6]

# VBAT reaches the input capacitors only from B.Cu, through a via below C10
# (5V's fixed tracks wall the F.Cu side). Freerouting ran a 0.25 mm GND track
# on B.Cu along y 67.3, under that spot, which left no room to grow its via to
# input_power's 1.0/0.5 mm; this keeps the GND run clear (second pre-fab
# layout review, S1).
# Its bottom edge stops at y 68.65: at 68.8 it was 0.18 mm from an 0.8 mm
# VBAT track at y 69.38, under the 0.2 mm clearance, and Freerouting necked
# that 10.3 mm run under L1 to 0.6 mm (seventh pre-fab layout review, SF1).
[[route_keepouts]]
name = "below VBAT's input via"
layer = "B.Cu"
rect = [36.5, 67.4, 39.4, 68.65]

# Keep Freerouting's tracks out from under the M2 ISO7380 heads (about 3.5 mm
# across) at head 3's holes: HEAD3_MOTOR_STBY ran 0.563 mm from H10's hole and
# HEAD3_UART0_TX 0.640 mm from H9's (sixth pre-fab layout review, N7). A
# 2 mm radius square, router-only: HEAD3_GND's pour still fills there.
[[route_keepouts]]
name = "under H9's screw head, F.Cu"
layer = "F.Cu"
rect = [66.5, 71.55, 70.5, 75.55]

[[route_keepouts]]
name = "under H9's screw head, B.Cu"
layer = "B.Cu"
rect = [66.5, 71.55, 70.5, 75.55]

[[route_keepouts]]
name = "under H10's screw head, F.Cu"
layer = "F.Cu"
rect = [89.0, 71.55, 93.0, 75.55]

[[route_keepouts]]
name = "under H10's screw head, B.Cu"
layer = "B.Cu"
rect = [89.0, 71.55, 93.0, 75.55]

# B.Cu under the 5V trunk's north-south run stays GND, so the trunk's return
# current has the plane under it (sixth pre-fab layout review, S4: a B.Cu VBAT
# track ran under it at x 24.76 from y 55.8 to 69.1). The gap at y 56.4-58.4
# lets VBAT cross under it from F1's output pad, which sits at y 57.2.
[[route_keepouts]]
name = "under the 5V trunk, north of VBAT's crossing"
layer = "B.Cu"
rect = [23.6, 53.0, 25.6, 56.4]

[[route_keepouts]]
name = "under the 5V trunk, south of VBAT's crossing"
layer = "B.Cu"
rect = [23.6, 58.4, 25.6, 73.0]

# Freerouting width classes. One width per net, so each class is the widest
# track every pin on its nets accepts: the TPS563208's SOT-23-6 pads (0.6 mm at
# 0.95 mm) take 0.8 mm, the TB6612FNG's SSOP-24 pads (0.4 mm at 0.65 mm) 0.45 mm,
# and the MAX98357A's TQFN pads (0.25 mm at 0.5 mm) the 0.25 mm signal width,
# which is why the amplifier has its own AMP_5V net behind FB1. GND is poured on
# both layers, so its routed tracks only need to reach every pad.
[[net_classes]]
name = "input_power"
nets = ["PACK_IN", "PACK_RP", "VBAT", "BUCK_SW"]
track_um = 800
clearance_um = 200
via_um = [1000, 500]

# +5V at 0.8 mm with 1.0/0.5 mm vias. At the 0.45 mm the TB6612FNG's pins
# were thought to cap it at, the servo and head feed necked to 0.337 mm and
# shared one path (fourth pre-fab layout review, F1); Freerouting necks the
# last millimetre into a fine-pitch pin instead (0.40 mm at U7's VM pins).
# route_board.py grows any smaller via Freerouting picks to its class's size,
# and DRC checks the fit (second review, S2).
[[net_classes]]
name = "five_volt"
nets = ["+5V", "XIAO_5V"]
track_um = 800
clearance_um = 200
via_um = [1000, 500]

[[net_classes]]
name = "motor_power"
nets = ["MOT_*"]
track_um = 450
clearance_um = 200
via_um = [800, 400]

[[net_classes]]
name = "head_power"
nets = ["HEAD*_XIAO_5V", "HEAD*_GND"]
track_um = 500
clearance_um = 200
via_um = [800, 400]

[[net_classes]]
name = "logic_power"
nets = ["+3V3"]
track_um = 350
clearance_um = 200
via_um = [600, 300]

[signal]
track_um = 250
clearance_um = 200
via_um = [600, 300]

# GND on both layers of the main board, each head's own ground (HEAD_GND,
# HEAD2_GND, HEAD3_GND) on its head. Each region stops 1 mm short of a cut
# line; the main board's stops 1 mm short of the centred mouse-bite slot on
# the vertical line (x 63.5), whose holes it reached within 0.25 mm at 63.0
# (pre-fab layout review, m5); the head regions start 2 mm from that line,
# 1 mm short of the slot's far side (second review, S8). There is no 5V pour: on F.Cu it cut GND into islands around every chip
# in the power half (the pre-fab review's B1); the trunk carries 5V instead.
[pour]
layers = ["F.Cu", "B.Cu"]
regions = [
    { net = "GND", rect = [0.0, 0.0, 62.5, 75.0] },
    { net = "HEAD_GND", rect = [66.5, 0.0, 94.0, 28.0] },
    { net = "HEAD2_GND", rect = [66.5, 36.25, 94.0, 63.25] },
    { net = "HEAD3_GND", rect = [66.5, 71.5, 94.0, 98.5] },
]
clearance_mm = 0.3
min_thickness_mm = 0.25
thermal_gap_mm = 0.3
spoke_mm = 0.35
# A via at each 5 mm grid point where every pour layer's fill holds one, for
# pieces of pour that tracks alone joined to the plane (sixth pre-fab layout
# review, S4 and N1). It joined the 141.7 mm2 piece at J7:4; it cannot join a
# piece enclosed by tracks on both layers, as the servo-ground piece at
# J20:3/J21:3 is (a 2.5 mm grid joined nothing more).
stitch = { pitch_mm = 5.0, via_um = [600, 300] }

# A via beside every SMD pad of a poured net, added after routing wherever
# there is room: Freerouting adds a via only where a track changes layer, so
# without these an SMD ground pad reaches the B.Cu plane only through whatever
# thin track it was routed with. The MAX98357A's exposed pad takes its via in
# the pad. `required` is every pad on a power path: the buck's input and output
# capacitors and its GND pin and feedback ground, the motor driver's PGND and
# its VM capacitors, the amplifier's supply capacitors, the LDO and its
# capacitors. route_board.py fails if one of those finds no room; a logic
# chip's ground pin or strap without one keeps its routed track.
[fanout]
nets = ["GND", "HEAD_GND", "HEAD2_GND", "HEAD3_GND"]
via_um = [600, 300]
track_um = 400
reach_mm = 2.5
in_pad = ["U8:17"]
# U10's GND pin reaches C11's via through its fixed track, which would
# satisfy it; it takes its own beside the pin as well (TI rule 1). U8's GND
# pin 3, tied to the exposed pad, likewise: with only the exposed pad's via,
# that one 0.6/0.3 mm via was the sole plane connection of U8's pins 2, 3, 11,
# 15 and 17 (sixth pre-fab layout review, S3: `carrier-measure cuts GND J3:1`).
# Pin 3's via goes out west-north-west, past pin 2 (GND too) and clear of pin
# 4. A tie from pin 11 east to C17's GND pad was tried first: it boxed in
# SPK_VO- at pin 10 on every route.
own = ["U10:1", "U8:3"]
required = [
    "U10:1", "C9:2", "C10:2", "C11:2", "C13:2", "C14:2", "C20:2", "C19:2", "R13:2",
    "U7:3", "U7:4", "U7:9", "U7:10", "C15:2", "C16:2", "C21:2", "C2:2", "C1:2",
    "C3:2", "C17:2", "C18:2",
    "U2:1", "C7:2", "C8:2",
    "U8:3",
]

# Hand-sawn (mode = "saw", seventh pre-fab layout review): one outline, which
# JLCPCB counts as one design, cut apart along the silkscreen cut lines. Saw on
# each line's waste side and file to the line: HEAD3_I2C_SDA is 0.79 mm from
# the y 70.5 line (README, Panel). The x 64.5 line has no waste strip (main
# board and heads share it), so that one is sawn on the line. The lines below
# are the mouse-bite option:
#
# Mouse-bite panel (#809, tools/kicad/panel.py): each cut line becomes 2 mm
# Edge.Cuts slots, broken by 5 mm tabs of two rows of five 0.6 mm non-plated
# holes at 0.95 mm (JLCPCB's mouse-bite guide), inside the copper-free bands
# above. The slots sit on each line's waste side (the CUT label side), so the
# main board keeps its 76 mm and each head its 29.5 mm height. The vertical line
# between the main board and the heads has board on both sides: its slot is
# centred, so each side loses 1 mm, as a saw kerf took (main board 63.5 mm wide,
# heads 28.5 mm; the band leaves no room to put it all on one side), with a tab at each end and one
# at y 50, the middle of head 2, away from the speaker connector J19 (y 55.5).
# The main board's bottom line gets a tab at each end and one at x 32, clear of
# the XT30 (J3, x 8-23), whose courtyard reaches the line.
[panel]
mode = "saw"

[[panel.lines]]
line = [64.5, 99.5, 64.5, 0.5]
offset_mm = 0.0
tabs = [49.5]
