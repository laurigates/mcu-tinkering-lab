# The robocar-unified carrier with every breakout's chip on the main board
# itself: the integrated variant of ../unified/hardware.toml, kept beside it to
# compare the two approaches (board area, part count, assembly). The firmware,
# the pin header and the head board are robocar-unified's; this file holds no
# pin numbers, and every `role` resolves against ../unified/main/pin_config.h.
#
# What differs from ../unified/hardware.toml's carrier view:
#
# - The five breakout sockets (A1-A5) are bare chips (U5-U9) with the
#   passives each breakout carried that the circuit still needs: decoupling,
#   the mux's upstream pull-ups and reset pull-up, the PCA9685's output series
#   resistors on the servo and LED channels.
# - The MAX98357A takes 5V through a ferrite bead (FB1) as its own net, AMP_5V.
# - The LM2596 module and its lead (J4) are a TPS563208 buck converter (U10)
#   on the board, 3 A like the module, with its inductor, capacitors and
#   feedback divider.
# - The servos, the RGB LEDs and the speaker plug into the board (J19-J23),
#   where the socketed carrier uses the breakouts' own columns and terminal.
# - The same three head boards as the socketed carrier (U1/J2, and the spares
#   U3/J16 and U4/J17 on nets HEAD2_* and HEAD3_*), so both PCBs carry the
#   same set of parts outside the main board.
#
# Every other part keeps its reference and its role: the connectors, test
# headers, bulk capacitors, LDO, pull-ups, buzzer and mounting holes. No entry
# carries `build`, except the cable, so the harness view is this carrier
# without its ribbon. Nothing generates documentation from that view: the
# project has no WIRING.md and no build guide.
#
# Every SMD part has an LCSC number (#808), on its registry entry for the
# chips and the inductor, here for the passives, so JLCPCB can assemble the
# whole front side; only the through-hole connectors, sockets and headers are
# left to solder. Passives are JLCPCB Basic parts where one exists (stock and
# library type checked 2026-10-19); each Extended part costs a loading fee per
# order. Every LCSC number has a checked placement rotation in
# docs/reference/jlcpcb-rotations.toml. Three fiducials (FID1-FID3) mark the
# main board for the pick-and-place camera.

[source]
convention = "robocar"
header = "../unified/main/pin_config.h"
board = "docs/reference/boards/xiao-esp32s3.md"
mcu = "XIAO ESP32-S3 Sense"
part = "seeed-xiao-esp32s3-socket"
ref = "U1"

# --- The breakout chips, on the board ----------------------------------------

# A0-A2 to GND: address 0x70 (TCA9548A_ADDR). RESET is pulled up here (R16),
# as the breakout does, and still driven by the XIAO's D2.
[parts.mux]
name = "TCA9548A"
kind = "i2c-mux"
part = "tca9548a-tssop24"
ref = "U5"

# A0-A5, OE and EXTCLK to GND: address 0x40 (PCA9685_ADDR), outputs always
# enabled, the internal oscillator. The breakout pulls OE low through a
# resistor and A0-A5 low the same way; tied straight to GND here.
[parts.pwm]
name = "PCA9685"
kind = "pwm-driver"
part = "pca9685-tssop28"
ref = "U6"

[parts.motor_driver]
name = "TB6612FNG"
kind = "motor-driver"
part = "tb6612fng-ssop24"
ref = "U7"

# SD_MODE strapped to VDD (left channel) and GAIN_SLOT to GND (12 dB), as on
# the socketed carrier.
[parts.amp]
name = "MAX98357A"
kind = "i2s-amp"
part = "max98357a-tqfn16"
ref = "U8"

# A0-A2 to GND: address 0x20 (MCP23017_ADDR); RESET tied to 3V3.
[parts.expander]
name = "MCP23017"
kind = "gpio-expander"
note = "optional in firmware; always fitted here"
part = "mcp23017-ssop28"
ref = "U9"

# --- 5 V buck converter (replaces the LM2596 module) ------------------------
# TI SLVSD90B Table 7-2 for 5 V: R1 54.9 kΩ over R2 10 kΩ (VFB 0.768 V, so
# 4.98 V). R12 is 56 kΩ instead: 5.07 V typical, 4.94-5.19 V over VFB's
# 749-787 mV, so 5V stays at or above the TB6612FNG's VM >= 5 V operating row
# (1.0 A per channel; 0.4 A below 5 V) after the trunk's drop, and under the
# MAX98357A's 5.5 V. The 5 V and 6.5 V rows share L and Cout (second pre-fab
# layout review, S5). L 3.3-4.7 µH, and 20-68 µF of low-ESR output capacitance (C13,
# C14, C20). The TPS563208, not the TPS563201: the same pins and table, but
# forced-continuous, so it sinks current as well as sourcing it. A motor that
# brakes or reverses pushes energy back into 5V through the TB6612FNG's body
# diodes, and a pulse-skipping converter would leave it to charge the rail.
# D-CAP2's stability rests on the L x Cout double pole, so no large low-ESR
# bulk capacitor sits on 5V: the bulk capacitors there (C1, C2, C3 below) are
# MnO2 tantalums, whose ~1.5 Ω ESR damps rather than moves that pole (it puts
# them in parallel with the ceramics near 18 kHz: bench-check a 0.2-2 A load
# step), and the input side carries the electrolytic bulk (C19).
#
# The buck needs VIN >= VOUT / 0.75 (SLVSD90B 7.2.2.4, the 75 % maximum duty
# cycle): 6.7 V, 3.3 V per cell. Below that 5V sags with the pack. EN goes
# through a divider (R25/R26) so the converter stops drawing from a flat
# pack. EN has its own resistance to GND (REN 600-2400 kΩ, 1500 typical,
# Table 5.5) in parallel with R26, and rises at 1.38-1.47 V typical (Figure
# 5-4, VENH 1.6 V maximum) and falls at 1.05-1.2 V (Figure 5-3). 100 kΩ over
# 36 kΩ turns it on at about 5.5 V typical and is guaranteed on by 6.3 V
# (1.6 V across 36 kΩ || 600 kΩ), under the 6.7 V where the buck regulates;
# 30 kΩ guaranteed it only by 7.2 V, so a part-charged pack might not start
# the robot (pre-fab layout review, m6). It falls at about 4.0-4.6 V: a
# coarse cutoff with no specified falling threshold. The pack's external 2S
# BMS is the undervoltage protection.
# 100 nF bootstrap, as TI requires.
[parts.buck]
name = "TPS563208 buck converter"
kind = "buck-regulator"
part = "tps563208-sot23-6"
ref = "U10"

# 4.7 µH ±20 % (Bourns SRN6045TA-4R7M: DCR 26 mΩ, Irms 4.5 A, Isat 6.8 A):
# the 3.3 µH part is ±30 %, which can fall below Table 7-2's 3.3 µH minimum.
# Peak current at the 5.1 A maximum current limit is about 5.5 A.
[parts.buck_l]
name = "4.7 µH power inductor, buck output"
kind = "inductor"
part = "inductor-srn6045"
ref = "L1"
value = "4.7uH"

[parts.buck_en_top]
name = "100 kΩ EN divider, top (VBAT)"
kind = "resistor"
part = "r0805"
ref = "R25"
value = "100k"
lcsc = "C149504"

[parts.buck_en_bot]
name = "36 kΩ EN divider, bottom"
kind = "resistor"
part = "r0805"
ref = "R26"
value = "36k"
lcsc = "C4360"

# A resettable fuse between the XT30 and everything else: a short on VBAT
# (the 0.8 mm track to the test header, the buck input) otherwise has the
# pack's full fault current behind it. C883162 (BSMD1812-300-16V), the
# socketed carrier's part and its reasoning: 3 A hold, 16 V against a charged
# 2S pack's 8.4 V.
[parts.fuse_in]
name = "3 A hold PTC fuse, pack input"
kind = "fuse"
part = "polyfuse-1812"
ref = "F1"
value = "3A hold 16V"
lcsc = "C883162"

[parts.buck_cin1]
name = "10 µF buck input"
kind = "capacitor"
part = "c0805"
ref = "C9"
value = "10uF 25V"
lcsc = "C15850"

# C11, beside VIN, is a 10 µF: TI asks for over 10 µF of ceramic as the
# decoupling capacitor (SLVSD90B 7.2.2.4), and the 100 nF is optional, so the
# 10 µF takes the tightest loop (second pre-fab layout review, S6).
[parts.buck_cin2]
name = "10 µF buck input, beside VIN"
kind = "capacitor"
part = "c0805"
ref = "C11"
value = "10uF 25V"
lcsc = "C15850"

# The input's bulk capacitor. On VBAT, where it does not touch the buck's loop,
# and an aluminium electrolytic for its ESR: it damps the ringing between the
# battery leads' inductance and the ceramic input capacitors when the XT30 is
# plugged in, which a polymer or MnO2 tantalum would not (and a tantalum takes
# that surge badly). C2836437 (100 µF 35 V, 6.3 x 7.7 mm), the balancebot's
# input capacitor: 35 V costs nothing over 25 V in this case size.
[parts.bulk_in]
name = "100 µF 35 V bulk capacitor, buck input"
kind = "capacitor"
part = "cp-elec-6.3x7.7"
ref = "C19"
value = "100uF 35V"
lcsc = "C2836437"

[parts.buck_cin_hf]
name = "100 nF buck input"
kind = "capacitor"
part = "c0805"
ref = "C10"
value = "100nF"
lcsc = "C49678"

[parts.buck_boot]
name = "100 nF bootstrap, VBST to SW"
kind = "capacitor"
part = "c0805"
ref = "C12"
value = "100nF"
lcsc = "C49678"

[parts.buck_cout1]
name = "22 µF buck output"
kind = "capacitor"
part = "c0805"
ref = "C13"
value = "22uF 25V"
lcsc = "C45783"

[parts.buck_cout2]
name = "22 µF buck output"
kind = "capacitor"
part = "c0805"
ref = "C14"
value = "22uF 25V"
lcsc = "C45783"

# A third 22 µF: an 0805 at 5 V bias keeps roughly half its rating, and two
# alone can fall under Table 7-2's 20 µF minimum. Three stay inside 20-68 µF.
# All three are C45783 (Samsung CL21A226MAQNNNE, 22 µF 25 V X5R), a JLCPCB
# Basic part; its DC-bias curve is unread, so the "about half at 5 V" is the
# 0805 rule of thumb, not this part's figure.
[parts.buck_cout3]
name = "22 µF buck output"
kind = "capacitor"
part = "c0805"
ref = "C20"
value = "22uF 25V"
lcsc = "C45783"

[parts.buck_fb_top]
name = "56 kΩ feedback divider, top"
kind = "resistor"
part = "r0805"
ref = "R12"
value = "56k"
lcsc = "C17756"

[parts.buck_fb_bot]
name = "10 kΩ feedback divider, bottom"
kind = "resistor"
part = "r0805"
ref = "R13"
value = "10k"
lcsc = "C17414"

