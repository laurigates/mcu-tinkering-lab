load_pins.motor_right = { A01 = "1", A02 = "2" }
load_pins.motor_left = { B01 = "1", B02 = "2" }

[[outputs]]
from = "amp"
to = ["speaker"]
pins = ["VO-", "VO+"]
net = "SPK_{pin}"

[[outputs]]
from = "expander"
to = ["exp_header"]
pins = [
    "INTA",
    "INTB",
    "GPA0",
    "GPA1",
    "GPA2",
    "GPA3",
    "GPA4",
    "GPA5",
    "GPA6",
    "GPA7",
    "GPB0",
    "GPB1",
    "GPB2",
    "GPB3",
    "GPB4",
    "GPB5",
    "GPB6",
    "GPB7",
]
