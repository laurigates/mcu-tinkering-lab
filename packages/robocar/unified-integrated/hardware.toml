kind = "mounting-hole"
part = "m2-mounting-hole"
ref = "H10"

# --- The head boards and the ribbon ------------------------------------------
# As on the socketed carrier: the XIAO on the head, a 2x7 IDC ribbon to the
# main board's J1. 3V3, D3 and D7 stay open on the head. Three heads, three
# ways of mounting the ribbon header (the socketed carrier's, 2026-10-16):
# head 1 is U1 with J2, the spares U3 with J16 (head 2) and U4 with J17
# (head 3), on nets HEAD2_* and HEAD3_*. Only one is fitted at a time.
[[cables]]
part = "idc-2x07-xiao-cable"
head_ref = "J2"
main_ref = "J1"
head_no_connect = ["3V3", "D3", "D7"]
spare_heads = [
    { mcu_ref = "U3", head_ref = "J16" },
    { mcu_ref = "U4", head_ref = "J17" },
]
build = "carrier"

