[project]
name = "robocar-live-probe"
version = "0.1.0"
description = "Workstation probe of the Gemini Live API for robocar-unified real-time conversation (issue #619)"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.55",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
