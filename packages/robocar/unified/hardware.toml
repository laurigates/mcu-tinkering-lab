kind = "capacitor"
build = "carrier"
part = "c0805"
ref = "C5"
value = "100nF"
lcsc = "C49678"

# AMS1117 datasheet, Application Hints § Stability: the output capacitor is part
# of the frequency compensation, and 22 µF solid tantalum ensures stability for
# all operating conditions. It names no input value; 22 µF there too.
[parts.ldo_in]
name = "22 µF tantalum, LDO input"
kind = "capacitor"
build = "carrier"
part = "cp-tantalum-3528"
ref = "C7"
value = "22uF 16V"
lcsc = "C8020"

[parts.ldo_out]
name = "22 µF tantalum, LDO output"
kind = "capacitor"
build = "carrier"
part = "cp-tantalum-3528"
ref = "C8"
value = "22uF 16V"
lcsc = "C8020"

# WIRING.md's C6, fitted (pre-fab review N-9): the CJMCU-2317's part beside
# the chip is unverified as a capacitor. The repo has no DNP convention (every
# carrier part is fitted), and a second 100 nF on the 3V3 rail is harmless.
[parts.decouple_exp]
name = "100 nF decoupling, MCP23017 VCC"
kind = "capacitor"
build = "carrier"
part = "c0805"
ref = "C6"
value = "100nF"
lcsc = "C49678"

[parts.piezo_r]
name = "100 Ω piezo series resistor"
kind = "resistor"
build = "carrier"
part = "r0805"
ref = "R1"
value = "100"
lcsc = "C17408"

# The TCA9548A breakout pulls up only its upstream SDA/SCL; every downstream
# channel needs its own pull-ups to the carrier's 3V3 (#750). 2.2 kΩ, not 10 kΩ
# (#810): the bus runs at 400 kHz, where Fast-mode allows a 300 ns rise time,
# and t_r = 0.8473 x R x C_bus (NXP UM10204 § 7.1). 10 kΩ meets that only below
# about 35 pF, which a rangefinder lead alone can exceed; 2.2 kΩ allows about
# 160 pF. The low end is the 3 mA a Fast-mode device must sink at 0.4 V:
# (3.3 - 0.4) V / 3 mA = 970 Ω. With a module's own 10 kΩ in parallel (the
# CJMCU-2317, possibly the OLED) a channel is about 1.8 kΩ, 1.8 mA. C17520 is a
# JLCPCB Basic part (checked 2026-10-18).
[parts.pull_ch0_sda]
name = "2.2 kΩ pull-up, mux channel 0 SDA"
kind = "resistor"
build = "carrier"
part = "r0805"
ref = "R2"
value = "2.2k"
lcsc = "C17520"

[parts.pull_ch0_scl]
name = "2.2 kΩ pull-up, mux channel 0 SCL"
kind = "resistor"
build = "carrier"
part = "r0805"
ref = "R3"
value = "2.2k"
lcsc = "C17520"

[parts.pull_ch1_sda]
name = "2.2 kΩ pull-up, mux channel 1 SDA"
kind = "resistor"
build = "carrier"
part = "r0805"
ref = "R4"
value = "2.2k"
lcsc = "C17520"

[parts.pull_ch1_scl]
name = "2.2 kΩ pull-up, mux channel 1 SCL"
kind = "resistor"
build = "carrier"
part = "r0805"
ref = "R5"
value = "2.2k"
lcsc = "C17520"

[parts.pull_ch2_sda]
name = "2.2 kΩ pull-up, mux channel 2 SDA"
kind = "resistor"
build = "carrier"
part = "r0805"
ref = "R10"
value = "2.2k"
lcsc = "C17520"

[parts.pull_ch2_scl]
name = "2.2 kΩ pull-up, mux channel 2 SCL"
kind = "resistor"
build = "carrier"
part = "r0805"
ref = "R11"
value = "2.2k"
lcsc = "C17520"

[parts.pull_ch3_sda]
name = "2.2 kΩ pull-up, mux channel 3 SDA"
kind = "resistor"
build = "carrier"
part = "r0805"
ref = "R6"
value = "2.2k"
lcsc = "C17520"

[parts.pull_ch3_scl]
name = "2.2 kΩ pull-up, mux channel 3 SCL"
kind = "resistor"
build = "carrier"
part = "r0805"
ref = "R7"
value = "2.2k"
lcsc = "C17520"

[parts.pull_ch4_sda]
name = "2.2 kΩ pull-up, mux channel 4 SDA"
kind = "resistor"
build = "carrier"
part = "r0805"
ref = "R8"
value = "2.2k"
lcsc = "C17520"

[parts.pull_ch4_scl]
name = "2.2 kΩ pull-up, mux channel 4 SCL"
kind = "resistor"
build = "carrier"
part = "r0805"
ref = "R9"
value = "2.2k"
lcsc = "C17520"

# Pull-ups on the upstream bus, beside the TCA9548A (pre-fab review N-4). The
# breakout's own are 10 kOhm, and the bus runs from the XIAO through 10-15 cm
# of ribbon, J1 and about 55-78 mm of track: with them alone the 30-70 % rise
# time at 400 kHz can exceed Fast-mode's 300 ns (see the channel pull-ups
# above). 2.2 kOhm in parallel with 10 kOhm is 1.8 kOhm, 1.8 mA at 0.4 V, within
# the 3 mA a Fast-mode device sinks. Fitted: the repo has no DNP convention.
[parts.pull_up_sda]
name = "2.2 kΩ pull-up, upstream I2C SDA"
kind = "resistor"
build = "carrier"
part = "r0805"
ref = "R12"
value = "2.2k"
lcsc = "C17520"

[parts.pull_up_scl]
name = "2.2 kΩ pull-up, upstream I2C SCL"
kind = "resistor"
build = "carrier"
part = "r0805"
ref = "R13"
value = "2.2k"
lcsc = "C17520"

[[nets]]
role = "I2C_SDA_PIN"
to = "pull_up_sda.B"
build = "carrier"

[[nets]]
role = "I2C_SCL_PIN"
to = "pull_up_scl.B"
build = "carrier"

# The XIAO's 5V pad is its USB-C VBUS (docs/reference/boards/xiao-esp32s3.md;
# Seeed asks for a diode between an external supply and it). Without one, a
# USB cable on the head's XIAO and the LM2596 feed each other through the
# ribbon: the PC's port carries motor and servo current, or the buck
# back-drives the PC. A B5819W (1 A) from 5V to the ribbon's 5V conductors, as
# on the integrated carrier: USB then reverse-biases it, and the XIAO sees 5V
# less about 0.4 V (pre-fab review BL-2). Beside J1.
[parts.xiao_diode]
name = "B5819W Schottky, 5V to the XIAO's 5V pad"
kind = "diode"
build = "carrier"
part = "b5819w"
ref = "D1"

[[rails]]
name = "XIAO_5V"
build = "carrier"
from = "xiao_diode.K"
to = ["mcu.5V"]

