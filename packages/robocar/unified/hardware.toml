# The series resistor's far end to the buzzer.
[[rails]]
name = "PIEZO_DRV"
build = "carrier"
from = "piezo_r.B"
to = ["buzzer.+"]

# WIRING.md keeps the harness's common ground in prose; the carrier draws it.
# GAIN_SLOT to GND sets the MAX98357A to 12 dB.
[[rails]]
name = "GND"
build = "carrier"
from = "pack.-"
to = [
    "buck.IN-",
    "buck.OUT-",
    "mcu.GND",
    "motor_driver.GND",
    "pwm.GND",
    "mux.GND",
    "amp.GND",
    "amp.GAIN",
    "ranger_front.GND",
    "ranger_rear.GND",
    "oled.GND",
    "buzzer.-",
    "ldo.GND",
    "bulk_pwm.-",
    "bulk_motor.-",
    "bulk_amp.-",
    "decouple_pwm.B",
    "decouple_mux.B",
    "ldo_in.-",
    "ldo_out.-",
]

