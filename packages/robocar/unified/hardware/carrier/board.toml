C2 = [35.0, 64.6, 0]      # TB6612FNG VM bulk
C1 = [35.0, 74.5, 0]      # PCA9685 V+ bulk
A4 = [67.0, 79.0, 0]      # MAX98357A socket; the speaker lead leaves the module
