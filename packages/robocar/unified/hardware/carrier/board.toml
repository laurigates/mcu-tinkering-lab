C5 = [3.5, 30.5, 0]       # TCA9548A VIN decoupling, below its VIN pin
# The mux channel pull-ups in a row under the TCA9548A: ch0 and ch1, then ch3
# and ch4.
R2 = [9.0, 30.0, 90]
R3 = [12.0, 30.0, 90]
R4 = [15.0, 30.0, 90]
R5 = [18.0, 30.0, 90]
R6 = [22.0, 30.0, 90]
R7 = [25.0, 30.0, 90]
R8 = [28.0, 30.0, 90]
R9 = [31.0, 30.0, 90]
