# Carrier PCB layout for tools/kicad: everything the netlist does not say.
# Parts, footprints and nets come from ../../hardware.toml and the parts
# registry (docs/reference/parts/); this file says where each part sits, how
# wide each net's tracks are, and what goes on the silkscreen.
#
# PROVISIONAL (#750 step 2): DO NOT ORDER THIS BOARD. One PCB carries four
# pieces: the main board (chassis plate), a plain rectangle on the left, and a
# column of three head boards (pan-tilt cradle) on the right, each a different
# way of mounting the ribbon header (Lauri, 2026-10-16). 3 mm or wider
# copper-free bands under silkscreen saw lines separate them. JLCPCB sees one
# rectangular design with no V-cuts, tabs or mouse bites; Lauri saws the pieces
# apart after delivery. Every cut runs straight across the board or the head
# column, so no cut has an inside corner and no relief hole is needed.
#
# Every dimension below is Claude's proposal, not a measurement, and each one
# says what to measure. Correct it, then re-run
# `just robocar-unified::carrier-board` and `just robocar-unified::carrier-check`.
# The tracks are Freerouting's, kept only so the carrier gates have a routed
# board to check; nobody has reviewed them.
#
# Coordinates: millimetres from the outline's top-left corner, x right, y down.
# The top edge is the robot's front, the bottom edge its rear.
#
# `python3 -m kicad.boardcheck` validates every table against the netlist.
# `python3 -m kicad.boardinput` turns this file and the netlist into the JSON
# the pcbnew scripts in tools/kicad/pcb/ place and route from.

[project]
name = "robocar-unified-carrier"     # the KiCad project directory and file stem here
# The schematic writer grows the sheet until the drawing fits; this carrier's
# needs A2, so the sheet is named as the generated file has it.
paper = "A2"

# One rectangle for all four pieces. 100 x 100 mm keeps the order in JLCPCB's
# smallest price band (Lauri: stay within it). The main board is x 0-70.5, about
# 70 x 100 mm after sawing. No ready-made chassis plate constrains it, and hole
# placement has no hard requirement (Lauri, 2026-10-16): the chassis is drilled
# to match the board.
[outline]
origin = [100.0, 100.0]
size = [100.0, 100.0]

# The saw bands: no copper of any kind. build_board.py makes each rectangle a
# KiCad rule area, so DRC, the zone fill and Freerouting keep out, and
# kicad.boardcheck checks the committed copper against it.
#
# Each head is a 29.5 x 29.5 mm square after sawing, 0.25 mm per side inside
# the cradle's 30.0 x 30.0 mm (Lauri, 2026-10-15). Head k's square starts at
# x 70.5 and y 0, 35.25 or 70.5; its copper is the 28 x 28 mm from x 72 and
# that y: a 1.5 mm band inside the left and bottom cuts, a 0.5 mm edge keepout
# along its top and right edges. The waste strips between heads (y 29.5-35.25
# and 64.75-70.5) take the saw kerf.
[[keepouts]]
name = "head column cut band, vertical"
rect = [69.0, 0.0, 72.0, 100.0]

[[keepouts]]
name = "head 1 / head 2 cut band"
rect = [72.0, 28.0, 99.5, 35.75]

[[keepouts]]
name = "head 2 / head 3 cut band"
rect = [72.0, 63.25, 99.5, 71.0]

[[keepouts]]
name = "head 3 bottom band"
rect = [72.0, 98.5, 99.5, 100.0]

# KiCad's copper-to-edge clearance (0.5 mm, .kicad_pro) as rule areas along
# the outline: Freerouting keeps only its class clearance from the board
# boundary, and on the 28 mm heads it routed tracks onto the edge. Not along the
# main board's bottom edge, where J3's courtyard reaches the outline and a rule
# area would refuse the footprint.
[[keepouts]]
name = "edge clearance, top"
rect = [0.0, 0.0, 100.0, 0.5]

[[keepouts]]
name = "edge clearance, left"
rect = [0.0, 0.0, 0.5, 100.0]

[[keepouts]]
name = "edge clearance, right"
rect = [99.5, 0.0, 100.0, 100.0]

# ref = [x_mm, y_mm, rotation_deg], or [x_mm, y_mm, rotation_deg, "back"] for a
# part on the back face (rotation as seen from the top), relative to the
# origin; each footprint's own anchor (pad 1 for the sockets and connectors). A
# breakout socket's courtyard is its module's outline, so no part sits under a
# module.
[placement]
# Head boards. All three: the XIAO socket with its USB-C toward the head's top
# edge (Lauri confirmed the camera then faces forward), and two M2 holes in the
# top corners at the #799 positions, 22.5 mm apart (Lauri confirmed them,
# 2026-10-16). The holes' ISO 7380 footprint leaves 18.4 mm between their
# courtyards, so the XIAO (17.88 mm) fits between them; fit M2 button heads.
# PROVISIONAL: drill the cradle to match the holes.
#
# Head 1: the ribbon header on the back face at the bottom, the XIAO above it.
U1 = [85.75, 12.7, 90]
J2 = [91.75, 26.0, 90, "back"]
H5 = [74.5, 3.05, 0]
H6 = [97.0, 3.05, 0]
# Head 2: the header on the front face at the bottom, the XIAO above it.
U3 = [85.75, 47.6, 90]
J16 = [79.75, 61.65, 90]
H7 = [74.5, 38.3, 0]
H8 = [97.0, 38.3, 0]
# Head 3: the header on the back face at the top, between the M2 holes; the
# XIAO below it, where #799 had it.
U4 = [85.75, 88.0, 90]
J17 = [92.75, 75.0, 90, "back"]
H9 = [74.5, 73.55, 0]
H10 = [97.0, 73.55, 0]

# Main board, x 0.5-69. M3 holes at its corners; the chassis is drilled to
# match them (no hard requirement on placement, Lauri, 2026-10-16).
H1 = [4.0, 4.0, 0]
H2 = [65.0, 4.0, 0]
H3 = [4.0, 96.0, 0]
H4 = [65.0, 96.0, 0]
# Front row: both rangefinders side by side over the TCA9548A's channel 3 and 4
# pads, then the ribbon's main end and the UART0 tap beside it. J1's pins
# now sit 21-33 mm in from the main board's right edge (the x 70.5 saw line),
# about 22 mm further than its old spot beside the head column. Lauri's
# "a 10-15 cm ribbon reaches the head" (2026-10-16) was said of that old spot;
# confirm it still reaches from here.
J7 = [11.0, 4.0, 0]       # RCWL-1601 front
J8 = [25.0, 4.0, 0]       # RCWL-1601 rear
J1 = [37.5, 6.0, 90]      # ribbon, main end
J15 = [53.0, 2.3, 0]      # UART0 TX tap: GND, TX; the ROM boot log, 115200 baud
# The TCA9548A turned so its channel 3/4 header faces the rangefinders and its
# upstream and channel 0/1/2 header faces the PCA9685 and the expander.
A3 = [2.5, 26.0, 90]
C5 = [3.5, 30.5, 0]       # TCA9548A VIN decoupling, below its VIN pin
# The mux channel pull-ups in a row under the TCA9548A: ch0 and ch1, then ch3
# and ch4. Channel 2's pair sits under the test headers, on its way to the
# expander (Freerouting necked tracks between the row's pads at a 2.5 mm pitch).
R2 = [9.0, 30.0, 90]
R3 = [12.0, 30.0, 90]
R4 = [15.0, 30.0, 90]
R5 = [18.0, 30.0, 90]
R6 = [22.0, 30.0, 90]
R7 = [25.0, 30.0, 90]
R8 = [28.0, 30.0, 90]
R9 = [31.0, 30.0, 90]
R10 = [34.4, 33.3, 0]     # ch2 SDA
R11 = [38.4, 33.3, 0]     # ch2 SCL
# Test headers right of the mux.
J11 = [34.0, 11.0, 0]     # supply: 3V3, 5V, GND, VBAT; VBAT's only neighbour is GND
J12 = [34.0, 22.5, 0]     # I2C SDA/SCL and MUX_RST, main side of the ribbon
# The MCP23017 module (CJMCU-2317) in sockets under all 30 holes, turned 180
# degrees: its single column (I2C and supply) faces the mux and its GPIO double
# column faces the right edge. The mirror header J18 copies that double column
# beside it, turned the same way, so its rows and columns sit in the module's
# own order: column A (GPA, the outer column) at the edge, row 1 (GND/3V3) at
# the bottom.
A5 = [60.7, 32.7, 180]
J18 = [67.0, 32.7, 180]
# The PCA9685 across the board; servo columns on the module face the rear.
A2 = [5.0, 53.8, 0]
C4 = [1.6, 51.3, 90]      # PCA9685 VCC decoupling, beside its VCC pin
# The motor driver with both motor connectors beside its motor outputs, its
# bulk capacitor and the PCA9685's to its right, then the 3V3 regulator, the
# amplifier at the right.
J6 = [3.5, 67.1, 90]      # right motor (channel A)
J5 = [3.5, 76.1, 90]      # left motor (channel B)
A1 = [10.5, 80.6, 0]      # TB6612FNG socket
C2 = [35.0, 65.2, 0]      # TB6612FNG VM bulk
C1 = [35.0, 75.1, 0]      # PCA9685 V+ bulk
C7 = [45.6, 63.4, 0]      # LDO input
U2 = [45.6, 70.6, 90]     # AMS1117-3.3
C8 = [45.6, 77.0, 0]      # LDO output
J14 = [44.0, 81.2, 90]    # GND post beside the AMS1117
A4 = [67.0, 79.0, 0]      # MAX98357A socket; the speaker lead leaves the module
# Rear row: power in and the buck lead together, the OLED lead, the
# amplifier's bulk and its ground post, the buzzer and its resistor.
J3 = [12.5, 86.3, 180]    # XT30 pack in, mating face to the rear edge
J4 = [26.0, 95.0, 0]      # LM2596 lead
J9 = [25.3, 85.4, 0]      # SSD1306 OLED lead
C3 = [42.0, 87.5, 0]      # MAX98357A Vin bulk
J13 = [50.5, 85.3, 90]    # GND post beside the MAX98357A, above the buzzer
R1 = [46.5, 96.0, 0]      # buzzer series resistor
BZ1 = [51.0, 93.6, 0]     # 12 mm buzzer, soldered to the board

