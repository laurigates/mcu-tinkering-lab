# Freerouting width classes, in this order. `nets` are net names or fnmatch
# patterns over them; every pattern must match, and no net may be in two classes.
[[net_classes]]
name = "power"
nets = ["VBAT", "GND", "+5V", "MOT_*"]
track_um = 1000
clearance_um = 300
via_um = [1000, 500]

# The heads' rails: the XIAO and its camera draw well under 1 A, and 1 mm
# tracks do not fit between the 28 mm head's pads.
[[net_classes]]
name = "logic_power"
nets = ["+3V3", "HEAD*_+5V", "HEAD*_GND"]
track_um = 500
clearance_um = 250
via_um = [800, 400]

# Every net not in a class above. Its via must be the .kicad_pro Default class's.
# 200 um clearance, the .kicad_pro Default's, because Freerouting left
# sub-minimum necking between 2.54 mm-pitch pads at 250 (#793).
[signal]
track_um = 300
clearance_um = 200
via_um = [600, 300]

# A copper pour on both layers after routing, one region per ground: each
# head's ground arrives through the ribbon as HEAD_GND, HEAD2_GND or HEAD3_GND,
# a different net from the main board's GND. The regions stop at the cut bands;
# the keepouts would clear the fill from them anyway. The .kicad_dru lets a
# thermal on any of these nets resolve to one spoke because route_board first
# checks every pad of each has a routed track.
[pour]
layers = ["F.Cu", "B.Cu"]
regions = [
    { net = "GND", rect = [0.0, 0.0, 69.0, 100.0] },
    { net = "HEAD_GND", rect = [72.0, 0.0, 100.0, 28.0] },
    { net = "HEAD2_GND", rect = [72.0, 35.25, 100.0, 63.25] },
    { net = "HEAD3_GND", rect = [72.0, 70.5, 100.0, 98.5] },
]
clearance_mm = 0.4
min_thickness_mm = 0.25
thermal_gap_mm = 0.3
spoke_mm = 0.35
