# Head 3's ground on both layers of the head's outer ring (pre-fab review
# N-1). Routed tracks fence the XIAO socket's pads in, and the fill's island
# removal deleted whatever outer pour no HEAD3_GND pad touched: the committed
# board kept 58 mm² of F.Cu and 63 mm² of B.Cu ground out of about 756 mm² per
# layer. A B.Cu track round the right, bottom and left of the ring, from U4's
# GND pin to J17:13, keeps the B.Cu outer fill joined to a pad, and an F.Cu
# track down the right side from J17:2 to U4's GND pin does the same for the
# F.Cu fill there; [pour] stitch joins the layers. The same ring on F.Cu as
# well left HEAD3_PIEZO, HEAD3_UART0_TX and HEAD3_I2S_LRCLK unrouted in 8
# attempts out of 8: the signals inside the ring then have no way round it.
[[tracks]]
name = "head 3 GND ring, B.Cu"
net = "HEAD3_GND"
layer = "B.Cu"
width_mm = 0.5
points = [
    [93.37, 82.92], [96.6, 82.92], [96.6, 97.4], [75.2, 97.4], [75.2, 77.2],
    [77.4, 75.0], [80.75, 75.0],
]

[[tracks]]
name = "head 3 GND, F.Cu right side"
net = "HEAD3_GND"
layer = "F.Cu"
width_mm = 0.5
points = [[92.75, 73.0], [95.0, 73.0], [95.0, 81.3], [93.37, 82.92]]

# Room for C2's required GND fanout via, west of its GND pad where the
# committed board had it (28.9, 65.2). With the 2 mm VBAT corridor fixed, 5 of
# 8 routes left no place for it within reach (carrier-pcb trap 38).
[[route_keepouts]]
name = "C2 GND fanout via, F.Cu"
layer = "F.Cu"
rect = [28.0, 64.3, 29.8, 66.1]

[[route_keepouts]]
name = "C2 GND fanout via, B.Cu"
layer = "B.Cu"
rect = [28.0, 64.3, 29.8, 66.1]

# Freerouting width classes, in this order. `nets` are net names or fnmatch
# patterns over them; every pattern must match, and no net may be in two classes.
[[net_classes]]
name = "power"
nets = ["PACK_IN", "VBAT", "GND", "+5V", "MOT_*"]
track_um = 1000
clearance_um = 300
via_um = [1000, 500]

# The heads' rails: the XIAO and its camera draw well under 1 A, and 1 mm
# tracks do not fit between the 28 mm head's pads. XIAO_5V is the ribbon's 5V
# behind D1, HEAD*_XIAO_5V its copy on each head.
[[net_classes]]
name = "logic_power"
nets = ["+3V3", "XIAO_5V", "HEAD*_XIAO_5V", "HEAD*_GND"]
track_um = 500
clearance_um = 250
via_um = [800, 400]

# Every net not in a class above. Its via must be the .kicad_pro Default class's.
# 200 um clearance, the .kicad_pro Default's, because Freerouting left
# sub-minimum necking between 2.54 mm-pitch pads at 250 (#793).
[signal]
track_um = 300
clearance_um = 200
via_um = [600, 300]

# A copper pour on both layers after routing, one region per ground: each
# head's ground arrives through the ribbon as HEAD_GND, HEAD2_GND or HEAD3_GND,
# a different net from the main board's GND. The regions stop 1 mm short of
# each cut line (boardcheck holds them to it);
# the keepouts would clear the fill from them anyway. The .kicad_dru lets a
# thermal on any of these nets resolve to one spoke because route_board first
# checks every pad of each has a routed track.
[pour]
layers = ["F.Cu", "B.Cu"]
regions = [
    { net = "GND", rect = [0.0, 0.0, 69.0, 100.0] },
    { net = "HEAD_GND", rect = [72.0, 0.0, 100.0, 28.0] },
    { net = "HEAD2_GND", rect = [72.0, 36.25, 100.0, 63.25] },
    { net = "HEAD3_GND", rect = [72.0, 71.5, 100.0, 98.5] },
]
clearance_mm = 0.4
min_thickness_mm = 0.25
thermal_gap_mm = 0.3
spoke_mm = 0.35
# A via of each ground at each 5 mm grid point where both layers' fill holds
# one (pcb/stitch.py): joins the F.Cu and B.Cu pours where no pad or routed via
# does, on the heads' outer rings above all (N-1).
stitch = { pitch_mm = 5.0, via_um = [600, 300] }

# A via beside every SMD pad of a poured net, added after routing where there
# is room (#810): Freerouting adds a via only where a track changes layer, so
# the committed board reached B.Cu's GND from its SMD ground pads through one
# via in all. `required` is every SMD ground pad on a power path: the 470 uF
# bulk capacitors C1 (PCA9685 V+) and C2 (TB6612FNG VM), the decoupling C4
# and C5, and the AMS1117 with its input and output capacitors.
# route_board.py fails the route if one of those finds no room. C3's GND pad
# reaches both layers through J13's through-hole pad instead ([[tracks]]).
[fanout]
nets = ["GND"]
# The power class's via: route_board.py grows a smaller one to it after
# placing it, which can land it on its own pad (carrier-pcb skill, trap 42).
via_um = [1000, 500]
track_um = 400
reach_mm = 2.5
required = ["C1:2", "C2:2", "C4:2", "C5:2", "C7:2", "C8:2", "U2:1"]
exempt = ["C3:2"]
