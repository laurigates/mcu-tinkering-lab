# Fixed tracks: build_board.py lays them down locked; route_board.py walls
# them off from Freerouting and drops the pad under each first point from its
# netlist, since the track already joins it to the pad under the last.
#
# The 5V trunk, all on F.Cu with no via (pre-fab review SF-1). Routed, every
# motor, servo and head 5V path changed layer through one 1.0/0.5 mm via at
# (42.35, 63.40), and the LDO and amplifier branch through one at
# (49.46, 73.75). The chain: the buck lead's OUT+ (J4:3) up the east side of
# the OLED lead to C1's "+" pad, on to C2's, across above the TB6612FNG's
# first row to its VM pin (A1:8), and on to the PCA9685's V+ pin (A2:1). The
# motors draw from C1, C2 and VM, so that run is 1.5 mm (beside J9's pads and
# U2's GND pin) and 2.0 mm above A1; the servo run on to A2:1 is 1.5 mm. Each
# track starts at the pad further from A2:1, so A2:1, a through-hole pad, is
# the one +5V pad left in Freerouting's netlist, and D1 and J11 route to it
# (with C1's SMD pad left instead, walled in by the trunk, D1's route failed).
[[tracks]]
name = "5V trunk, A1 VM to A2 V+"
net = "+5V"
layer = "F.Cu"
width_mm = 1.5
points = [[10.5, 62.82], [10.5, 60.5], [5.0, 55.0], [5.0, 53.8]]

[[tracks]]
name = "5V trunk, C2 to A1 VM"
net = "+5V"
layer = "F.Cu"
width_mm = 2.0
