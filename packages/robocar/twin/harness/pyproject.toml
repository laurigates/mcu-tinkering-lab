[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robocar_twin"]

[project]
name = "robocar_twin"
version = "0.1.0"
description = "Scenario harness for the robocar behaviour twin (PRD-017, ADR-030)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[project.scripts]
robocar-twin-harness = "robocar_twin.cli:main"

# Lint and format settings come from the repo-root ruff.toml (run through
# pre-commit, .claude/rules/python-lint.md); no [tool.ruff] here on purpose.

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = ["error"]
