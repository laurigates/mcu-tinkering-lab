# US-N1 (ADR-033): the planner may write a note to its developers only when
# something happened, and no more often than the gate allows. The `note` tool is
# offered on the first request after the obstacle reflex trips, then not again
# until NOTE_GATE_MIN_INTERVAL_MS (5 min, note_gate.h) has passed, however
# often the reflex trips in between.
#
# Timeline (15 s ticks): a console line every 5 s keeps the planner awake
# (plan_activity_wake(), as in us-e3), so it requests on every tick from 15 s.
# Reflex at 20 s: offered on the 30 s request, which starts the window. Reflexes
# at 50 s and 80 s fall inside it and stay pending; the window opens at 330 s,
# so the 330 s request offers again. The reflex at 345 s falls in the second
# window (330..630 s), past the end of the run.
#
# Every reply carries a `note` call, as if the model ignored the tool list. Only
# the two offered requests may yield a note; every other reply's note is
# dropped and flagged note_not_offered (gemini_backend_plan() does the same on
# the robot). 25 requests at 15..375 s, so 23 dropped.
id: us-n1-note-on-reflex
stories: [US-N1]
seed: 7
duration: 380s
world:
  - {at: 0s, link: {wifi: true, key: true}}
  - {at: 0s, frame: {scene: hallway, pose: C}}
  - {at: 5s, every: 5s, until: 375s, console: status}
  - {at: 20s, reflex: {}}
  - {at: 50s, reflex: {}}
  - {at: 80s, reflex: {}}
  - {at: 345s, reflex: {}}
models:
  planner: inline
default:
  status: 200
  latency: 1s
  call: stop
  note: {kind: difficulty, text: "A chair leg keeps stopping me in the hallway."}
expect:
  - requests: {count: 25}
  - note_offered: {count: 2}
  - note_offered: {trigger: reflex, between: [30s, 31s], count: 1}
  - note_offered: {between: [32s, 329s], count: 0}
  - note_offered: {trigger: reflex, between: [330s, 331s], count: 1}
  - model_request: {note: reflex, count: 2}
  - note: {trigger: reflex, kind: difficulty, count: 2}
  - note_not_offered: {count: 23}
