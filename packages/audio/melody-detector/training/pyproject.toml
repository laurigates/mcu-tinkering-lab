[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/melody_train"]

[project]
name = "melody-train"
version = "0.1.0"
description = "Synthetic dataset, training, and ESP-PPQ quantization pipeline for the melody-detector ROI classifier"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy==2.5.4",
    "pillow==13.0.0",
    "albumentations==2.0.8",
    "click==8.5.1",
]

[project.optional-dependencies]
train = [
    # torchvision pins torch exactly (0.28.0 -> torch==2.13.0); move both together.
    "torch==2.13.0",
    "torchvision==0.28.0",
]
quantize = [
    # esp-ppq (Espressif's only .espdl quantizer, ADR-017) caps onnx<1.20,
    # below the CVE fixes in onnx 1.21.0/1.22.0, so this extra takes the onnx
    # esp-ppq allows instead of pinning one. It conflicts with `dev`, which
    # pins the patched onnx; see [tool.uv] conflicts below.
    "esp-ppq==1.3.14",
    "onnxruntime==1.31.1",
]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.12",
    "ty",
    "onnx==1.23.2",
    "onnxruntime==1.31.1",
    "onnxscript==0.7.2",
]

[project.scripts]
melody-gen = "melody_train.gen:main"

[tool.uv]
# `dev` pins the patched onnx==1.22.0 and `quantize` needs esp-ppq's
# onnx<1.20, so uv resolves the two extras separately. Install one or the
# other: `uv sync --extra train --extra dev`, or
# `uv sync --extra train --extra quantize`. Drop this once an esp-ppq release
# allows onnx>=1.21.
conflicts = [[{ extra = "dev" }, { extra = "quantize" }]]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["S101", "ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty]
[tool.ty.src]
include = ["src"]

[tool.ty.rules]
import-not-found = "ignore"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src/melody_train"]
omit = ["*/tests/*", "*/__init__.py"]
