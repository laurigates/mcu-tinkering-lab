name: Auto-resolve PR Conflicts

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1-5'  # Weekdays at 06:00 UTC
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Specific PR number to resolve (leave empty for all)'
        required: false
        type: string

# Read-only by default; the caller job asks for what the reusable uses.
permissions:
  contents: read

jobs:
  resolve-conflicts:
    # The scopes reusable-auto-resolve-conflicts.yml declares at its workflow
    # level. A called workflow gets no more than its caller job grants, so a
    # narrower block here fails the run at startup.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: laurigates/.github/.github/workflows/reusable-auto-resolve-conflicts.yml@main
    # App token for the push: GitHub starts no CI for a push made with
    # GITHUB_TOKEN, so a resolved head would never be built.
    # skip-release-please: fix-release-conflicts.yml owns the release-please
    # PR; both run on push to main, and this one would close that PR without
    # retriggering release-please.
    with:
      pr_number: ${{ inputs.pr_number || '' }}
      app-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
      skip-release-please: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
