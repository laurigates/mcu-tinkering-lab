name: Schematics Up-to-Date Check

on:
  push:
    branches: [main, develop, 'claude/**']
    paths:
      - 'docs/schematics/**'
      # Read by circuits at render time (#495): the physical board layouts,
      # the join that parses them, and robocar's PCA9685 channels.
      # A change to any of them re-renders an SVG, so it must run this check.
      # hardware.toml names the part pin every MCU wire lands on (#462).
      - 'docs/reference/boards/*.md'
      - 'tools/hardware/**'
      - '**/main/pin_config.h'
      - '**/hardware.toml'
      # The join also reads hardware.toml's extra_headers and a legacy
      # src/pin_config.h, and test_components.py reads WIRING.md (#460) and
      # the build guide's capacitor table (#1077).
      - '**/src/pin_config.h'
      - '**/WIRING.md'
      - 'packages/robotics/robocar/docs/build-guide.typ'
      - 'packages/robotics/robocar/main/planner_task.h'
      - 'packages/robotics/robocar/main/plan_activity.h'
      - '.github/workflows/schematics-check.yml'
      - '.github/actions/setup-tools/**'
  pull_request:
    # No branches: filter — a PR stacked on a non-default base (e.g. another
    # open PR's branch) must get the same check as one targeting main/develop,
    # or it looks green while nothing ran. See issue #487.
    paths:
      - 'docs/schematics/**'
      - 'docs/reference/boards/*.md'
      - 'tools/hardware/**'
      - '**/main/pin_config.h'
      - '**/hardware.toml'
      # The join also reads hardware.toml's extra_headers and a legacy
      # src/pin_config.h, and test_components.py reads WIRING.md (#460) and
      # the build guide's capacitor table (#1077).
      - '**/src/pin_config.h'
      - '**/WIRING.md'
      - 'packages/robotics/robocar/docs/build-guide.typ'
      - 'packages/robotics/robocar/main/planner_task.h'
      - 'packages/robotics/robocar/main/plan_activity.h'
      - '.github/workflows/schematics-check.yml'
      - '.github/actions/setup-tools/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  svgs-up-to-date:
    name: Verify rendered SVGs match circuit source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # cairosvg dlopens libcairo at import time. Ubuntu runners don't ship
      # it by default in all images, so install explicitly.
      - name: Install system cairo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11.17'

      - name: Install uv
        uses: ./.github/actions/setup-tools
        with:
          cache-suffix: schematics

      # --locked installs the exact versions from the committed uv.lock and
      # fails if pyproject.toml has moved past it. (--frozen, used here before
      # #457, installs the lock without that check, so a stale lock passed.)
      # SVG output is version-sensitive (e.g. schemdraw 0.23 rounds path
      # coordinates that 0.22 emits at full precision), so the freshness check
      # below is only meaningful when the dependency set is pinned.
      - name: Install Python deps
        working-directory: docs/schematics
        run: uv sync --locked --group dev

      # The whole directory, not one file: a test module added beside
      # test_routing.py (test_metrics.py, ...) must not be silently skipped.
      - name: Run schematics test suites
        working-directory: docs/schematics
        run: uv run pytest -v

      - name: Render all circuits
        working-directory: docs/schematics
        run: uv run python render.py

      # SVGs are byte-deterministic given the pinned dependency set (uv.lock),
      # so a diff means the author edited circuits/<name>.py without committing
      # the regenerated image. PNG output via cairosvg is encoder-version-
      # sensitive — we skip the strict PNG check on purpose.
      #
      # Drift is read from `git status`, not `git diff`: a new circuit's SVG
      # that was never committed is untracked, and `git diff` does not report
      # untracked files (#721). render.py also deletes an SVG no circuit
      # produces, which shows here as a deleted tracked file.
      # docs/schematics/test_freshness.py runs this step's script against a
      # scratch repository; keep the step name, which it finds the step by.
      - name: Verify SVGs are up to date
        run: |
          set -euo pipefail
          drift=$(git status --porcelain --untracked-files=all -- 'docs/schematics/images/*.svg')
          if [ -n "$drift" ]; then
            echo "$drift"
            git --no-pager diff --stat -- 'docs/schematics/images/*.svg'
            echo "::error::Rendered SVG(s) are out of sync with circuit source (modified, deleted, or never committed)."
            echo "::error::Run 'just schematics::render-all' locally and commit the regenerated images, plus any build-guide PDF it recompiled."
            exit 1
          fi

      # Read the same way as the SVG gate, so a PNG never committed gets the
      # notice too (#1091); `git diff --quiet` sees only tracked files.
      - name: Surface incidental PNG drift
        if: always()
        run: |
          set -euo pipefail
          drift=$(git status --porcelain --untracked-files=all -- 'docs/schematics/images/*.png')
          if [ -n "$drift" ]; then
            echo "$drift"
            echo "::notice::PNG(s) differ from committed copy, or were never committed — likely cairo encoder version drift across machines, not a content change. Not failing the build."
          fi
