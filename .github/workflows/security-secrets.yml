name: Security - Secret Scanning

on:
  pull_request:
    branches: [main, develop]

jobs:
  # Deterministic pattern scan of the PR's commits with gitleaks' default
  # rules. No actor gate and no diff-size cap: Renovate, release-please and
  # @claude PRs are scanned too, and so is a diff of any size. It replaced the
  # Claude scan through reusable-security-secrets.yml, which skipped bot PRs
  # and diffs over 3,000 lines and called a second gitleaks job of its own
  # (#860).
  gitleaks:
    name: gitleaks (PR commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # GITLEAKS_VERSION must equal the gitleaks rev in .pre-commit-config.yaml;
      # this step fails when they differ, so a Renovate bump of the hook lands
      # here too. A bump also needs the new GITLEAKS_SHA256 of the release
      # tarball (`sha256sum` of the downloaded linux_x64 asset).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          hook_rev=$(yq '.repos[] | select(.repo == "https://github.com/gitleaks/gitleaks") | .rev' .pre-commit-config.yaml)
          if [ "$hook_rev" != "v${GITLEAKS_VERSION}" ]; then
            echo "::error file=.github/workflows/security-secrets.yml::GITLEAKS_VERSION ${GITLEAKS_VERSION} differs from the pre-commit gitleaks rev ${hook_rev}. Update GITLEAKS_VERSION and GITLEAKS_SHA256 together."
            exit 1
          fi
          bin="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$bin"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$bin" gitleaks
          echo "$bin" >> "$GITHUB_PATH"

      # gitleaks prints no loaded-rule count, so prove the config detects
      # something: plant a random AWS-shaped key outside the checkout and
      # require a hit. The key is built at runtime, so no literal key sits in
      # this file. An allowlist-only .gitleaks.toml loads zero rules and fails here.
      - name: Canary - the config must detect a planted key
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/gitleaks-canary"
          mkdir -p "$d"
          rand=$(head -c 20 /dev/urandom | base32)
          printf 'aws_access_key_id = "AKIA%s"\n' "${rand:0:16}" > "$d/canary.env"
          rc=0
          gitleaks dir "$d" --config .gitleaks.toml --no-banner --redact --exit-code 3 >/dev/null 2>&1 || rc=$?
          if [ "$rc" -ne 3 ]; then
            echo "::error file=.gitleaks.toml::.gitleaks.toml detected nothing in a planted key (gitleaks exit $rc). It needs [extend] useDefault = true."
            exit 1
          fi
          echo "Canary key detected; the config loads rules."

      - name: Scan the PR's commits
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gitleaks git --config .gitleaks.toml --no-banner --redact --verbose \
            --log-opts="origin/${BASE_REF}..${HEAD_SHA}" || {
            echo "::error::gitleaks found a secret in this PR's commits (redacted above). Rotate it and drop it from the branch history, or allowlist a false positive in .gitleaks.toml."
            exit 1
          }
