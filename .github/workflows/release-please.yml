name: Release Please

on:
  push:
    branches:
      - main
  # Allow manual triggering, e.g. after a stale release PR is closed.
  workflow_dispatch: {}

# Prevent concurrent runs from racing on the release-please branch.
# cancel-in-progress: false ensures queued runs wait rather than being
# cancelled — avoids a race where two runs both try to update CHANGELOG.md.
concurrency:
  group: release-please-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Pure GitHub-API job (no build) — 1-CPU slim runner is 3x cheaper.
    runs-on: ubuntu-slim
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      prs_created: ${{ steps.release.outputs.prs_created }}
    steps:
      # Credentials are pushed by gitops for repos with release_please = true.
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please prints the literal ", closes" before every footer
      # reference in the notes, `Refs #N` included (conventional-changelog's
      # commit template), and GitHub reads ", closes [#N](url)" in the
      # release PR body as a closing keyword: merging #1199 closed three
      # issues its commits only referenced (#1200). This rewrites the body
      # the action just wrote to ", refs". The CHANGELOG.md files keep
      # "closes", which GitHub does not act on. release-please 17.10.4 and
      # later print "refs" themselves; the action's v5.0.0 bundles 17.6.0.
      # Drop this step once the pinned action bundles 17.10.4 or later.
      - name: Keep the release PR from closing issues
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$GH_REPO" --head release-please--branches--main \
            --state open --json number --jq '.[0].number // empty')
          [ -n "$pr" ] || exit 0
          gh api "repos/$GH_REPO/pulls/$pr" --jq '.body // ""' > "$RUNNER_TEMP/body.md"
          grep -q ', closes \[#' "$RUNNER_TEMP/body.md" || exit 0
          sed -E 's/, closes (\[#[0-9]+\]\()/, refs \1/g' "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/new.md"
          gh api --method PATCH "repos/$GH_REPO/pulls/$pr" -F "body=@$RUNNER_TEMP/new.md" --silent
