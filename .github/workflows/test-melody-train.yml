name: Test melody-train

on:
  push:
    branches: [main, develop, 'claude/**']
    paths:
      - 'packages/audio/melody-detector/training/**'
      - '.github/workflows/test-melody-train.yml'
      - '.github/actions/setup-tools/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/audio/melody-detector/training/**'
      - '.github/workflows/test-melody-train.yml'
      - '.github/actions/setup-tools/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test melody-train
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/audio/melody-detector/training
    env:
      # Every uv run below asserts uv.lock is current too, not only the sync
      # (#457); the quantize step resolves a different extra set from it.
      UV_LOCKED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: ./.github/actions/setup-tools
        with:
          cache-suffix: melody-train

      - name: Set up Python
        run: uv python install

      # The dev and quantize extras conflict (pyproject [tool.uv] conflicts):
      # dev pins the patched onnx, esp-ppq caps onnx<1.20. Lint, types and the
      # suite run in the dev environment; the quantize tests in their own step.
      - name: Install dependencies
        run: uv sync --locked --extra train --extra dev

      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check src

      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing

      - name: Pytest (quantize extra, ESP-PPQ end-to-end)
        run: uv run --exact --extra train --extra quantize --with pytest==9.2.0 pytest tests/test_quantize.py
