name: Test melody-train

on:
  push:
    branches: [main, develop, 'claude/**']
    paths:
      - 'packages/audio/melody-detector/training/**'
      - '.github/workflows/test-melody-train.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/audio/melody-detector/training/**'
      - '.github/workflows/test-melody-train.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test melody-train
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/audio/melody-detector/training
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v7.6.0
        with:
          # Pinned with the other uv installs: 0.12.14 regressed wheel installs
          # into symlinked venv dirs (astral-sh/uv#21692).
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: packages/audio/melody-detector/training/uv.lock

      - name: Set up Python
        run: uv python install

      # The dev and quantize extras conflict (pyproject [tool.uv] conflicts):
      # dev pins the patched onnx, esp-ppq caps onnx<1.20. Lint, types and the
      # suite run in the dev environment; the quantize tests in their own step.
      - name: Install dependencies
        run: uv sync --extra train --extra dev

      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check src

      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing

      - name: Pytest (quantize extra, ESP-PPQ end-to-end)
        run: uv run --exact --extra train --extra quantize --with pytest==9.2.0 pytest tests/test_quantize.py
