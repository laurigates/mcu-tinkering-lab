name: Refresh ESP-IDF dependency locks

# A tracked dependencies.lock pins every managed component at the version it
# was first resolved to, and nothing else ever moves it (issue #643). Once a
# month this regenerates every tracked lock from its idf_component.yml ranges
# and opens (or updates) one PR with the diff. build.yml then builds each
# project whose lock changed, which is the gate.
#
# The procedure — and the local equivalent, `just refresh-idf-locks` — is
# documented in .claude/rules/esp-idf-dependency-locks.md.

on:
  schedule:
    # 05:17 UTC on the 1st of each month (off the hour, away from the cron rush).
    - cron: '17 5 1 * *'
  workflow_dispatch: {}

concurrency:
  group: refresh-idf-locks
  cancel-in-progress: false

permissions:
  contents: read

env:
  IDF_VERSION: 'v5.4'

jobs:
  refresh:
    name: Regenerate tracked locks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Discovery needs git, regeneration needs ESP-IDF, so the list is made
      # here on the runner and handed to the container as arguments.
      - name: List tracked locks
        id: locks
        run: |
          set -euo pipefail
          dirs=$(python3 tools/refresh-idf-locks.py --list | tr '\n' ' ')
          if [ -z "${dirs// /}" ]; then
            echo "::error::No git-tracked dependencies.lock under packages/ — nothing to refresh, and that is not expected"
            exit 1
          fi
          echo "Tracked locks: $dirs"
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

      # One project failing restores its original lock and the script carries
      # on, so this step can fail while the others still produced a diff. The
      # steps below run anyway to open the PR for those; the job still ends red
      # because this step failed.
      - name: Regenerate locks
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          command: python3 tools/refresh-idf-locks.py ${{ steps.locks.outputs.dirs }}

      # The container ran as root; hand the tree back before git touches it.
      - name: Restore checkout ownership
        if: ${{ !cancelled() && steps.locks.outcome == 'success' }}
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      # The refresh must change nothing but tracked lock files (build dirs and
      # sdkconfig go to a temp dir, managed_components/ is gitignored). Anything
      # else in the tree means the script did something it should not have, and
      # it must not ride into the PR.
      - name: Check only lock files changed
        id: diff
        if: ${{ !cancelled() && steps.locks.outcome == 'success' }}
        run: |
          set -euo pipefail
          status=$(git status --porcelain)
          if [ -z "$status" ]; then
            echo "Every tracked lock is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$status"
          unexpected=$(grep -vE '^ M packages/.+/dependencies\.lock$' <<<"$status" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::The refresh changed files other than tracked dependencies.lock files:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          {
            echo "### Lock changes"
            echo ""
            echo '```diff'
            git diff --stat
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A PR opened with GITHUB_TOKEN does not trigger pull_request workflows,
      # so build.yml would never gate it. The release-please App token (pushed
      # by gitops) does.
      - name: Generate GitHub App token
        id: app-token
        if: ${{ !cancelled() && steps.diff.outputs.changed == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

      - name: Open or update the lock-refresh PR
        if: ${{ !cancelled() && steps.diff.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/refresh-idf-locks
          delete-branch: true
          commit-message: |
            chore(deps): refresh ESP-IDF dependencies.lock files

            Regenerated by .github/workflows/refresh-idf-locks.yml from each
            project's idf_component.yml ranges, so the tracked locks pick up
            upstream patch and minor releases (issue #643).
          title: 'chore(deps): refresh ESP-IDF dependencies.lock files'
          body: |
            Monthly regeneration of every git-tracked `dependencies.lock` from its `idf_component.yml` ranges (`python3 tools/refresh-idf-locks.py`, in `espressif/idf:${{ env.IDF_VERSION }}`).

            `build.yml` builds each project whose lock changed; that is the gate. A project with no `.github/project-matrix.json` entry is not built by CI — check the diff for one before merging.

            A green build does not prove the board boots: a bump to `espressif/esp32-camera` or any I2C-touching component can change the I2C driver generation and abort at first boot (`.claude/rules/esp-idf-i2c-driver-generation-conflict.md`). Nothing here has run on hardware. Component changelogs are on https://components.espressif.com.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Procedure: `.claude/rules/esp-idf-dependency-locks.md`
          labels: |
            dependencies
            chore
          assignees: laurigates
