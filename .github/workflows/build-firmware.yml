# yamllint disable rule:line-length
name: Build and Release Firmware

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build for'
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

env:
  IDF_VERSION: 'v5.4'

# Collapse the duplicate full-matrix runs produced when many releases are
# published in one batch — keep only the latest run per release tag.
concurrency:
  group: build-firmware-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: true

jobs:
  discover-projects:
    name: Discover flasher-enabled projects
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      project_count: ${{ steps.discover.outputs.project_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Scan flasher.json files
        id: discover
        run: |
          INCLUDES="[]"
          for flasher_json in packages/*/*/flasher.json; do
            project_dir=$(dirname "$flasher_json")
            project_id=$(basename "$project_dir")
            project_path="${project_dir#packages/}"
            chip_family=$(jq -r '.chipFamily' "$flasher_json")
            app_binary=$(jq -r '.appBinaryName' "$flasher_json")

            # Map chipFamily to ESP-IDF target
            case "$chip_family" in
              "ESP32-S3") target="esp32s3" ;;
              "ESP32-S2") target="esp32s2" ;;
              "ESP32-C3") target="esp32c3" ;;
              "ESP32-C6") target="esp32c6" ;;
              *)          target="esp32"   ;;
            esac

            # Check if project needs external dependency fetching
            fetch_deps="false"
            if [ "$project_id" = "xbox-switch-bridge" ] || [ "$project_id" = "gamepad-synth" ]; then
              fetch_deps="true"
            fi

            INCLUDES=$(echo "$INCLUDES" | jq -c \
              --arg id "$project_id" \
              --arg path "$project_path" \
              --arg target "$target" \
              --arg app_bin "$app_binary" \
              --arg fetch_deps "$fetch_deps" \
              '. + [{"project": $id, "project_path": $path, "target": $target, "app_binary": $app_bin, "fetch_deps": ($fetch_deps == "true")}]')
          done

          COUNT=$(echo "$INCLUDES" | jq 'length')
          echo "Discovered $COUNT flasher-enabled projects"
          echo "matrix={\"include\":$INCLUDES}" >> "$GITHUB_OUTPUT"
          echo "project_count=$COUNT" >> "$GITHUB_OUTPUT"

  build-firmware:
    name: Build ${{ matrix.project }}
    needs: discover-projects
    if: needs.discover-projects.outputs.project_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-projects.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Fetch external dependencies
        if: matrix.fetch_deps
        working-directory: packages/${{ matrix.project_path }}
        run: |
          BP32_DIR="external/bluepad32"
          BTSTACK_ROOT="$BP32_DIR/external/btstack"
          BTSTACK_COMP="$BTSTACK_ROOT/port/esp32/components/btstack"

          echo "Cloning bluepad32 release_v3.10.3..."
          git clone --depth 1 --branch release_v3.10.3 \
            https://github.com/ricardoquesada/bluepad32.git "$BP32_DIR"
          cd "$BP32_DIR" && git submodule update --init --depth 1 external/btstack && cd -

          echo "Preparing btstack component..."
          for dir in src 3rd-party/bluedroid 3rd-party/hxcmod-player \
                     3rd-party/lwip/dhcp-server 3rd-party/lc3-google \
                     3rd-party/md5 3rd-party/micro-ecc 3rd-party/yxml \
                     platform/freertos platform/lwip; do
            mkdir -p "$BTSTACK_COMP/$(dirname "$dir")"
            cp -r "$BTSTACK_ROOT/$dir" "$BTSTACK_COMP/$dir"
          done
          mkdir -p "$BTSTACK_COMP/platform/embedded"
          for f in hal_time_ms.h hal_uart_dma.h hci_dump_embedded_stdout.h hci_dump_embedded_stdout.c; do
            cp "$BTSTACK_ROOT/platform/embedded/$f" "$BTSTACK_COMP/platform/embedded/"
          done
          echo "Dependencies ready"

      - name: Build ${{ matrix.project }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: ${{ matrix.target }}
          command: cd packages/${{ matrix.project_path }} && idf.py build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.project }}
          path: |
            packages/${{ matrix.project_path }}/build/${{ matrix.app_binary }}
            packages/${{ matrix.project_path }}/build/bootloader/bootloader.bin
            packages/${{ matrix.project_path }}/build/partition_table/partition-table.bin
            packages/${{ matrix.project_path }}/build/ota_data_initial.bin
          retention-days: 7

  assemble-and-deploy:
    name: Assemble manifests and deploy
    needs: [discover-projects, build-firmware]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: artifacts

      # Pass the tag verbatim — release-please monorepo tags look like
      # "robocar-unified-v0.1.5" (no leading "v" to strip). Per-project card
      # versions come from .release-please-manifest.json inside the generator.
      - name: Get version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name || inputs.release_tag }}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Assemble firmware directory
        run: |
          mkdir -p firmware
          missing=()

          for flasher_json in packages/*/*/flasher.json; do
            project_dir=$(dirname "$flasher_json")
            project_id=$(basename "$project_dir")
            app_bin=$(jq -r '.appBinaryName' "$flasher_json")
            dest="firmware/$project_id"
            # actions/upload-artifact roots an artifact at the LEAST COMMON
            # ANCESTOR of the paths it was given. Every path in the matching
            # "Upload build artifacts" step lives under
            # packages/<project_path>/build/, so that whole prefix is
            # stripped at upload time and the downloaded artifact has the
            # app binary at its root, not under packages/<path>/build.
            src="artifacts/firmware-$project_id"
            mkdir -p "$dest"

            for part in "$app_bin" "bootloader/bootloader.bin" "partition_table/partition-table.bin"; do
              if [ -f "$src/$part" ]; then
                cp "$src/$part" "$dest/$(basename "$part")"
              else
                echo "::error::missing $part for $project_id (looked in $src/$part)"
                missing+=("$project_id: $part")
              fi
            done

            # ota_data_initial.bin only exists for projects with an OTA
            # partition table entry — genuinely optional, not a fallback.
            cp "$src/ota_data_initial.bin" "$dest/" 2>/dev/null || true
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "The following firmware parts were not found in their downloaded build artifacts:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Generate flasher manifests and projects.json
        run: bash tools/generate-flasher-manifests.sh "${{ steps.version.outputs.version }}" firmware

      - name: Assemble Pages site
        run: |
          mkdir -p _site/firmware
          cp docs/flasher/* _site/
          cp -r firmware/* _site/firmware/
          # Expose projects.json at the root so index.html can fetch it
          cp firmware/projects.json _site/projects.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify published firmware parts
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}"
          missing=()

          for manifest in firmware/*/manifest.json; do
            project_id=$(basename "$(dirname "$manifest")")
            parts=$(jq -r '.builds[].parts[].path' "$manifest")
            while IFS= read -r part; do
              [ -z "$part" ] && continue
              url="$base/firmware/$project_id/$part"
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
              echo "$code $url"
              if [ "$code" != "200" ]; then
                missing+=("$project_id/$part -> $code ($url)")
              fi
            done <<< "$parts"
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "The following manifest-listed parts were not fetchable from the deployed Pages site:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Prepare distinct release assets
        run: |
          mkdir -p release-assets
          declare -A seen_binary

          for flasher_json in packages/*/*/flasher.json; do
            project_dir=$(dirname "$flasher_json")
            project_id=$(basename "$project_dir")
            app_bin=$(jq -r '.appBinaryName' "$flasher_json")

            # appBinaryName is unique across every packages/*/*/flasher.json
            # today (verified: 16/16 distinct), so the app binaries can be
            # attached to the release under their own names. bootloader.bin
            # and partition-table.bin are NOT unique (every project's is
            # named identically) and are deliberately left off the release —
            # they are only needed for the web flasher's per-project
            # manifest.json, already served from Pages. Guard the assumption
            # instead of trusting it silently: a future project reusing an
            # existing appBinaryName fails the build here rather than
            # clobbering another project's release asset.
            if [ -n "${seen_binary[$app_bin]:-}" ]; then
              echo "::error::appBinaryName '$app_bin' is used by both '${seen_binary[$app_bin]}' and '$project_id' — release assets would collide"
              exit 1
            fi
            seen_binary[$app_bin]="$project_id"

            src="firmware/$project_id/$app_bin"
            if [ ! -f "$src" ]; then
              echo "::error::missing $src, cannot attach it to the release"
              exit 1
            fi
            cp "$src" "release-assets/$app_bin"

            if [ -f "firmware/$project_id/manifest.json" ]; then
              cp "firmware/$project_id/manifest.json" "release-assets/${project_id}-manifest.json"
            fi
          done

          cp firmware/projects.json release-assets/projects.json

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: release-assets/*

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          tag="${{ github.event.release.tag_name || inputs.release_tag }}"

          expected=$(find release-assets -type f | wc -l | tr -d ' ')
          urls=$(gh api "repos/$repo/releases/tags/$tag" --jq '.assets[].browser_download_url')
          actual=$(printf '%s\n' "$urls" | grep -c . || true)

          if [ "$actual" != "$expected" ]; then
            echo "::error::expected $expected release assets (from release-assets/), the release has $actual"
            exit 1
          fi

          missing=()
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            code=$(curl -sL -o /dev/null -w '%{http_code}' "$url")
            echo "$code $url"
            if [ "$code" != "200" ]; then
              missing+=("$url -> $code")
            fi
          done <<< "$urls"

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "The following release assets were not downloadable:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Notify robots of new firmware via MQTT
        if: github.event_name == 'release' && vars.MQTT_ENABLED == 'true'
        continue-on-error: true
        env:
          MQTT_BROKER_HOST: ${{ secrets.MQTT_BROKER_HOST }}
          MQTT_BROKER_PORT: ${{ secrets.MQTT_BROKER_PORT }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto-clients

          mosquitto_pub \
            -h "$MQTT_BROKER_HOST" \
            -p "${MQTT_BROKER_PORT:-1883}" \
            -t "robocar/ota/notify" \
            -m "$RELEASE_TAG" \
            -q 1

      - name: Generate build summary
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          {
            echo "## Firmware Build Complete"
            echo ""
            echo "### Release: \`${RELEASE_TAG}\`"
            echo ""
            echo "| Project | Binary | Size |"
            echo "|---------|--------|------|"

            for flasher_json in packages/*/*/flasher.json; do
              project_dir=$(dirname "$flasher_json")
              project_id=$(basename "$project_dir")
              app_bin=$(jq -r '.appBinaryName' "$flasher_json")
              bin_path="firmware/$project_id/$app_bin"
              if [ -f "$bin_path" ]; then
                SIZE=$(stat -c%s "$bin_path" 2>/dev/null || echo "?")
                echo "| $project_id | $app_bin | $SIZE bytes |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
