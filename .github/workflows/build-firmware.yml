# yamllint disable rule:line-length
name: Build and Release Firmware

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build for'
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

env:
  IDF_VERSION: 'v5.4'

# Collapse the duplicate full-matrix runs produced when many releases are
# published in one batch — keep only the latest run per release tag.
concurrency:
  group: build-firmware-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: true

jobs:
  discover-projects:
    name: Discover flasher-enabled projects
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      project_count: ${{ steps.discover.outputs.project_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Scan flasher.json files
        id: discover
        run: |
          INCLUDES="[]"
          for flasher_json in packages/*/*/flasher.json; do
            project_dir=$(dirname "$flasher_json")
            project_id=$(basename "$project_dir")
            project_path="${project_dir#packages/}"
            chip_family=$(jq -r '.chipFamily' "$flasher_json")
            app_binary=$(jq -r '.appBinaryName' "$flasher_json")

            # Map chipFamily to ESP-IDF target
            case "$chip_family" in
              "ESP32-S3") target="esp32s3" ;;
              "ESP32-S2") target="esp32s2" ;;
              "ESP32-C3") target="esp32c3" ;;
              "ESP32-C6") target="esp32c6" ;;
              *)          target="esp32"   ;;
            esac

            # Check if project needs external dependency fetching
            fetch_deps="false"
            if [ "$project_id" = "xbox-switch-bridge" ] || [ "$project_id" = "gamepad-synth" ]; then
              fetch_deps="true"
            fi

            INCLUDES=$(echo "$INCLUDES" | jq -c \
              --arg id "$project_id" \
              --arg path "$project_path" \
              --arg target "$target" \
              --arg app_bin "$app_binary" \
              --arg fetch_deps "$fetch_deps" \
              '. + [{"project": $id, "project_path": $path, "target": $target, "app_binary": $app_bin, "fetch_deps": ($fetch_deps == "true")}]')
          done

          COUNT=$(echo "$INCLUDES" | jq 'length')
          echo "Discovered $COUNT flasher-enabled projects"
          echo "matrix={\"include\":$INCLUDES}" >> "$GITHUB_OUTPUT"
          echo "project_count=$COUNT" >> "$GITHUB_OUTPUT"

  build-firmware:
    name: Build ${{ matrix.project }}
    needs: discover-projects
    if: needs.discover-projects.outputs.project_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-projects.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Fetch external dependencies
        if: matrix.fetch_deps
        working-directory: packages/${{ matrix.project_path }}
        run: |
          BP32_DIR="external/bluepad32"
          BTSTACK_ROOT="$BP32_DIR/external/btstack"
          BTSTACK_COMP="$BTSTACK_ROOT/port/esp32/components/btstack"

          echo "Cloning bluepad32 release_v3.10.3..."
          git clone --depth 1 --branch release_v3.10.3 \
            https://github.com/ricardoquesada/bluepad32.git "$BP32_DIR"
          cd "$BP32_DIR" && git submodule update --init --depth 1 external/btstack && cd -

          echo "Preparing btstack component..."
          for dir in src 3rd-party/bluedroid 3rd-party/hxcmod-player \
                     3rd-party/lwip/dhcp-server 3rd-party/lc3-google \
                     3rd-party/md5 3rd-party/micro-ecc 3rd-party/yxml \
                     platform/freertos platform/lwip; do
            mkdir -p "$BTSTACK_COMP/$(dirname "$dir")"
            cp -r "$BTSTACK_ROOT/$dir" "$BTSTACK_COMP/$dir"
          done
          mkdir -p "$BTSTACK_COMP/platform/embedded"
          for f in hal_time_ms.h hal_uart_dma.h hci_dump_embedded_stdout.h hci_dump_embedded_stdout.c; do
            cp "$BTSTACK_ROOT/platform/embedded/$f" "$BTSTACK_COMP/platform/embedded/"
          done
          echo "Dependencies ready"

      # Same reasoning as the assemble job's "Checkout workflow revision"
      # step: a workflow_dispatch replay can target a tag older than
      # tools/check-app-partition-fit.sh, so the script comes from the
      # revision this workflow file was loaded from, not from the tag.
      - name: Checkout workflow revision (for tools/ helpers)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            /tools/
          sparse-checkout-cone-mode: false
          path: workflow-tools

      # The app-partition size gate is ESP-IDF's own: `idf.py build` fails
      # when the app exceeds the smallest app partition of the table it just
      # generated (esptool_py's app_check_size target), so the limit is each
      # project's real partition table rather than one number for all sixteen.
      # The script re-runs that shipped check so its verdict is a per-project
      # report the summary can show, and so a build that somehow skipped the
      # check fails here instead of passing by absence (issue #556). $OLDPWD
      # is the repo root after the cd; the action runs this via `bash -c`.
      - name: Build ${{ matrix.project }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: ${{ matrix.target }}
          command: >-
            cd packages/${{ matrix.project_path }} &&
            idf.py build &&
            bash "$OLDPWD/workflow-tools/tools/check-app-partition-fit.sh" .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.project }}
          path: |
            packages/${{ matrix.project_path }}/build/${{ matrix.app_binary }}
            packages/${{ matrix.project_path }}/build/bootloader/bootloader.bin
            packages/${{ matrix.project_path }}/build/partition_table/partition-table.bin
            packages/${{ matrix.project_path }}/build/ota_data_initial.bin
            packages/${{ matrix.project_path }}/build/app-partition-fit.txt
          retention-days: 7

  assemble-and-deploy:
    name: Assemble manifests and deploy
    needs: [discover-projects, build-firmware]
    runs-on: ubuntu-latest
    # The job normally finishes in ~1.5 min. Without a bound, an unreachable
    # Pages origin costs ~31 s of curl retries per probed URL (52 URLs across
    # 16 manifests as of 2026-09), and a black-holed one up to ~3.5 min per
    # URL, against the 360-minute default job timeout (issue #542).
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      # A workflow_dispatch replay can target a tag cut BEFORE this helper
      # existed (tools/lib/otadata-predicate.sh was added by #555), so the
      # tag checkout above cannot be relied on to contain it. github.sha is
      # event-dependent and unusable here too — for a `release` event it is
      # the tag's own commit, exactly the thing we cannot trust.
      # github.workflow_sha is "the commit SHA for the workflow file" and, for
      # a top-level (non-reusable) workflow like this one, always resolves to
      # the revision this run's build-firmware.yml was itself loaded from —
      # independent of which tag is being rebuilt. Check that revision out
      # separately so the predicate is always available, regardless of how
      # old the target tag is.
      - name: Checkout workflow revision (for tools/lib helpers)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            tools/lib
          sparse-checkout-cone-mode: false
          path: workflow-tools

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: artifacts

      # Pass the tag verbatim — release-please monorepo tags look like
      # "robocar-unified-v0.1.5" (no leading "v" to strip). Per-project card
      # versions come from .release-please-manifest.json inside the generator.
      - name: Get version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name || inputs.release_tag }}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Assemble firmware directory
        run: |
          # Sourced from the workflow-revision checkout above, not the tag
          # checkout — the tag being rebuilt may predate this helper.
          if [ ! -f workflow-tools/tools/lib/otadata-predicate.sh ]; then
            echo "::error::tools/lib/otadata-predicate.sh not found at the workflow's own revision (${{ github.workflow_sha }}) — cannot determine otadata requirements, refusing to guess"
            exit 1
          fi
          # shellcheck source=/dev/null
          source workflow-tools/tools/lib/otadata-predicate.sh

          mkdir -p firmware
          missing=()

          for flasher_json in packages/*/*/flasher.json; do
            project_dir=$(dirname "$flasher_json")
            project_id=$(basename "$project_dir")
            app_bin=$(jq -r '.appBinaryName' "$flasher_json")
            dest="firmware/$project_id"
            # actions/upload-artifact roots an artifact at the LEAST COMMON
            # ANCESTOR of the paths it was given. Every path in the matching
            # "Upload build artifacts" step lives under
            # packages/<project_path>/build/, so that whole prefix is
            # stripped at upload time and the downloaded artifact has the
            # app binary at its root, not under packages/<path>/build.
            src="artifacts/firmware-$project_id"
            mkdir -p "$dest"

            for part in "$app_bin" "bootloader/bootloader.bin" "partition_table/partition-table.bin"; do
              if [ -f "$src/$part" ]; then
                cp "$src/$part" "$dest/$(basename "$part")"
              else
                echo "::error::missing $part for $project_id (looked in $src/$part)"
                missing+=("$project_id: $part")
              fi
            done

            # ota_data_initial.bin is required exactly when the project's
            # partition table (the file sdkconfig.defaults selects, see
            # resolve_partition_table) declares a `data,ota` row — the same predicate
            # tools/generate-flasher-manifests.sh uses to decide whether the
            # generated manifest names the file at all. Keeping this
            # conditional in sync with the generator's is the whole point of
            # sharing lib/otadata-predicate.sh: a project whose otadata row
            # disappears loses the requirement here in the same commit that
            # removes it from the manifest, instead of a manifest silently
            # naming a part the build never produced (issue #541).
            partition_table=$(resolve_partition_table "$project_dir")
            if has_otadata_partition "$partition_table"; then
              if [ -f "$src/ota_data_initial.bin" ]; then
                cp "$src/ota_data_initial.bin" "$dest/"
              else
                echo "::error::missing ota_data_initial.bin for $project_id ($partition_table declares a data,ota row, looked in $src/ota_data_initial.bin)"
                missing+=("$project_id: ota_data_initial.bin")
              fi
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "The following firmware parts were not found in their downloaded build artifacts:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Verify firmware coverage
        shell: bash
        run: |
          expected="${{ needs.discover-projects.outputs.project_count }}"
          actual=$(find firmware -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          echo "Assembled firmware for $actual of $expected discovered projects"
          if [ "$actual" != "$expected" ]; then
            echo "::error::assembled firmware directories ($actual) do not match the project count discover-projects reported ($expected) — a project's flasher.json was skipped, or the source tree was narrowed since discovery ran"
            exit 1
          fi

      - name: Generate flasher manifests and projects.json
        run: bash tools/generate-flasher-manifests.sh "${{ steps.version.outputs.version }}" firmware

      - name: Verify manifest parts exist locally
        # Cheaper, earlier sibling of "Verify published firmware parts" below:
        # that step only catches a manifest naming a missing part after Pages
        # has already deployed it. This one reads the same manifests against
        # the local firmware/ tree, before anything is uploaded or published,
        # so the mismatch this issue is about (#541) fails here instead of
        # after a broken flasher page is live.
        run: |
          missing=()

          for manifest in firmware/*/manifest.json; do
            project_id=$(basename "$(dirname "$manifest")")
            parts=$(jq -r '.builds[].parts[].path' "$manifest")
            while IFS= read -r part; do
              [ -z "$part" ] && continue
              local_file="firmware/$project_id/$part"
              if [ ! -f "$local_file" ]; then
                missing+=("$project_id/$part -> named in manifest.json but not found at $local_file")
              fi
            done <<< "$parts"
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "The following manifest-listed parts are missing from the assembled firmware/ tree:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Assemble Pages site
        run: |
          mkdir -p _site/firmware
          cp docs/flasher/* _site/
          cp -r firmware/* _site/firmware/
          # Expose projects.json at the root so index.html can fetch it
          cp firmware/projects.json _site/projects.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Prepare distinct release assets
        run: |
          mkdir -p release-assets
          declare -A seen_asset
          declare -A seen_topic

          for flasher_json in packages/*/*/flasher.json; do
            project_dir=$(dirname "$flasher_json")
            project_id=$(basename "$project_dir")
            app_bin=$(jq -r '.appBinaryName' "$flasher_json")
            ota_asset=$(jq -r '.otaAssetName // empty' "$flasher_json")
            ota_topic=$(jq -r '.otaNotifyTopic // empty' "$flasher_json")

            # otaAssetName is deliberately independent of appBinaryName: the
            # latter only names the binary inside the web-flasher's
            # per-project manifest.json, while otaAssetName is the release
            # asset name the project's OWN on-device OTA code expects. Before
            # this field existed, the release attached appBinaryName and none
            # of the three OTA-consuming projects looked for that name — see
            # issue #540. Fail loudly on a missing field rather than fall
            # back to appBinaryName, so a new flasher.json can't silently
            # regress to the bug this field was added to fix.
            if [ -z "$ota_asset" ]; then
              echo "::error::$flasher_json has no otaAssetName — every flasher-enabled project must declare one (see .claude/rules/web-flasher.md)"
              exit 1
            fi
            if [ -z "$ota_topic" ]; then
              echo "::error::$flasher_json has no otaNotifyTopic — every flasher-enabled project must declare one (see .claude/rules/web-flasher.md)"
              exit 1
            fi

            # otaAssetName is unique across every packages/*/*/flasher.json
            # today (verified: 16/16 distinct), so the app binaries can be
            # attached to the release under their own names. bootloader.bin
            # and partition-table.bin are NOT unique (every project's is
            # named identically) and are deliberately left off the release —
            # they are only needed for the web flasher's per-project
            # manifest.json, already served from Pages. Guard the assumption
            # instead of trusting it silently: a future project reusing an
            # existing otaAssetName fails the build here rather than
            # clobbering another project's release asset.
            if [ -n "${seen_asset[$ota_asset]:-}" ]; then
              echo "::error::otaAssetName '$ota_asset' is used by both '${seen_asset[$ota_asset]}' and '$project_id' — release assets would collide"
              exit 1
            fi
            seen_asset[$ota_asset]="$project_id"

            # otaNotifyTopic uniqueness is what lets the MQTT notify step
            # (below) wake exactly one project per release — two projects
            # sharing a topic would wake the wrong robot's on-device poll.
            if [ -n "${seen_topic[$ota_topic]:-}" ]; then
              echo "::error::otaNotifyTopic '$ota_topic' is used by both '${seen_topic[$ota_topic]}' and '$project_id' — MQTT notify would wake the wrong robot"
              exit 1
            fi
            seen_topic[$ota_topic]="$project_id"

            src="firmware/$project_id/$app_bin"
            if [ ! -f "$src" ]; then
              echo "::error::missing $src, cannot attach it to the release"
              exit 1
            fi
            cp "$src" "release-assets/$ota_asset"

            if [ -f "firmware/$project_id/manifest.json" ]; then
              cp "firmware/$project_id/manifest.json" "release-assets/${project_id}-manifest.json"
            fi
          done

          cp firmware/projects.json release-assets/projects.json

      - name: Upload firmware to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name || inputs.release_tag }}"

          # `gh release upload` takes the tag directly. softprops/action-gh-release
          # was used here until it started resolving the release through GITHUB_REF
          # instead of the tag_name it was given: on a workflow_dispatch that ref is
          # refs/heads/main, and the call failed with
          #   Unexpected error fetching GitHub release for tag refs/heads/main:
          #   Resource not accessible by integration
          # reproducibly (runs 34692593046 and 34704198704), while the release-event
          # path kept working because there GITHUB_REF is the tag. See issue #544.
          #
          # --clobber is required because a re-dispatch against an existing tag re-stages
          # asset names the release already carries. Note it DELETES before uploading, so a
          # failed upload loses the previous copies; every run stages the full set, so the
          # next successful run restores them.
          gh release upload "$tag" release-assets/* --clobber

      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          tag="${{ github.event.release.tag_name || inputs.release_tag }}"

          # Build the expected set from what we actually staged, by NAME —
          # never by count. A count-only comparison is name-blind: it goes
          # green if one expected file is silently swapped for an unrelated
          # one (same total), and it goes red on an unrelated pre-existing
          # release asset outside this branch's naming scheme (extra total).
          mapfile -t expected_names < <(find release-assets -mindepth 1 -type f -printf '%f\n' | sort)
          if [ "${#expected_names[@]}" -eq 0 ]; then
            echo "::error::no files found under release-assets/ — nothing was staged to verify"
            exit 1
          fi

          assets_json=$(gh api "repos/$repo/releases/tags/$tag" --jq '.assets')

          missing=()
          urls=()
          for name in "${expected_names[@]}"; do
            url=$(printf '%s' "$assets_json" | jq -r --arg n "$name" '[.[] | select(.name == $n) | .browser_download_url] | first // empty')
            if [ -z "$url" ]; then
              missing+=("$name")
            else
              urls+=("$url")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::the following staged assets are not present on release $tag:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi

          failed=()
          for url in "${urls[@]}"; do
            code=$(curl -sSL --max-time 30 --retry 5 --retry-all-errors -o /dev/null -w '%{http_code}' "$url" || echo 000)
            echo "$code $url"
            if [ "$code" != "200" ]; then
              failed+=("$url -> $code")
            fi
          done

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "The following release assets were not downloadable:"
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi

      # Sequenced AFTER the release publish + its own verification above, on
      # purpose: this gate probes GitHub Pages, which can serve a stale
      # cached 404 on a path it hasn't purged yet (observed live: HIT, age
      # 2597s, on the very first path this gate probes). A Pages-side edge
      # cache blip must not be able to suppress a release whose assets are
      # already verified good.
      - name: Verify published firmware parts
        # always() so a release-side failure cannot suppress the Pages half of the
        # diagnosis; gated on the deploy having succeeded, since the probe reads
        # steps.deployment.outputs.page_url and would otherwise build bare paths.
        if: always() && steps.deployment.outcome == 'success'
        shell: bash
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}"
          missing=()

          for manifest in firmware/*/manifest.json; do
            project_id=$(basename "$(dirname "$manifest")")
            parts=$(jq -r '.builds[].parts[].path' "$manifest")
            while IFS= read -r part; do
              [ -z "$part" ] && continue
              local_file="firmware/$project_id/$part"
              expected_size=$(stat -c%s "$local_file" 2>/dev/null || echo -1)
              url="$base/firmware/$project_id/$part"
              # --retry/--retry-all-errors/--max-time cover connection-level
              # transients only (refused, reset, timed out). Without --fail
              # curl treats any HTTP response, a 404 included, as success, so
              # no retry engages on one. Nothing here can bypass a stale
              # cached 404 either: Fastly, in front of Pages, leaves the query
              # string out of its cache key, so a ?v= suffix is still a cache
              # HIT (issue #542). What keeps such a 404 from suppressing a
              # good release is the step ordering described above. A failure
              # still lands in the named-failure list below and fails the job.
              # -w ends in \n so the fallback lands on its own line instead of
              # being glued onto curl's partial output.
              read -r code actual_size <<< "$(curl -sS --max-time 30 --retry 5 --retry-all-errors -o /dev/null -w '%{http_code} %{size_download}\n' "$url" 2>/dev/null || echo '000 -1')"
              echo "$code $actual_size (expected $expected_size) $url"
              if [ "$code" != "200" ]; then
                missing+=("$project_id/$part -> HTTP $code ($url)")
              elif [ "$actual_size" != "$expected_size" ]; then
                missing+=("$project_id/$part -> size mismatch: got $actual_size bytes, expected $expected_size ($url)")
              fi
            done <<< "$parts"
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "The following manifest-listed parts failed verification against the deployed Pages site:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Notify the released project's robot via MQTT
        if: github.event_name == 'release' && vars.MQTT_ENABLED == 'true'
        continue-on-error: true
        env:
          MQTT_BROKER_HOST: ${{ secrets.MQTT_BROKER_HOST }}
          MQTT_BROKER_PORT: ${{ secrets.MQTT_BROKER_PORT }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # This job always rebuilds and re-attaches EVERY flasher-enabled
          # project to whichever release fired it (see "Prepare distinct
          # release assets" above) — most of those binaries are unchanged
          # rebuilds of a project that did not bump its version. Publishing
          # the bare tag to one shared topic (the previous behaviour) woke
          # every listening robot on every release, with no way for a robot
          # to tell whether the release was its own (issue #409).
          #
          # release-please tags this monorepo as <component>-v<semver> with
          # no custom tag-separator (see release-please-config.json), so the
          # component is everything before the trailing "-v<semver>". Resolve
          # it to a project by finding the flasher.json whose otaNotifyTopic
          # equals "<component>/ota/notify" — that scheme, not this parsing,
          # is the source of truth: it is set once per project in
          # flasher.json's otaNotifyTopic and read here, never recomputed.
          component=$(echo "$RELEASE_TAG" | sed -E 's/-v[0-9]+(\.[0-9]+){0,2}.*$//')
          topic=""
          for flasher_json in packages/*/*/flasher.json; do
            candidate=$(jq -r '.otaNotifyTopic // empty' "$flasher_json")
            if [ "$candidate" = "${component}/ota/notify" ]; then
              topic="$candidate"
              break
            fi
          done

          if [ -z "$topic" ]; then
            echo "::warning::release tag '$RELEASE_TAG' parses to component '$component', which no flasher.json otaNotifyTopic matches — skipping MQTT notify"
            exit 0
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto-clients

          mosquitto_pub \
            -h "$MQTT_BROKER_HOST" \
            -p "${MQTT_BROKER_PORT:-1883}" \
            -t "$topic" \
            -m "$RELEASE_TAG" \
            -q 1

          echo "Published MQTT notify to $topic for $RELEASE_TAG"

      - name: Generate build summary
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          {
            echo "## Firmware Build Complete"
            echo ""
            echo "### Release: \`${RELEASE_TAG}\`"
            echo ""
            echo "| Project | Binary | Size | Partition fit |"
            echo "|---------|--------|------|---------------|"

            for flasher_json in packages/*/*/flasher.json; do
              project_dir=$(dirname "$flasher_json")
              project_id=$(basename "$project_dir")
              app_bin=$(jq -r '.appBinaryName' "$flasher_json")
              bin_path="firmware/$project_id/$app_bin"
              # Verdict written by tools/check-app-partition-fit.sh in the
              # build job (ESP-IDF's own check against the project's real
              # partition table); same artifact root as the binaries above.
              fit_report="artifacts/firmware-$project_id/app-partition-fit.txt"
              if [ -f "$bin_path" ]; then
                SIZE=$(stat -c%s "$bin_path" 2>/dev/null || echo "?")
                FIT=$(head -n1 "$fit_report" 2>/dev/null || echo "no report")
                echo "| $project_id | $app_bin | $SIZE bytes | $FIT |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
