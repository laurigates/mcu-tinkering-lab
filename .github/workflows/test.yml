name: Test Suite

on:
  push:
    branches: [main, develop, 'claude/**']
    paths:
      - 'packages/**'
      - '.github/workflows/test.yml'
      - '.github/actions/**'
      - '.github/python-suites.json'
      - '.pre-commit-config.yaml'
      - '.clang-format'
      - '.gitleaks.toml'
      - '.github/issue-labels.json'
      - 'renovate.json'
      - 'ruff.toml'
      - 'tools/**'
      - 'docker-compose.yml'
      - 'Dockerfile'
  pull_request:
    # No branches: filter — a PR stacked on a non-default base (e.g. another
    # open PR's branch) must get the same suite as one targeting main/develop,
    # or it looks green while nothing ran. See issue #487.
    #
    # No paths: filter either. detect-changes gates every job below, so a PR
    # outside those paths runs only detect-changes and Test Summary. Test
    # Summary then reports on every PR, which a required status check needs:
    # a check that never reports blocks the merge.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      c-code: ${{ steps.filter.outputs.c-code }}
      any-code: ${{ steps.filter.outputs.any-code }}
      python-suites: ${{ steps.suites.outputs.matrix }}
      python-suites-any: ${{ steps.suites.outputs.any }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # all_files feeds the Python Suites selection below.
          list-files: json
          filters: |
            all:
              - '**'
            python:
              - 'packages/robotics/robocar/simulation/**'
            c-code:
              - 'packages/**/main/**'
              - 'packages/**/components/**'
              - 'packages/**/*.c'
              - 'packages/**/*.h'
              - 'packages/**/*.cpp'
              - 'packages/**/*.hpp'
              - '.clang-format'
              - 'tools/cquality.sh'
              - '.github/workflows/test.yml'
              # Format Check installs the clang-format rev it names.
              - '.pre-commit-config.yaml'
            any-code:
              - 'packages/**'
              - '.pre-commit-config.yaml'
              - '.clang-format'
              - '.gitleaks.toml'
              - 'ruff.toml'
              - 'tools/**'

      # .github/python-suites.json lists each suite and the paths that select
      # it; tools/python-suites.py matches the changed files against them. The
      # file list goes in through a quoted heredoc, not env: an env value is
      # one execve string capped at 128 KiB, and a large PR's list exceeds it.
      # dorny emits the JSON on one line (a newline in a name is escaped), so
      # no line of it can end the heredoc, and nothing in it is expanded.
      - name: Select Python suites
        id: suites
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            python3 tools/python-suites.py --all
          else
            python3 tools/python-suites.py --changed-json - <<'CHANGED_FILES_JSON'
          ${{ steps.filter.outputs.all_files || '[]' }}
          CHANGED_FILES_JSON
          fi

  # The taxonomy's globs name paths across the whole tree (docs/, .github/,
  # .claude/, the root justfile ...), and a PR that deletes or renames one of
  # them makes a glob stale without touching the taxonomy. A path filter here
  # would be a second copy of those globs, and widening any-code to them
  # would run Code Quality Checks (about 2 minutes) on every docs-only PR. This
  # job runs only the stdlib drift test, on every event, in a few seconds.
  issue-labels-taxonomy:
    name: Label Taxonomy Drift Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run tools/test_issue_labels_taxonomy.py
        run: python3 -m unittest -v tools/test_issue_labels_taxonomy.py

  # The pre-commit hooks that guard CI configuration: the workflows (#855's
  # untrusted-text rule), every ESP-IDF version pin against the Kconfig symbol
  # list and the built-in partition tables, the root justfile's module list,
  # project-matrix.json, the just pin in setup-tools, which decides the
  # `just --dry-run` text check-flash-recipes reads, the release-please
  # component the OTA notify topic is built from (#1148) and the Claude Code
  # post-edit hook (#1130). any-code does not list those files, so a
  # workflow-, Dockerfile- or justfile-only PR used to run none of these
  # hooks (#1089). Widening any-code would run Code Quality
  # Checks (about 2 minutes) on every such PR; these hooks take a few seconds,
  # so they run here on every event. Commands live in .pre-commit-config.yaml;
  # this list names hooks. tools/test_workflows.py fails when a hook that
  # watches CI configuration is covered neither here nor by any-code.
  config-hooks:
    name: CI Config Hooks
    runs-on: ubuntu-latest
    env:
      HOOKS: >-
        workflow-structure
        actionlint
        kconfig-symbols
        check-md-links
        check-flash-recipes
        check-flash-recipes-tests
        release-please-versions
        check-component-extra-paths
        check-component-extra-paths-tests
        check-ota-consumer-agreement
        check-ota-consumer-agreement-tests
        post-edit-lint-hook
    steps:
      - uses: actions/checkout@v7.0.1

      # workflow-structure runs build-firmware.yml's tag check over every
      # release tag in the clone and skips when there are none, which a
      # checkout leaves (#1103). At depth 1 the fetch takes a few seconds.
      - name: Fetch the release tags
        run: git fetch --no-tags --depth=1 origin 'refs/tags/*:refs/tags/*'

      - name: Setup Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11.17'

      - name: Install uv and just
        uses: ./.github/actions/setup-tools
        with:
          just: true
          cache-suffix: config-hooks

      - name: Install pre-commit
        run: pip install pre-commit

      # For the actionlint hook, which runs the actionlint on PATH. The
      # release tarball is checked against the sha256 pinned here, taken from
      # that release's checksums file; bump both together.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      # Its own key: code-quality saves installed hook environments under
      # pre-commit-<hash>, and this job, which installs none, must not save
      # that key first.
      - name: Cache pre-commit repositories
        uses: actions/cache@v5.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-config-hooks-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run the hooks
        run: |
          set -uo pipefail
          read -ra hooks <<<"$HOOKS"
          failed=()
          for hook in "${hooks[@]}"; do
            pre-commit run "$hook" --all-files --show-diff-on-failure || failed+=("$hook")
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Failed hooks: ${failed[*]}. Run them with: pre-commit run <hook> --all-files"
            exit 1
          fi

  code-quality:
    name: Code Quality Checks
    needs: [detect-changes]
    if: >
      needs.detect-changes.outputs.any-code == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11.17'

      # uv and just at the pins in .github/actions/setup-tools. just is needed:
      # check-flash-recipes expands every flash recipe with `just --dry-run`
      # and fails without it rather than skipping (issue #608).
      - name: Install uv and just
        uses: ./.github/actions/setup-tools
        with:
          just: true

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v5.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # Install the simulation dev dependencies so the `ty check src/` pre-commit
      # hook can resolve imports and perform deep attribute checks. Without this,
      # ty only sees unresolved-import and silently skips the real type errors,
      # making the gate a no-op in CI while it is RED for a developer with the
      # sim deps installed (local<->CI parity gap, issue #369).
      # Since ADR-036 this installs the core (numpy, pymunk, pyyaml) and the dev
      # extra, not the viz extra. ty therefore resolves everything the plant,
      # the arena and the robot model import, and does not resolve cv2,
      # matplotlib, genesis, trimesh or spatialmath: calls into those from the
      # legacy camera_simulation.py, genesis_visualizer.py and main.py are
      # unchecked here, and checked for a developer who has synced `--extra viz`.
      - name: Sync simulation dev dependencies (for ty pre-commit hook)
        working-directory: packages/robotics/robocar/simulation
        # --locked: install the committed uv.lock and fail if pyproject.toml
        # has moved past it, rather than resolving fresh on every run. A fresh
        # resolve picked up vtk 9.7.2 before its Linux x86_64 wheels existed.
        run: uv sync --locked --extra dev

      # gitleaks (`--staged`) and check-credentials (`git diff --cached`) read
      # only staged files, and a CI checkout stages nothing, so here they would
      # scan nothing and still print Passed. They stay on as local commit
      # hooks; in CI the gitleaks job in security-secrets.yml scans each PR's
      # commits. actionlint runs in config-hooks, which installs it, on every
      # event.
      - name: Run pre-commit hooks
        env:
          SKIP: gitleaks,check-credentials,actionlint
        run: pre-commit run --all-files --show-diff-on-failure

  test-python-simulation:
    name: Python Simulation Tests
    needs: [detect-changes]
    if: >
      needs.detect-changes.outputs.python == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12.15'

      - name: Install uv
        uses: ./.github/actions/setup-tools
        with:
          cache-suffix: simulation

      - name: Install dependencies
        working-directory: packages/robotics/robocar/simulation
        run: uv sync --locked --extra dev  # committed uv.lock; see the ty-hook sync above

      - name: Run tests with coverage
        working-directory: packages/robotics/robocar/simulation
        run: |
          uv run --locked pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term \
            --cov-report=html \
            --cov-fail-under=25 \
            -v

      - name: Archive coverage reports
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-reports-${{ github.sha }}
          path: |
            packages/robotics/robocar/simulation/coverage.xml
            packages/robotics/robocar/simulation/htmlcov/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          files: packages/robotics/robocar/simulation/coverage.xml
          flags: simulation
          name: robocar-simulation
        continue-on-error: true

  # One job for every uv project whose tests need nothing beyond its own lock:
  # the tools/ suites (enclosure, mechanism, cadstd, glitchtip bridge), the
  # robocar behaviour twin (ADR-030), the live probe's offline tests (#619)
  # and the TTS generator's (#844), plus the component host suites, which
  # need only make and gcc (#1077). .github/python-suites.json lists each one
  # with its directory, command, apt packages and the paths that select it.
  # Add a suite there, not as another job or workflow.
  python-suites:
    name: Python Suites (${{ matrix.name }})
    needs: [detect-changes]
    if: needs.detect-changes.outputs.python-suites-any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.python-suites) }}
    env:
      # Every uv sync and uv run in the job, those inside just recipes
      # included, fails if the project's pyproject.toml has moved past its
      # uv.lock instead of resolving fresh (#457).
      UV_LOCKED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # libgl1: build123d's OCP wheel links libGL.so.1 at import. libosmesa6
      # gives VTK an off-screen GL, so mechanism's render test runs instead
      # of skipping. libcjson-dev links the twin. (Checked in an ubuntu:24.04
      # container: without libgl1, collection fails on the OCP import.)
      - name: Install system packages
        if: matrix.apt != ''
        env:
          APT: ${{ matrix.apt }}
        run: |
          read -ra pkgs <<<"$APT"
          sudo apt-get update -q
          sudo apt-get install -y -q "${pkgs[@]}"

      - name: Setup Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.14.8'

      - name: Install uv and just
        uses: ./.github/actions/setup-tools
        with:
          just: true
          cache-suffix: ${{ matrix.name }}

      # A suite with no uv project (the component host suites, built with
      # make) has no dir and skips this step.
      - name: Install ${{ matrix.dir }} from its uv.lock
        if: matrix.dir != ''
        working-directory: ${{ matrix.dir }}
        run: uv sync --locked

      - name: Run the suite
        env:
          SUITE_RUN: ${{ matrix.run }}
        run: bash -euo pipefail -c "$SUITE_RUN"

  # Holds the suites manifest, the lock checks and the uv/just install path in
  # place (tools/test_python_suites.py). Stdlib only, a few seconds, on every
  # event: a workflow-only PR runs no other job here that would catch a
  # workflow that went back to `uv sync --frozen`.
  python-suites-drift:
    name: Python Suites Drift Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run tools/test_python_suites.py
        run: python3 -m unittest -v tools/test_python_suites.py

  lint-c:
    name: C/C++ Linting
    needs: [detect-changes]
    if: >
      needs.detect-changes.outputs.c-code == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      # Advisory: uploads a report but does not fail the job. The find/exclude
      # list and cppcheck flags live once in tools/cquality.sh (shared with the
      # justfile lint-c recipe and the post-edit hook).
      - name: Run cppcheck (advisory)
        run: tools/cquality.sh lint --advisory

      - name: Upload cppcheck report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cppcheck-report-${{ github.sha }}
          path: tmp/cppcheck-report.txt
          retention-days: 30

  format-check:
    name: Format Check
    needs: [detect-changes]
    if: >
      needs.detect-changes.outputs.c-code == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # The version is the mirrors-clang-format rev in .pre-commit-config.yaml,
      # so this job and the pre-commit hook in Code Quality run one
      # clang-format, and a Renovate bump of the hook moves both (#1082).
      # Ubuntu 24.04's apt clang-format is another patch, which disagrees on
      # brace-wrapping in macro initializers. yq is the runner's (mikefarah),
      # read the way security-secrets.yml reads the gitleaks rev.
      - name: Install clang-format
        run: |
          set -euo pipefail
          rev=$(yq '.repos[] | select(.repo == "https://github.com/pre-commit/mirrors-clang-format") | .rev' .pre-commit-config.yaml)
          if [[ ! "$rev" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error file=.pre-commit-config.yaml::no mirrors-clang-format rev found (yq printed '${rev}')"
            exit 1
          fi
          pipx install "clang-format==${rev#v}"

      - name: Check C/C++ formatting
        # Shared find/exclude list lives in tools/cquality.sh (same as justfile format-check-c).
        run: |
          tools/cquality.sh format-check || {
            echo "::error::Code formatting issues found. Run 'just format-c' to fix."
            exit 1
          }

  test-summary:
    name: Test Summary
    needs: [detect-changes, config-hooks, code-quality, issue-labels-taxonomy, test-python-simulation, python-suites, python-suites-drift, lint-c, format-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- CI Config Hooks: ${{ needs.config-hooks.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Label Taxonomy Drift Test: ${{ needs.issue-labels-taxonomy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Python Simulation Tests: ${{ needs.test-python-simulation.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Python Suites: ${{ needs.python-suites.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Python Suites Drift Test: ${{ needs.python-suites-drift.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- C/C++ Linting: ${{ needs.lint-c.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Format Check: ${{ needs.format-check.result }}" >> $GITHUB_STEP_SUMMARY

          # Fail only on actual failures, not skips. lint-c is advisory and
          # stays out. detect-changes is in: when it fails every gated job is
          # skipped, and skips alone would pass.
          for result in \
            "${{ needs.detect-changes.result }}" \
            "${{ needs.config-hooks.result }}" \
            "${{ needs.code-quality.result }}" \
            "${{ needs.issue-labels-taxonomy.result }}" \
            "${{ needs.test-python-simulation.result }}" \
            "${{ needs.python-suites.result }}" \
            "${{ needs.python-suites-drift.result }}" \
            "${{ needs.format-check.result }}"; do
            if [ "$result" = "failure" ]; then
              echo "::error::Critical quality checks failed!"
              exit 1
            fi
          done

          echo "::notice::All test checks completed!"
