name: Build Guide Up-to-Date Check

on:
  push:
    branches: [main, develop, 'claude/**']
    paths:
      - '**/docs/build-guide.typ'
      - '**/docs/auto/pin_defs.typ'
      - '**/main/pin_config.h'
      - 'tools/typst/**'
      - 'docs/schematics/images/**'
      - '.github/workflows/build-guide-check.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '**/docs/build-guide.typ'
      - '**/docs/auto/pin_defs.typ'
      - '**/main/pin_config.h'
      - 'tools/typst/**'
      - 'docs/schematics/images/**'
      - '.github/workflows/build-guide-check.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pin the exact Typst version the committed PDFs were compiled with. PDF byte
  # output changes across compiler releases, so the freshness check below is only
  # meaningful against a fixed version. Bump this in the same commit that
  # recompiles every guide with the new CLI — and keep `typst_version` in each
  # project's justfile in sync, or local recompiles read as drift here.
  TYPST_VERSION: '0.15.0'

jobs:
  guides-up-to-date:
    name: Verify committed PDFs match Typst source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # GitHub-release binaries are blocked by this org's egress proxy, so the
      # CLI is built from crates.io via cargo. The binary is the only cached
      # artifact — keyed on the pinned version so a bump forces a rebuild.
      - name: Cache Typst CLI
        id: cache-typst
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/typst
          key: typst-cli-${{ runner.os }}-${{ env.TYPST_VERSION }}

      - name: Install Typst CLI
        if: steps.cache-typst.outputs.cache-hit != 'true'
        run: cargo install typst-cli --version "${TYPST_VERSION}" --locked

      # ~/.cargo/bin is on PATH by default on GitHub runners, but a cache-restored
      # binary skips the cargo step, so make PATH explicit for both paths.
      - name: Ensure cargo bin on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Recompile in place with the canonical, deterministic invocation and let
      # `git diff` surface drift — the same shape as schematics-check.yml.
      #
      #   --creation-timestamp 0  pins the embedded PDF timestamp (epoch), which
      #                           otherwise carries wall-clock time and never
      #                           reproduces.
      #   --ignore-system-fonts   embeds only Typst's bundled fonts, so a glyph's
      #                           fallback is identical on every machine instead
      #                           of pulling in whatever the OS happens to ship
      #                           (Linux FreeSans vs macOS SF/LastResort).
      #
      # Guides are discovered with `git ls-files` so new projects are covered
      # without editing this workflow.
      - name: Recompile every build guide and check for drift
        run: |
          set -euo pipefail
          typst --version
          status=0
          while IFS= read -r typ; do
            [ -n "$typ" ] || continue
            pdf="${typ%.typ}.pdf"
            if ! git ls-files --error-unmatch "$pdf" >/dev/null 2>&1; then
              echo "::error file=$typ::No committed PDF next to this guide ($pdf). Compile and commit it."
              status=1
              continue
            fi
            echo "::group::$typ"

            # Guides may import machine-generated pin data. Where a project
            # follows the convention (<proj>/docs/auto/pin_defs.typ generated
            # from <proj>/main/pin_config.h + <proj>/version.txt), regenerate it
            # here so a pin renamed or moved in the C header cannot silently
            # leave a *wrong* pin in a printed build guide — the PDF would
            # recompile cleanly from stale definitions and look up to date.
            proj="${typ%/docs/build-guide.typ}"
            defs="$proj/docs/auto/pin_defs.typ"
            drift_paths=("$pdf")
            if [ -f "$defs" ] && [ -f "$proj/main/pin_config.h" ] && [ -f "$proj/version.txt" ]; then
              python3 tools/typst/generate-pin-defs.py \
                "$proj/main/pin_config.h" "$proj/version.txt" "$defs"
              drift_paths+=("$defs")
            fi

            typst compile --creation-timestamp 0 --ignore-system-fonts --root "$PWD" "$typ" "$pdf"
            if git diff --quiet -- "${drift_paths[@]}"; then
              echo "up to date: ${drift_paths[*]}"
            else
              git --no-pager diff --stat -- "${drift_paths[@]}"
              echo "::error file=$pdf::Committed build-guide output is stale relative to $typ, its generated pin definitions, or the shared template / embedded assets."
              status=1
            fi
            echo "::endgroup::"
          done < <(git ls-files '**/docs/build-guide.typ')
          if [ "$status" -ne 0 ]; then
            echo "::error::One or more build guides are out of date. Regenerate with the project's own recipe, which pins the same CLI version and flags used here:"
            echo "::error::  just <project>::build-guide     # e.g. just robocar-unified::build-guide"
            echo "::error::then commit the regenerated pin_defs.typ and PDF."
            echo "::error::Equivalent by hand: mise exec typst@${TYPST_VERSION} -- typst compile --creation-timestamp 0 --ignore-system-fonts --root . <path>/build-guide.typ <path>/build-guide.pdf"
            exit 1
          fi
