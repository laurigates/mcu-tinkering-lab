name: Build Python Simulation

on:
  push:
    branches: [main, develop, 'claude/**']
    paths:
      - 'packages/robocar/simulation/**'
      - '.github/workflows/build-python-simulation.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/robocar/simulation/**'
      - '.github/workflows/build-python-simulation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-simulation:
    name: Build Python Simulation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11.16'

      # Pinned: uv 0.12.14 refuses to install dracopy into .venv/lib64
      # ("Cannot install into symlinked directory", astral-sh/uv#21692).
      # 0.12.10 is the last version this job ran green on. Bump deliberately.
      - name: Install UV
        run: pip install uv==0.12.10

      - name: Install dependencies
        working-directory: packages/robocar/simulation
        run: uv sync

      - name: Check imports
        working-directory: packages/robocar/simulation
        run: |
          uv run python -c "import sys; print(f'Python {sys.version}')"
          uv run python -c "import numpy; print(f'NumPy {numpy.__version__}')"
          uv run python -c "import pymunk; print(f'Pymunk {pymunk.version}')"
