name: Build Python Simulation

on:
  push:
    branches: [main, develop, 'claude/**']
    paths:
      - 'packages/robotics/robocar/simulation/**'
      - '.github/workflows/build-python-simulation.yml'
      - '.github/actions/setup-tools/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/robotics/robocar/simulation/**'
      - '.github/workflows/build-python-simulation.yml'
      - '.github/actions/setup-tools/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-simulation:
    name: Build Python Simulation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12.15'

      - name: Install uv
        uses: ./.github/actions/setup-tools
        with:
          cache-suffix: simulation

      - name: Install dependencies
        working-directory: packages/robotics/robocar/simulation
        run: uv sync --locked  # the committed uv.lock, never a fresh resolve

      - name: Check imports
        working-directory: packages/robotics/robocar/simulation
        run: |
          uv run --locked python -c "import sys; print(f'Python {sys.version}')"
          uv run --locked python -c "import numpy; print(f'NumPy {numpy.__version__}')"
          uv run --locked python -c "import pymunk; print(f'Pymunk {pymunk.version}')"
