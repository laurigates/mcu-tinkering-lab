name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Read-only by default; the caller job asks for what the reusable uses.
permissions:
  contents: read

jobs:
  claude:
    # The scopes reusable-claude.yml declares at its workflow level. A called
    # workflow gets no more than its caller job grants, so a narrower block
    # here fails the run at startup.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    # teuvo-concierge[bot] holds Actions: write (PRD-014 FR-026), so it can
    # re-run a past run of this workflow; a re-run it triggers does not start
    # Claude.
    if: |
      github.triggering_actor != 'teuvo-concierge[bot]' &&
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    uses: laurigates/.github/.github/workflows/reusable-claude.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
