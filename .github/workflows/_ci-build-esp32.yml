name: Reusable ESP-IDF CI Build

on:
  workflow_call:
    inputs:
      project:
        description: 'Project basename (used for binary filename and display)'
        required: true
        type: string
      project_path:
        description: 'Project directory relative to packages/ (e.g. robocar/main)'
        required: true
        type: string
      target:
        description: 'ESP-IDF target (esp32, esp32s3, etc.)'
        required: true
        type: string
      fetch_bluepad32:
        description: 'Whether to clone bluepad32 dependencies'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  IDF_VERSION: 'v5.4'

jobs:
  build:
    name: Build ${{ inputs.project }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Cache the espressif/idf Docker image as a tarball so subsequent jobs
      # skip the multi-GB `docker pull`. Keyed strictly on IDF_VERSION since
      # the image tag is immutable once published.
      - name: Cache ESP-IDF Docker image
        id: idf-image-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/esp-idf-docker
          key: esp-idf-docker-${{ runner.os }}-${{ env.IDF_VERSION }}

      - name: Load ESP-IDF Docker image from cache
        if: steps.idf-image-cache.outputs.cache-hit == 'true'
        run: docker load --input ~/.cache/esp-idf-docker/espressif-idf-${{ env.IDF_VERSION }}.tar

      - name: Pull and save ESP-IDF Docker image
        if: steps.idf-image-cache.outputs.cache-hit != 'true'
        run: |
          docker pull espressif/idf:${{ env.IDF_VERSION }}
          mkdir -p ~/.cache/esp-idf-docker
          docker save espressif/idf:${{ env.IDF_VERSION }} \
            -o ~/.cache/esp-idf-docker/espressif-idf-${{ env.IDF_VERSION }}.tar

      # Cache IDF Component Manager downloads (~/managed_components inside each
      # project) keyed on the lockfile. Falls back to the latest cache for this
      # project on lockfile change.
      - name: Cache IDF managed components
        uses: actions/cache@v5
        with:
          path: packages/${{ inputs.project_path }}/managed_components
          key: idf-components-${{ runner.os }}-${{ env.IDF_VERSION }}-${{ inputs.project }}-${{ hashFiles(format('packages/{0}/dependencies.lock', inputs.project_path), format('packages/{0}/main/idf_component.yml', inputs.project_path)) }}
          restore-keys: |
            idf-components-${{ runner.os }}-${{ env.IDF_VERSION }}-${{ inputs.project }}-

      - name: Fetch bluepad32 dependencies
        if: inputs.fetch_bluepad32
        working-directory: packages/${{ inputs.project_path }}
        run: |
          BP32_DIR="external/bluepad32"
          BTSTACK_ROOT="$BP32_DIR/external/btstack"
          BTSTACK_COMP="$BTSTACK_ROOT/port/esp32/components/btstack"

          echo "Cloning bluepad32 release_v3.10.3..."
          git clone --depth 1 --branch release_v3.10.3 \
            https://github.com/ricardoquesada/bluepad32.git "$BP32_DIR"
          cd "$BP32_DIR" && git submodule update --init --depth 1 external/btstack && cd -

          echo "Preparing btstack component..."
          for dir in src 3rd-party/bluedroid 3rd-party/hxcmod-player \
                     3rd-party/lwip/dhcp-server 3rd-party/lc3-google \
                     3rd-party/md5 3rd-party/micro-ecc 3rd-party/yxml \
                     platform/freertos platform/lwip; do
            mkdir -p "$BTSTACK_COMP/$(dirname "$dir")"
            cp -r "$BTSTACK_ROOT/$dir" "$BTSTACK_COMP/$dir"
          done
          mkdir -p "$BTSTACK_COMP/platform/embedded"
          for f in hal_time_ms.h hal_uart_dma.h hci_dump_embedded_stdout.h hci_dump_embedded_stdout.c; do
            cp "$BTSTACK_ROOT/platform/embedded/$f" "$BTSTACK_COMP/platform/embedded/"
          done
          echo "Dependencies ready"

      - name: Build ${{ inputs.project }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: ${{ inputs.target }}
          command: >-
            cd packages/${{ inputs.project_path }} &&
            idf.py build &&
            echo "# Build Size Analysis for ${{ inputs.project }}" > size-report.txt &&
            idf.py size >> size-report.txt 2>&1;
            idf.py size-components >> size-report.txt 2>&1; true

      - name: Host unit tests
        working-directory: packages/${{ inputs.project_path }}
        run: |
          # Directory convention differs by project (issue #482): robocar-unified
          # uses test/, the Pico reusable workflow's own convention is
          # tests/host/ — probe both rather than moving either layout.
          if [ -f test/CMakeLists.txt ] || [ -f tests/host/CMakeLists.txt ]; then
            HOST_TEST_DIR="test"
            [ -f test/CMakeLists.txt ] || HOST_TEST_DIR="tests/host"

            # cJSON is required for test_gemini_parse; test/CMakeLists.txt
            # degrades to a `message(STATUS ...)` skip when it can't find cJSON,
            # which would otherwise let that suite land green by absence.
            # Install it, then fail loudly if the skip message shows up anyway.
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libcjson-dev cmake

            CONFIGURE_LOG=$(mktemp)
            cmake -S "$HOST_TEST_DIR" -B build-host 2>&1 | tee "$CONFIGURE_LOG"
            if grep -q "cJSON not found" "$CONFIGURE_LOG"; then
              echo "::error::cJSON not found even after installing libcjson-dev — a host-test suite would be silently skipped"
              exit 1
            fi

            cmake --build build-host
            ctest --test-dir build-host --output-on-failure
          elif [ -f test/test_audio_core.c ] && [ -f main/audio_core.c ]; then
            # Shared-core pattern (no CMake, no ESP-IDF container needed) —
            # matches `just kids-audio::test` exactly, per local-ci-parity.
            cc -std=c11 -Wall -Wextra -I main -o /tmp/host_test_audio_core test/test_audio_core.c main/audio_core.c -lm
            /tmp/host_test_audio_core
          else
            echo "No host tests (test/CMakeLists.txt, tests/host/CMakeLists.txt, or test/test_audio_core.c) — skipping"
          fi

      - name: Archive firmware binaries
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.project }}-firmware-${{ github.sha }}
          path: |
            packages/${{ inputs.project_path }}/build/*.bin
            packages/${{ inputs.project_path }}/build/*.elf
            packages/${{ inputs.project_path }}/build/*.map
            packages/${{ inputs.project_path }}/build/bootloader/*.bin
            packages/${{ inputs.project_path }}/build/partition_table/*.bin
          retention-days: 30

      - name: Archive size analysis
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.project }}-size-report-${{ github.sha }}
          path: packages/${{ inputs.project_path }}/size-report.txt
          retention-days: 30

      - name: Check binary size limits
        working-directory: packages/${{ inputs.project_path }}
        run: |
          APP_SIZE=$(stat -c%s "build/${{ inputs.project }}.bin" 2>/dev/null || stat -f%z "build/${{ inputs.project }}.bin" 2>/dev/null || echo "0")

          WARNING_THRESHOLD=1572864  # 1.5 MB
          CRITICAL_THRESHOLD=1835008  # 1.75 MB

          echo "Application binary size: $APP_SIZE bytes ($(($APP_SIZE / 1024)) KB)"

          if [ $APP_SIZE -gt $CRITICAL_THRESHOLD ]; then
            echo "::error::Binary size ($APP_SIZE bytes) exceeds critical threshold ($CRITICAL_THRESHOLD bytes)!"
            echo "This may not fit in OTA partitions. Consider optimizing code or disabling features."
            exit 1
          elif [ $APP_SIZE -gt $WARNING_THRESHOLD ]; then
            echo "::warning::Binary size ($APP_SIZE bytes) exceeds warning threshold ($WARNING_THRESHOLD bytes)."
            echo "Consider optimizing code to leave headroom for OTA updates."
          else
            echo "::notice::Binary size is within acceptable limits."
          fi
